<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minesweeper</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a1a; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; font-family:'Courier New',monospace; color:#fff; padding:20px; }
  h1 { color:#ff0055; font-size:24px; margin-bottom:8px; text-shadow:0 0 15px #ff0055; letter-spacing:3px; }
  #info { font-size:15px; color:#aaa; margin-bottom:10px; display:flex; gap:30px; }
  #grid { display:grid; gap:3px; margin-bottom:12px; }
  .cell { width:36px; height:36px; background:#0d0d2e; border:1px solid #1e1e4e; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:bold; cursor:pointer; transition:background 0.1s; user-select:none; }
  .cell:hover:not(.revealed) { background:#1a1a4e; border-color:#ff0055; }
  .cell.revealed { background:#060612; border-color:#0d0d22; cursor:default; }
  .cell.flagged { background:#1a0a2e; border-color:#ff9900; }
  .cell.mine { background:#2e0a1a; border-color:#ff0055; }
  .n1{color:#00fff5;} .n2{color:#39ff14;} .n3{color:#ff0055;} .n4{color:#cc00ff;} .n5{color:#ff9900;} .n6{color:#ffe600;} .n7{color:#fff;} .n8{color:#aaa;}
  #msg { font-size:16px; color:#ff0055; min-height:22px; text-align:center; }
  #startBtn { margin-top:8px; background:#ff0055; color:#fff; border:none; padding:10px 28px; font-size:14px; font-family:'Courier New',monospace; font-weight:bold; border-radius:6px; cursor:pointer; letter-spacing:2px; }
  #hint { margin-top:6px; font-size:11px; color:#555; text-align:center; }
</style>
</head>
<body>
<h1>💣 MINESWEEPER</h1>
<div id="info"><span>💣 <b id="mines">10</b></span><span>🚩 <b id="flags">0</b></span></div>
<div id="grid"></div>
<div id="msg">Click=Revelar | Click derecho=Bandera</div>
<button id="startBtn">NUEVO JUEGO</button>
<div id="hint">Click izquierdo para revelar, click derecho para poner bandera</div>
<script>
const ROWS=9,COLS=9,MINES=10;
let board,flags,revealed,running;
const grid=document.getElementById('grid');

function init(){
  flags=0; revealed=0; running=true;
  document.getElementById('flags').textContent=0;
  document.getElementById('msg').textContent='';
  board=Array(ROWS).fill(null).map(()=>Array(COLS).fill(null).map(()=>({mine:false,num:0,revealed:false,flagged:false})));
  // Place mines
  let placed=0;
  while(placed<MINES){ const r=Math.floor(Math.random()*ROWS),c=Math.floor(Math.random()*COLS); if(!board[r][c].mine){ board[r][c].mine=true; placed++; } }
  // Count neighbors
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if(board[r][c].mine) continue;
    let n=0;
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){ const nr=r+dr,nc=c+dc; if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&board[nr][nc].mine) n++; }
    board[r][c].num=n;
  }
  renderGrid();
}

function renderGrid(){
  grid.style.gridTemplateColumns=`repeat(${COLS},36px)`;
  grid.innerHTML='';
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const cell=document.createElement('div');
    cell.className='cell'; const b=board[r][c];
    if(b.revealed){ cell.classList.add('revealed');
      if(b.mine){ cell.textContent='💥'; cell.classList.add('mine'); }
      else if(b.num>0){ cell.textContent=b.num; cell.classList.add('n'+b.num); }
    } else if(b.flagged){ cell.textContent='🚩'; cell.classList.add('flagged'); }
    cell.addEventListener('click',()=>reveal(r,c));
    cell.addEventListener('contextmenu',e=>{ flag(r,c); e.preventDefault(); });
    cell.addEventListener('touchstart',e=>{ e.preventDefault(); }); // handled below
    cell.addEventListener('touchend',e=>{ reveal(r,c); e.preventDefault(); });
    grid.appendChild(cell);
  }
}

function reveal(r,c){
  if(!running||board[r][c].revealed||board[r][c].flagged) return;
  board[r][c].revealed=true; revealed++;
  if(board[r][c].mine){ running=false; revealAll(); document.getElementById('msg').textContent='💥 ¡BOOM! Game Over'; return; }
  if(board[r][c].num===0) for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){ const nr=r+dr,nc=c+dc; if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&!board[nr][nc].revealed) reveal(nr,nc); }
  if(revealed===ROWS*COLS-MINES){ running=false; document.getElementById('msg').textContent='🏆 ¡GANASTE!'; if(window.ugWin)window.ugWin(); }
  renderGrid();
}

function flag(r,c){
  if(!running||board[r][c].revealed) return;
  board[r][c].flagged=!board[r][c].flagged;
  flags+=board[r][c].flagged?1:-1;
  document.getElementById('flags').textContent=flags;
  renderGrid();
}

function revealAll(){ for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(board[r][c].mine) board[r][c].revealed=true; renderGrid(); }

document.getElementById('startBtn').addEventListener('click',init);
init();
</script>
</body>
</html>
