<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Among Us</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a1a; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:'Courier New',monospace; color:#fff; overflow:hidden; }
h1 { color:#ff0055; font-size:18px; margin-bottom:2px; text-shadow:0 0 15px #ff0055; }
#roleTag { font-size:13px; font-weight:bold; margin-bottom:2px; min-height:18px; }
#info { font-size:11px; color:#aaa; margin-bottom:3px; display:flex; gap:12px; }
canvas { border:2px solid #ff0055; box-shadow:0 0 20px rgba(255,0,85,0.3); border-radius:4px; display:block; }
#msg { margin-top:4px; font-size:12px; color:#ff0055; min-height:16px; text-align:center; }
#btns { display:flex; gap:6px; margin-top:4px; flex-wrap:wrap; justify-content:center; }
.btn { border:none; padding:6px 12px; font-size:11px; font-family:'Courier New',monospace; font-weight:bold; border-radius:6px; cursor:pointer; }
#startBtn { background:#ff0055; color:#fff; }
#killBtn  { background:#880000; color:#fff; display:none; }
#emerBtn  { background:#ff9900; color:#000; }
#useBtn   { background:#39ff14; color:#000; display:none; }
#hint { font-size:9px; color:#444; text-align:center; margin-top:2px; }

/* Meeting screen */
#meeting {
  display:none; position:fixed; inset:0; background:#1a0a2e;
  z-index:100; flex-direction:column; align-items:center; justify-content:center;
  gap:10px; padding:16px;
}
#meeting.open { display:flex; }
#meetTitle { color:#ff9900; font-size:18px; font-weight:bold; text-align:center; text-shadow:0 0 15px #ff9900; }
#meetReason { color:#aaa; font-size:11px; text-align:center; margin-bottom:4px; }
#meetTimer { color:#ff0055; font-size:13px; font-weight:bold; }
#playersGrid {
  display:grid; grid-template-columns:repeat(4,1fr); gap:8px;
  max-width:480px; width:100%;
}
.pcard {
  background:#0d0d2e; border:2px solid #333; border-radius:10px;
  padding:8px 6px; cursor:pointer; text-align:center; transition:all .2s;
  position:relative;
}
.pcard:hover:not(.dead):not(.voted-out) { border-color:#ff0055; transform:scale(1.04); }
.pcard.selected { border-color:#ffe600; background:#1a1a3e; }
.pcard.dead { opacity:0.3; pointer-events:none; }
.pcard.voted-out { border-color:#ff0055; background:#2e0a0a; }
.pcard.is-me { border-color:#00fff5; }
.pcard .pemo { font-size:26px; }
.pcard .pname { font-size:9px; color:#aaa; margin-top:2px; }
.pcard .pvotes { font-size:11px; color:#ffe600; font-weight:bold; min-height:14px; }
.pcard .pskull { position:absolute; top:2px; right:4px; font-size:12px; }
#meetActions { display:flex; gap:8px; }
#confirmVote { background:#ff0055; color:#fff; border:none; padding:8px 20px; font-size:12px; font-family:'Courier New',monospace; font-weight:bold; border-radius:6px; cursor:pointer; }
#skipVote { background:#555; color:#fff; border:none; padding:8px 16px; font-size:12px; font-family:'Courier New',monospace; border-radius:6px; cursor:pointer; }
#meetResult { color:#ffe600; font-size:14px; font-weight:bold; text-align:center; min-height:20px; }
#voteStatus { color:#aaa; font-size:10px; text-align:center; }
</style>
</head>
<body>
<h1>🔴 AMONG US</h1>
<div id="roleTag"></div>
<div id="info">
  <span>TAREAS: <b id="itask">0</b>/10</span>
  <span>VIVOS: <b id="ialive">8</b></span>
  <span id="icd"></span>
</div>
<canvas id="c" width="480" height="280"></canvas>
<div id="msg">Presiona INICIAR</div>
<div id="btns">
  <button class="btn" id="startBtn" onclick="startGame()">INICIAR</button>
  <button class="btn" id="killBtn"  onclick="tryKill()">☠️ MATAR</button>
  <button class="btn" id="useBtn"   onclick="useTask()">⚡ USAR</button>
  <button class="btn" id="emerBtn"  onclick="callMeet('emer')">🚨 EMERGENCIA</button>
</div>
<div id="hint">WASD/Flechas=mover | ESPACIO=reportar cuerpo | Clic=matar</div>

<!-- Meeting -->
<div id="meeting">
  <div id="meetTitle">🚨 DISCUSIÓN</div>
  <div id="meetReason"></div>
  <div id="meetTimer">⏱ 20s</div>
  <div id="playersGrid"></div>
  <div id="voteStatus"></div>
  <div id="meetResult"></div>
  <div id="meetActions">
    <button id="confirmVote" onclick="confirmVote()">✅ VOTAR</button>
    <button id="skipVote" onclick="castVote(-1)">⏭ SALTAR</button>
  </div>
</div>

<script>
const C = document.getElementById('c');
const ctx = C.getContext('2d');
const VW = 480, VH = 280;
const MW = 1600, MH = 1000;

const COL = ['#ff0055','#ff9900','#ffe600','#39ff14','#00fff5','#0055ff','#cc00ff','#ff69b4'];
const EMO = ['🔴','🟠','🟡','🟢','🩵','🔵','🟣','🩷'];
const NAM = ['Rojo','Naranja','Amarillo','Verde','Cyan','Azul','Morado','Rosa'];

const ROOMS = [
  {x:50,y:50,w:260,h:160,n:'CAFETERÍA'},
  {x:380,y:50,w:210,h:160,n:'REACTOR'},
  {x:660,y:50,w:210,h:160,n:'ARMERÍA'},
  {x:940,y:50,w:190,h:160,n:'O2'},
  {x:1200,y:50,w:200,h:160,n:'LABORATORIO'},
  {x:50,y:290,w:200,h:160,n:'MOTOR IZQ'},
  {x:320,y:290,w:230,h:160,n:'ALMACÉN'},
  {x:620,y:290,w:230,h:160,n:'ADMINISTRACIÓN'},
  {x:920,y:290,w:210,h:160,n:'ELÉCTRICO'},
  {x:1200,y:290,w:200,h:160,n:'COMMS'},
  {x:50,y:530,w:230,h:160,n:'SEGURIDAD'},
  {x:350,y:530,w:230,h:160,n:'ARMAMENTO'},
  {x:650,y:530,w:230,h:160,n:'NAVEGACIÓN'},
  {x:950,y:530,w:210,h:160,n:'MEDBAY'},
  {x:1230,y:530,w:170,h:160,n:'BODEGA'},
];

const K = {};
document.addEventListener('keydown',e=>{K[e.key]=true;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();});
document.addEventListener('keyup',e=>{K[e.key]=false;});
let tx0=0,ty0=0;
C.addEventListener('touchstart',e=>{tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;e.preventDefault();},{passive:false});
C.addEventListener('touchmove',e=>{const dx=e.touches[0].clientX-tx0,dy=e.touches[0].clientY-ty0;K['ArrowRight']=dx>12;K['ArrowLeft']=dx<-12;K['ArrowDown']=dy>12;K['ArrowUp']=dy<-12;e.preventDefault();},{passive:false});
C.addEventListener('touchend',e=>{K['ArrowLeft']=K['ArrowRight']=K['ArrowUp']=K['ArrowDown']=false;e.preventDefault();},{passive:false});

let G=null, raf, meetTimerInterval=null;
let selectedVote=null;

function startGame(){
  cancelAnimationFrame(raf);
  clearInterval(meetTimerInterval);
  const imp=Math.random()<0.25;
  const impIdx=imp?[]:[1+Math.floor(Math.random()*6)];
  G={
    imp, px:MW/2, py:MH/2,
    bots:Array.from({length:7},(_,i)=>({
      i:i+1, x:100+Math.random()*(MW-200), y:100+Math.random()*(MH-200),
      tx:Math.random()*MW, ty:Math.random()*MH,
      timer:Math.random()*80, dead:false, body:false,
      isImp:impIdx.includes(i+1),
      kt:imp?99999:180+Math.random()*250
    })),
    dots:Array.from({length:10},()=>({x:80+Math.random()*(MW-160),y:80+Math.random()*(MH-160),done:false})),
    kcd:0, emerUsed:false, meet:false, running:true,
    votes:{}, myVoted:false, meetSec:20
  };
  document.getElementById('roleTag').textContent=imp?'😈 ERES EL IMPOSTOR':'👨‍🚀 ERES TRIPULANTE';
  document.getElementById('roleTag').style.color=imp?'#ff0055':'#00fff5';
  document.getElementById('killBtn').style.display=imp?'inline-block':'none';
  document.getElementById('useBtn').style.display='none';
  document.getElementById('emerBtn').disabled=false;
  document.getElementById('emerBtn').style.opacity='1';
  document.getElementById('meeting').classList.remove('open');
  document.getElementById('itask').textContent=0;
  document.getElementById('ialive').textContent=8;
  document.getElementById('icd').textContent='';
  setMsg(imp?'😈 Mata tripulantes y sabotea':'👨‍🚀 Completa tareas. Acércate a ⚡ y presiona USAR');
  selectedVote=null;
  raf=requestAnimationFrame(loop);
}

function loop(){
  raf=requestAnimationFrame(loop);
  if(G&&G.running&&!G.meet)update();
  draw();
}

function update(){
  const spd=3;
  if(K['ArrowLeft']||K['a']||K['A'])G.px-=spd;
  if(K['ArrowRight']||K['d']||K['D'])G.px+=spd;
  if(K['ArrowUp']||K['w']||K['W'])G.py-=spd;
  if(K['ArrowDown']||K['s']||K['S'])G.py+=spd;
  G.px=Math.max(10,Math.min(MW-10,G.px));
  G.py=Math.max(10,Math.min(MH-10,G.py));

  if(G.imp&&G.kcd>0){G.kcd--;document.getElementById('icd').textContent=G.kcd>0?'CD:'+Math.ceil(G.kcd/60)+'s':'KILL:LISTO';}

  const nt=!G.imp&&G.dots.find(d=>!d.done&&Math.hypot(G.px-d.x,G.py-d.y)<32);
  document.getElementById('useBtn').style.display=nt?'inline-block':'none';

  if(K[' ']){const nb=G.bots.find(b=>b.dead&&b.body&&Math.hypot(G.px-b.x,G.py-b.y)<40);if(nb){K[' ']=false;callMeet('body',nb);return;}}

  G.bots.forEach(b=>{
    if(b.dead)return;
    b.timer--;
    if(b.timer<=0){b.tx=80+Math.random()*(MW-160);b.ty=80+Math.random()*(MH-160);b.timer=60+Math.random()*120;}
    const dx=b.tx-b.x,dy=b.ty-b.y,d=Math.hypot(dx,dy);
    if(d>5){b.x+=dx/d*1.4;b.y+=dy/d*1.4;}
    b.x=Math.max(10,Math.min(MW-10,b.x));b.y=Math.max(10,Math.min(MH-10,b.y));
    if(b.isImp&&!G.imp){
      b.kt--;
      if(b.kt<=0){
        b.kt=200+Math.random()*200;
        const v=G.bots.find(t=>!t.dead&&!t.isImp&&Math.hypot(b.x-t.x,b.y-t.y)<50);
        if(v){v.dead=true;v.body=true;checkWin();}
        if(Math.hypot(b.x-G.px,b.y-G.py)<50){G.running=false;endGame('imp');}
      }
    }
  });
}

function useTask(){
  if(!G)return;
  const t=G.dots.find(d=>!d.done&&Math.hypot(G.px-d.x,G.py-d.y)<32);
  if(!t)return;
  t.done=true;
  const n=G.dots.filter(d=>d.done).length;
  document.getElementById('itask').textContent=n;
  setMsg('✅ Tarea '+n+'/10');
  setTimeout(()=>setMsg(''),1000);
  if(n>=10)endGame('crew_task');
}

function tryKill(){
  if(!G||!G.imp||G.kcd>0)return;
  const t=G.bots.find(b=>!b.dead&&!b.isImp&&Math.hypot(G.px-b.x,G.py-b.y)<70);
  if(t){t.dead=true;t.body=true;G.kcd=180;setMsg('☠️ Mataste a '+NAM[t.i]);checkWin();}
  else{setMsg('⚠️ Acércate más');setTimeout(()=>setMsg(''),1200);}
}

C.addEventListener('click',e=>{
  if(!G||!G.running||G.meet||!G.imp)return;
  if(G.kcd>0){setMsg('⏳ Cooldown');return;}
  const r=C.getBoundingClientRect();
  const wx=G.px+(e.clientX-r.left-VW/2),wy=G.py+(e.clientY-r.top-VH/2);
  const t=G.bots.find(b=>!b.dead&&!b.isImp&&Math.hypot(wx-b.x,wy-b.y)<50);
  if(t){t.dead=true;t.body=true;G.kcd=180;setMsg('☠️ Mataste a '+NAM[t.i]);checkWin();}
  else setMsg('⚠️ Acércate más');
});

function callMeet(reason,body){
  if(!G)return;
  if(reason==='emer'){
    if(G.emerUsed){setMsg('⚠️ Solo 1 emergencia por partida');return;}
    G.emerUsed=true;
    document.getElementById('emerBtn').disabled=true;
    document.getElementById('emerBtn').style.opacity='0.4';
  }
  G.meet=true;G.votes={};G.myVoted=false;G.meetSec=20;selectedVote=null;
  document.getElementById('meetReason').textContent=
    reason==='emer'?'¡Reunión de emergencia convocada!':'💀 Cuerpo de '+(body?NAM[body.i]:'alguien')+' encontrado';
  document.getElementById('meetResult').textContent='';
  document.getElementById('voteStatus').textContent='';
  buildPlayersGrid();
  document.getElementById('meeting').classList.add('open');

  // Bots vote after delay
  const all=[...G.bots.filter(b=>!b.dead)];
  all.forEach(b=>{
    setTimeout(()=>{
      if(!G||!G.meet)return;
      // Bots vote for player or random
      const targets=[...G.bots.filter(t=>!t.dead&&t!==b),{isME:true}];
      const pick=targets[Math.floor(Math.random()*targets.length)];
      const key=pick.isME?'ME':pick.i;
      G.votes[key]=(G.votes[key]||0)+1;
      updateVoteDisplay();
    },1500+Math.random()*3000);
  });

  // Meeting timer
  clearInterval(meetTimerInterval);
  meetTimerInterval=setInterval(()=>{
    G.meetSec--;
    document.getElementById('meetTimer').textContent='⏱ '+G.meetSec+'s';
    if(G.meetSec<=0){clearInterval(meetTimerInterval);if(!G.myVoted)castVote(-1);else resolveVote();}
  },1000);
}

function buildPlayersGrid(){
  const alive=[...G.bots.filter(b=>!b.dead),{isME:true,i:0}];
  document.getElementById('playersGrid').innerHTML=alive.map((p,idx)=>`
    <div class="pcard ${p.isME?'is-me':''}" id="pc_${p.isME?'ME':p.i}" onclick="selectVote('${p.isME?'ME':p.i}',${idx})">
      <div class="pemo">${p.isME?EMO[0]:EMO[p.i]}</div>
      <div class="pname">${p.isME?NAM[0]+' (TÚ)':NAM[p.i]}</div>
      <div class="pvotes" id="pv_${p.isME?'ME':p.i}">0 votos</div>
    </div>`).join('');
}

function selectVote(key,idx){
  if(G.myVoted)return;
  selectedVote=key;
  document.querySelectorAll('.pcard').forEach(c=>c.classList.remove('selected'));
  const el=document.getElementById('pc_'+key);
  if(el)el.classList.add('selected');
}

function confirmVote(){
  if(!G||G.myVoted||selectedVote===null)return;
  castVote(selectedVote);
}

function castVote(key){
  if(!G||G.myVoted)return;
  G.myVoted=true;
  if(key!==-1&&key!==null){
    G.votes[key]=(G.votes[key]||0)+1;
    updateVoteDisplay();
    document.getElementById('meetResult').textContent='Votaste por '+(key==='ME'?NAM[0]+' (tú)':NAM[key]);
  }else{
    document.getElementById('meetResult').textContent='Saltaste el voto';
  }
  setTimeout(resolveVote,2000);
}

function updateVoteDisplay(){
  if(!G)return;
  Object.entries(G.votes).forEach(([k,v])=>{
    const el=document.getElementById('pv_'+k);
    if(el)el.textContent=v+' voto'+(v>1?'s':'');
  });
  const total=Object.values(G.votes).reduce((a,b)=>a+b,0);
  const voters=G.bots.filter(b=>!b.dead).length+1;
  document.getElementById('voteStatus').textContent=total+'/'+voters+' han votado';
}

function resolveVote(){
  if(!G||!G.meet)return;
  clearInterval(meetTimerInterval);
  let maxV=0,ejKey=null;
  Object.entries(G.votes).forEach(([k,v])=>{if(v>maxV){maxV=v;ejKey=k;}});
  if(ejKey&&maxV>0){
    if(ejKey==='ME'){
      // Player voted out
      document.getElementById('meetResult').textContent='🚀 ¡Te expulsaron!';
      G.running=false;
      setTimeout(()=>{endMeet();endGame('imp');},2500);
    } else {
      const ej=G.bots.find(b=>b.i===parseInt(ejKey));
      if(ej){
        ej.dead=true;
        document.getElementById('meetResult').textContent=
          ej.isImp?'✅ '+NAM[ej.i]+' era el IMPOSTOR — ¡expulsado!':'❌ '+NAM[ej.i]+' era inocente...';
        setTimeout(()=>{endMeet();checkWin();},2500);
      }
    }
  }else{
    document.getElementById('meetResult').textContent='Empate — nadie expulsado';
    setTimeout(endMeet,2000);
  }
}

function endMeet(){if(!G)return;G.meet=false;clearInterval(meetTimerInterval);document.getElementById('meeting').classList.remove('open');}

function checkWin(){
  if(!G)return;
  const alive=G.bots.filter(b=>!b.dead).length+1;
  const imps=G.bots.filter(b=>b.isImp&&!b.dead).length+(G.imp?1:0);
  document.getElementById('ialive').textContent=alive;
  if(imps===0)endGame('crew_vote');
  else if(imps>=alive-imps)endGame('imp');
}

function endGame(r){
  if(!G)return;G.running=false;G.meet=false;
  clearInterval(meetTimerInterval);
  document.getElementById('meeting').classList.remove('open');
  setMsg({crew_task:'🏆 TRIPULACIÓN GANA — Tareas',crew_vote:'🏆 TRIPULACIÓN GANA — Impostor',imp:G.imp?'🏆 IMPOSTOR GANA':'💀 IMPOSTORES GANAN o te expulsaron'}[r]);
}

function setMsg(t){document.getElementById('msg').textContent=t;}

function drawChar(sx,sy,col,sz,dead){
  ctx.save();ctx.translate(sx,sy);
  if(dead){ctx.globalAlpha=.4;ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,0,sz*.75,sz*.28,0,0,Math.PI*2);ctx.fill();ctx.font='13px serif';ctx.textAlign='center';ctx.fillText('💀',0,5);ctx.globalAlpha=1;ctx.restore();return;}
  ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=8;
  ctx.beginPath();ctx.ellipse(0,4,sz*.52,sz*.58,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(0,-sz*.33,sz*.46,sz*.4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(100,210,255,.9)';ctx.shadowBlur=0;
  ctx.beginPath();ctx.ellipse(3,-sz*.37,sz*.22,sz*.17,.3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=3;
  ctx.fillRect(-sz*.4,sz*.26,sz*.32,sz*.32);ctx.fillRect(sz*.09,sz*.26,sz*.32,sz*.32);
  ctx.shadowBlur=0;ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,VW,VH);
  if(!G){ctx.fillStyle='#333';ctx.font='14px Courier New';ctx.textAlign='center';ctx.fillText('Presiona INICIAR',VW/2,VH/2);ctx.textAlign='left';return;}
  const offX=G.px-VW/2, offY=G.py-VH/2;
  ctx.save();ctx.translate(-offX,-offY);
  // Floor (only visible)
  ctx.fillStyle='#111128';ctx.fillRect(offX,offY,VW,VH);
  // Grid
  const gx=Math.floor(offX/60)*60,gy=Math.floor(offY/60)*60;
  ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;
  for(let x=gx;x<offX+VW;x+=60){ctx.beginPath();ctx.moveTo(x,offY);ctx.lineTo(x,offY+VH);ctx.stroke();}
  for(let y=gy;y<offY+VH;y+=60){ctx.beginPath();ctx.moveTo(offX,y);ctx.lineTo(offX+VW,y);ctx.stroke();}
  // Map border
  ctx.strokeStyle='rgba(255,0,85,.3)';ctx.lineWidth=4;ctx.strokeRect(0,0,MW,MH);
  // Rooms
  ROOMS.forEach(r=>{
    ctx.fillStyle='#16162e';ctx.fillRect(r.x,r.y,r.w,r.h);
    ctx.strokeStyle='#2a2a55';ctx.lineWidth=2;ctx.strokeRect(r.x,r.y,r.w,r.h);
    ctx.fillStyle='#2a2a55';ctx.font='11px Courier New';ctx.textAlign='center';
    ctx.fillText(r.n,r.x+r.w/2,r.y+r.h/2);ctx.textAlign='left';
  });
  // Tasks
  G.dots.forEach(d=>{
    const near=!G.imp&&Math.hypot(G.px-d.x,G.py-d.y)<32;
    ctx.fillStyle=d.done?'#39ff14':(near?'#fff':'#ffe600');
    ctx.shadowColor=d.done?'#39ff14':'#ffe600';ctx.shadowBlur=near?18:8;
    if(d.done){ctx.font='16px serif';ctx.textAlign='center';ctx.fillText('✓',d.x,d.y+6);ctx.textAlign='left';}
    else{ctx.beginPath();ctx.arc(d.x,d.y,near?10:7,0,Math.PI*2);ctx.fill();}
    ctx.shadowBlur=0;
  });
  // Kill range
  if(G.imp&&G.kcd<=0){ctx.strokeStyle='rgba(255,0,85,.2)';ctx.lineWidth=1;ctx.setLineDash([5,5]);ctx.beginPath();ctx.arc(G.px,G.py,70,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}
  // Bots
  G.bots.forEach(b=>{
    drawChar(b.x,b.y,COL[b.i],20,b.dead);
    if(!b.dead){ctx.fillStyle='#bbb';ctx.font='9px Courier New';ctx.textAlign='center';ctx.fillText(NAM[b.i],b.x,b.y+30);ctx.textAlign='left';}
  });
  ctx.restore();
  // Player always at center
  drawChar(VW/2,VH/2,COL[0],24,false);
  ctx.fillStyle='#ffe600';ctx.font='bold 10px Courier New';ctx.textAlign='center';
  ctx.fillText('TÚ',VW/2,VH/2+34);ctx.textAlign='left';
  // Minimap
  const mx=VW-86,my=VH-54,mw=80,mh=48,sx=mw/MW,sy=mh/MH;
  ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillRect(mx,my,mw,mh);ctx.strokeStyle='#555';ctx.strokeRect(mx,my,mw,mh);
  ROOMS.forEach(r=>{ctx.fillStyle='#1a1a3e';ctx.fillRect(mx+r.x*sx,my+r.y*sy,r.w*sx,r.h*sy);});
  G.bots.forEach(b=>{if(b.dead)return;ctx.fillStyle=COL[b.i];ctx.fillRect(mx+b.x*sx-1,my+b.y*sy-1,3,3);});
  ctx.fillStyle=COL[0];ctx.fillRect(mx+G.px*sx-2,my+G.py*sy-2,4,4);
  // Task bar
  const done=G.dots.filter(d=>d.done).length;
  ctx.fillStyle='#1a1a3e';ctx.fillRect(10,VH-10,VW-20,6);
  ctx.fillStyle='#39ff14';ctx.shadowColor='#39ff14';ctx.shadowBlur=4;
  ctx.fillRect(10,VH-10,(VW-20)*(done/10),6);ctx.shadowBlur=0;
}

raf=requestAnimationFrame(loop);
</script>
