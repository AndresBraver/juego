<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endless Runner</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a1a; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:'Courier New',monospace; color:#fff; }
  h1 { color:#39ff14; font-size:24px; margin-bottom:8px; text-shadow:0 0 15px #39ff14; letter-spacing:3px; }
  canvas { border:2px solid #39ff14; box-shadow:0 0 20px rgba(57,255,20,0.3); border-radius:4px; cursor:pointer; }
  #msg { margin-top:12px; font-size:16px; color:#39ff14; min-height:22px; text-align:center; }
  #hint { margin-top:6px; font-size:12px; color:#555; }
</style>
</head>
<body>
<h1>🏃 ENDLESS RUNNER</h1>
<canvas id="c" width="480" height="240"></canvas>
<div id="msg">Toca o presiona ESPACIO para saltar</div>
<div id="hint">Doble salto disponible</div>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const W=480,H=240,GROUND=180;
let player,obstacles,score,speed,running,animId,frame,stars;

function init(){
  player={x:70,y:GROUND,w:30,h=40,vy:0,jumps:0};
  obstacles=[]; score=0; speed=4; frame=0; running=true;
  stars=Array(40).fill(null).map(()=>({x:Math.random()*W,y:Math.random()*(GROUND-20),s:Math.random()*2+0.5}));
  document.getElementById('msg').textContent='';
  cancelAnimationFrame(animId);
  animate();
}

function animate(){ update(); draw(); animId=requestAnimationFrame(animate); }

function jump(){
  if(!running){ init(); return; }
  if(player.jumps<2){ player.vy=-10; player.jumps++; }
}

function update(){
  if(!running) return;
  frame++;
  score+=0.05; speed=4+Math.floor(score/30)*0.3;
  // Player
  player.vy+=0.5; player.y+=player.vy;
  if(player.y>=GROUND){ player.y=GROUND; player.vy=0; player.jumps=0; }
  // Obstacles
  if(frame%Math.max(60,100-Math.floor(score/10))===0){
    const h=30+Math.random()*40;
    obstacles.push({x:W+10,y:GROUND+player.h-h,w:22,h,type:Math.random()>0.5?0:1});
  }
  obstacles=obstacles.filter(o=>o.x>-30);
  obstacles.forEach(o=>o.x-=speed);
  // Stars parallax
  stars.forEach(s=>{ s.x-=0.5; if(s.x<0) s.x=W; });
  // Collision
  for(let o of obstacles){
    if(player.x+player.w-5>o.x&&player.x+5<o.x+o.w&&player.y+player.h>o.y&&player.y<o.y+o.h){
      running=false;
      document.getElementById('msg').textContent=`💀 GAME OVER — Puntos: ${Math.floor(score)} | Toca para reiniciar`;
    }
  }
}

function draw(){
  // Sky
  ctx.fillStyle='#0a0a1a'; ctx.fillRect(0,0,W,H);
  // Stars
  stars.forEach(s=>{ ctx.fillStyle=`rgba(255,255,255,${s.s*0.3})`; ctx.beginPath(); ctx.arc(s.x,s.y,s.s,0,Math.PI*2); ctx.fill(); });
  // Ground
  ctx.fillStyle='#1a3a1a'; ctx.fillRect(0,GROUND+40,W,H-GROUND-40);
  ctx.fillStyle='#39ff14'; ctx.shadowColor='#39ff14'; ctx.shadowBlur=4;
  ctx.fillRect(0,GROUND+40,W,3); ctx.shadowBlur=0;
  // Obstacles
  obstacles.forEach(o=>{
    if(o.type===0){ ctx.fillStyle='#ff0055'; ctx.shadowColor='#ff0055'; }
    else { ctx.fillStyle='#ffe600'; ctx.shadowColor='#ffe600'; }
    ctx.shadowBlur=8; ctx.fillRect(o.x,o.y,o.w,o.h); ctx.shadowBlur=0;
  });
  // Player
  const py=player.y+player.h;
  // Body
  ctx.fillStyle='#00fff5'; ctx.shadowColor='#00fff5'; ctx.shadowBlur=8;
  ctx.fillRect(player.x,player.y,player.w,player.h);
  // Face
  ctx.fillStyle='#fff'; ctx.shadowBlur=0;
  ctx.fillRect(player.x+18,player.y+8,6,6);
  ctx.fillRect(player.x+20,player.y+18,8,4);
  ctx.shadowBlur=0;
  // Score
  ctx.fillStyle='#fff'; ctx.font='bold 16px Courier New';
  ctx.fillText('PUNTOS: '+Math.floor(score),10,22);
  if(!running){
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,H);
  }
}

document.addEventListener('keydown',e=>{ if(e.key===' '||e.key==='ArrowUp'){ jump(); e.preventDefault(); } });
canvas.addEventListener('click',jump);
canvas.addEventListener('touchstart',e=>{ jump(); e.preventDefault(); },{passive:false});
draw();
</script>
</body>
</html>
