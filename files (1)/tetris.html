<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a1a; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; font-family:'Courier New',monospace; color:#fff; padding:10px; }
  h1 { color:#cc00ff; font-size:28px; margin-bottom:8px; text-shadow:0 0 15px #cc00ff; letter-spacing:4px; }
  #wrap { display:flex; gap:16px; align-items:flex-start; }
  canvas { border:2px solid #cc00ff; box-shadow:0 0 20px rgba(204,0,255,0.3); border-radius:4px; }
  #side { display:flex; flex-direction:column; gap:12px; min-width:100px; }
  .panel { background:#0d0d2e; border:1px solid #333; border-radius:8px; padding:12px; font-size:13px; color:#aaa; }
  .panel b { color:#fff; display:block; font-size:18px; margin-top:4px; }
  #nextCanvas { border:1px solid #333; border-radius:4px; }
  #msg { margin-top:12px; font-size:15px; color:#cc00ff; min-height:20px; text-align:center; }
  #startBtn { margin-top:8px; background:#cc00ff; color:#fff; border:none; padding:10px 28px; font-size:14px; font-family:'Courier New',monospace; font-weight:bold; border-radius:6px; cursor:pointer; letter-spacing:2px; }
  #hint { margin-top:6px; font-size:11px; color:#555; text-align:center; }
</style>
</head>
<body>
<h1>🧩 TETRIS</h1>
<div id="wrap">
  <canvas id="c" width="200" height="400"></canvas>
  <div id="side">
    <div class="panel">SIGUIENTE<canvas id="nextCanvas" width="80" height="80"></canvas></div>
    <div class="panel">PUNTOS<b id="pts">0</b></div>
    <div class="panel">NIVEL<b id="lvl">1</b></div>
    <div class="panel">LÍNEAS<b id="lines">0</b></div>
  </div>
</div>
<div id="msg">Presiona INICIO</div>
<button id="startBtn">INICIAR</button>
<div id="hint">← → Mover | ↑ Rotar | ↓ Bajar | Espacio: Caída</div>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const nc=document.getElementById('nextCanvas'), nctx=nc.getContext('2d');
const COLS=10,ROWS=20,SZ=20;
const PIECES=[
  {shape:[[1,1,1,1]],color:'#00fff5'},
  {shape:[[1,1],[1,1]],color:'#ffe600'},
  {shape:[[1,1,1],[0,1,0]],color:'#cc00ff'},
  {shape:[[1,1,1],[1,0,0]],color:'#ff9900'},
  {shape:[[1,1,1],[0,0,1]],color:'#0055ff'},
  {shape:[[1,1,0],[0,1,1]],color:'#39ff14'},
  {shape:[[0,1,1],[1,1,0]],color:'#ff0055'},
];
let board,current,next,score,level,lines,running,timer,interval;

function init(){
  board=Array(ROWS).fill(null).map(()=>Array(COLS).fill(0));
  score=0; level=1; lines=0;
  document.getElementById('pts').textContent=0;
  document.getElementById('lvl').textContent=1;
  document.getElementById('lines').textContent=0;
  document.getElementById('msg').textContent='';
  next=randomPiece();
  spawn();
  running=true;
  clearInterval(interval);
  interval=setInterval(drop,800);
}

function randomPiece(){
  const p=PIECES[Math.floor(Math.random()*PIECES.length)];
  return {shape:p.shape.map(r=>[...r]),color:p.color,x:Math.floor(COLS/2)-Math.floor(p.shape[0].length/2),y:0};
}

function spawn(){
  current=next; current.x=Math.floor(COLS/2)-Math.floor(current.shape[0].length/2); current.y=0;
  next=randomPiece();
  drawNext();
  if(collide(current)){running=false;clearInterval(interval);document.getElementById('msg').textContent='💀 GAME OVER — Puntos: '+score;}
}

function collide(p,dx=0,dy=0,shape=p.shape){
  for(let r=0;r<shape.length;r++) for(let c=0;c<shape[r].length;c++){
    if(!shape[r][c]) continue;
    const nx=p.x+c+dx, ny=p.y+r+dy;
    if(nx<0||nx>=COLS||ny>=ROWS||ny>=0&&board[ny][nx]) return true;
  }
  return false;
}

function rotate(shape){ return shape[0].map((_,i)=>shape.map(r=>r[i]).reverse()); }

function drop(){
  if(!running) return;
  if(!collide(current,0,1)) current.y++;
  else { lock(); clearLines(); spawn(); }
  draw();
}

function lock(){
  current.shape.forEach((row,r)=>row.forEach((v,c)=>{ if(v) board[current.y+r][current.x+c]=current.color; }));
}

function clearLines(){
  let cleared=0;
  for(let r=ROWS-1;r>=0;r--){
    if(board[r].every(c=>c)){ board.splice(r,1); board.unshift(Array(COLS).fill(0)); cleared++; r++; }
  }
  if(cleared){ lines+=cleared; score+=cleared*100*level; level=Math.floor(lines/10)+1;
    clearInterval(interval); interval=setInterval(drop,Math.max(100,800-level*70));
    document.getElementById('pts').textContent=score;
    document.getElementById('lvl').textContent=level;
    document.getElementById('lines').textContent=lines;
  }
}

function draw(){
  ctx.fillStyle='#0a0a1a'; ctx.fillRect(0,0,canvas.width,canvas.height);
  // Grid
  ctx.strokeStyle='rgba(255,255,255,0.04)'; ctx.lineWidth=0.5;
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    ctx.strokeRect(c*SZ,r*SZ,SZ,SZ);
    if(board[r][c]){ ctx.fillStyle=board[r][c]; ctx.shadowColor=board[r][c]; ctx.shadowBlur=4; ctx.fillRect(c*SZ+1,r*SZ+1,SZ-2,SZ-2); ctx.shadowBlur=0; }
  }
  // Current piece
  if(current) current.shape.forEach((row,r)=>row.forEach((v,c)=>{
    if(v){ ctx.fillStyle=current.color; ctx.shadowColor=current.color; ctx.shadowBlur=6;
      ctx.fillRect((current.x+c)*SZ+1,(current.y+r)*SZ+1,SZ-2,SZ-2); ctx.shadowBlur=0; }
  }));
}

function drawNext(){
  nctx.fillStyle='#0d0d2e'; nctx.fillRect(0,0,80,80);
  const s=16, ox=(80-next.shape[0].length*s)/2, oy=(80-next.shape.length*s)/2;
  next.shape.forEach((row,r)=>row.forEach((v,c)=>{
    if(v){ nctx.fillStyle=next.color; nctx.shadowColor=next.color; nctx.shadowBlur=4;
      nctx.fillRect(ox+c*s+1,oy+r*s+1,s-2,s-2); nctx.shadowBlur=0; }
  }));
}

document.addEventListener('keydown',e=>{
  if(!running) return;
  if(e.key==='ArrowLeft'&&!collide(current,-1,0)) current.x--;
  if(e.key==='ArrowRight'&&!collide(current,1,0)) current.x++;
  if(e.key==='ArrowDown') drop();
  if(e.key==='ArrowUp'){ const rot=rotate(current.shape); if(!collide(current,0,0,rot)) current.shape=rot; }
  if(e.key===' '){ while(!collide(current,0,1)) current.y++; drop(); }
  if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key)) e.preventDefault();
  draw();
});

document.getElementById('startBtn').addEventListener('click',init);
ctx.fillStyle='#0a0a1a'; ctx.fillRect(0,0,canvas.width,canvas.height);
</script>
</body>
</html>
