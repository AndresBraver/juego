<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bowling</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a1a; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:'Courier New',monospace; color:#fff; }
  h1 { color:#ffe600; font-size:26px; margin-bottom:6px; text-shadow:0 0 15px #ffe600; letter-spacing:3px; }
  #info { font-size:15px; color:#aaa; margin-bottom:8px; display:flex; gap:30px; }
  canvas { border:2px solid #ffe600; box-shadow:0 0 20px rgba(255,230,0,0.3); border-radius:4px; cursor:pointer; }
  #msg { margin-top:10px; font-size:16px; color:#ffe600; min-height:22px; text-align:center; }
  #startBtn { margin-top:8px; background:#ffe600; color:#000; border:none; padding:10px 28px; font-size:14px; font-family:'Courier New',monospace; font-weight:bold; border-radius:6px; cursor:pointer; letter-spacing:2px; }
  #hint { margin-top:6px; font-size:11px; color:#555; }
  #power-wrap { width:300px; height:14px; background:#1a1a3e; border-radius:7px; margin-bottom:8px; overflow:hidden; border:1px solid #333; }
  #power-bar { height:100%; width:0%; background:linear-gradient(90deg,#39ff14,#ffe600,#ff0055); border-radius:7px; transition:width 0.05s; }
</style>
</head>
<body>
<h1>🎳 BOWLING</h1>
<div id="info"><span>PUNTOS: <b id="pts">0</b></span><span>TURNO: <b id="frame">1</b>/10</span></div>
<div id="power-wrap"><div id="power-bar"></div></div>
<canvas id="c" width="360" height="420"></canvas>
<div id="msg">Mantén clic para cargar potencia, suelta para lanzar</div>
<button id="startBtn">INICIAR</button>
<div id="hint">Mueve el mouse para apuntar</div>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const W=360,H=420;
const LANE_X=60,LANE_W=240;
const PIN_POSITIONS=[[W/2,80],[W/2-20,100],[W/2+20,100],[W/2-40,120],[W/2,120],[W/2+40,120],[W/2-60,140],[W/2-20,140],[W/2+20,140],[W/2+60,140]];
let ball,pins,score,frameNum,state,power,powerDir,animId,running,aimX;

function init(){
  score=0; frameNum=1; state='aiming'; power=0; powerDir=1; aimX=W/2;
  document.getElementById('pts').textContent=0;
  document.getElementById('frame').textContent=1;
  document.getElementById('msg').textContent='Mueve el mouse para apuntar';
  document.getElementById('power-bar').style.width='0%';
  pins=PIN_POSITIONS.map((p,i)=>({x:p[0],y:p[1],r:10,alive:true,vx:0,vy:0}));
  ball={x:W/2,y:H-40,r:20,active:false,vx:0,vy:0};
  running=true;
  cancelAnimationFrame(animId);
  animate();
}

function animate(){ if(!running)return; update(); draw(); animId=requestAnimationFrame(animate); }

let charging=false;
function update(){
  if(state==='charging'){ power=Math.min(100,power+powerDir*2); if(power>=100||power<=0) powerDir*=-1; document.getElementById('power-bar').style.width=power+'%'; }
  if(state==='rolling'){
    ball.x+=ball.vx; ball.y+=ball.vy;
    // Wall bounce
    if(ball.x-ball.r<LANE_X){ ball.x=LANE_X+ball.r; ball.vx*=-0.5; }
    if(ball.x+ball.r>LANE_X+LANE_W){ ball.x=LANE_X+LANE_W-ball.r; ball.vx*=-0.5; }
    // Hit pins
    pins.forEach(p=>{ if(!p.alive) return; const d=Math.hypot(ball.x-p.x,ball.y-p.y); if(d<ball.r+p.r){ p.alive=false; score+=10; document.getElementById('pts').textContent=score; } });
    if(ball.y<-50||ball.y<80){
      const knocked=pins.filter(p=>!p.alive).length;
      document.getElementById('msg').textContent=knocked===10?'🎳 STRIKE! +10':knocked>0?`Derribaste ${knocked} pinos`:' No derribaste ninguno';
      setTimeout(()=>{
        frameNum++;
        if(frameNum>10){ running=false; document.getElementById('msg').textContent=`🏆 FIN — Puntos: ${score}`; return; }
        document.getElementById('frame').textContent=frameNum;
        init();
      },1500);
      state='done';
    }
  }
}

function draw(){
  ctx.fillStyle='#0a0a1a'; ctx.fillRect(0,0,W,H);
  // Lane
  const lgrad=ctx.createLinearGradient(LANE_X,0,LANE_X+LANE_W,0);
  lgrad.addColorStop(0,'#1a1208'); lgrad.addColorStop(0.5,'#2a1e0c'); lgrad.addColorStop(1,'#1a1208');
  ctx.fillStyle=lgrad; ctx.fillRect(LANE_X,0,LANE_W,H);
  ctx.strokeStyle='rgba(255,230,0,0.2)'; ctx.lineWidth=1;
  ctx.strokeRect(LANE_X,0,LANE_W,H);
  // Aim line
  if(state==='aiming'||state==='charging'){
    ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=1; ctx.setLineDash([8,8]);
    ctx.beginPath(); ctx.moveTo(ball.x,ball.y); ctx.lineTo(aimX,80); ctx.stroke();
    ctx.setLineDash([]);
  }
  // Pins
  pins.forEach(p=>{ if(!p.alive)return; ctx.fillStyle='#fff'; ctx.shadowColor='#ffe600'; ctx.shadowBlur=6; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; });
  // Ball
  const bgrad=ctx.createRadialGradient(ball.x-5,ball.y-5,2,ball.x,ball.y,ball.r);
  bgrad.addColorStop(0,'#555'); bgrad.addColorStop(1,'#111');
  ctx.fillStyle=bgrad; ctx.shadowColor='#ffe600'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.shadowBlur=0;
  ctx.beginPath(); ctx.arc(ball.x-6,ball.y-6,5,0,Math.PI*2); ctx.fill();
}

canvas.addEventListener('mousemove',e=>{ if(state!=='aiming'&&state!=='charging')return; const r=canvas.getBoundingClientRect(); aimX=Math.max(LANE_X+ball.r,Math.min(LANE_X+LANE_W-ball.r,e.clientX-r.left)); ball.x=aimX; draw(); });
canvas.addEventListener('mousedown',e=>{ if(state==='aiming'){ state='charging'; document.getElementById('msg').textContent='Suelta para lanzar'; } });
canvas.addEventListener('mouseup',e=>{ if(state==='charging'){ const force=power/100*12+3; const angle=Math.atan2(80-ball.y,aimX-ball.x); ball.vx=Math.cos(angle)*force; ball.vy=Math.sin(angle)*force; ball.active=true; state='rolling'; document.getElementById('power-bar').style.width='0%'; document.getElementById('msg').textContent=''; } });
canvas.addEventListener('touchstart',e=>{ if(state==='aiming'){ state='charging'; document.getElementById('msg').textContent='Suelta para lanzar'; } e.preventDefault(); },{passive:false});
canvas.addEventListener('touchmove',e=>{ if(state!=='aiming'&&state!=='charging')return; const r=canvas.getBoundingClientRect(); aimX=Math.max(LANE_X+ball.r,Math.min(LANE_X+LANE_W-ball.r,e.touches[0].clientX-r.left)); ball.x=aimX; e.preventDefault(); },{passive:false});
canvas.addEventListener('touchend',e=>{ if(state==='charging'){ const force=power/100*12+3; const angle=Math.atan2(80-ball.y,aimX-ball.x); ball.vx=Math.cos(angle)*force; ball.vy=Math.sin(angle)*force; state='rolling'; document.getElementById('power-bar').style.width='0%'; } e.preventDefault(); },{passive:false});
document.getElementById('startBtn').addEventListener('click',init);
draw();
</script>
</body>
</html>
