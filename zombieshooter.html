<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombie Shooter</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#050510; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:'Courier New',monospace; color:#fff; overflow:hidden; }
#ui { display:flex; gap:20px; margin-bottom:6px; font-size:12px; }
.sv { font-size:18px; font-weight:bold; color:#39ff14; text-shadow:0 0 10px #39ff14; }
.sl { font-size:9px; color:#555; letter-spacing:2px; text-align:center; }
canvas { display:block; border-radius:8px; box-shadow:0 0 30px rgba(57,255,20,0.2); cursor:crosshair; }
#msg { margin-top:6px; font-size:12px; color:#39ff14; min-height:16px; text-align:center; }
button { margin-top:6px; background:linear-gradient(135deg,#39ff14,#22cc00); color:#000; border:none; padding:8px 22px; font-size:13px; font-family:'Courier New',monospace; font-weight:bold; border-radius:8px; cursor:pointer; }
</style>
</head>
<body>
<div id="ui">
  <div><div class="sv" id="pts">0</div><div class="sl">PUNTOS</div></div>
  <div><div class="sv" id="lives">❤️❤️❤️</div><div class="sl">VIDAS</div></div>
  <div><div class="sv" id="wave">1</div><div class="sl">OLA</div></div>
  <div><div class="sv" id="ammo">∞</div><div class="sl">BALAS</div></div>
</div>
<canvas id="c" width="480" height="360"></canvas>
<div id="msg">Presiona INICIAR</div>
<button onclick="startGame()">INICIAR</button>
<script>

// Read player color from Ultra Games
const PLAYER_COLOR = (()=>{ try{return localStorage.getItem('ugColor')||'#00fff5';}catch(e){return '#00fff5';} })();
const C=document.getElementById('c'),ctx=C.getContext('2d');
const W=480,H=360;
let player,zombies,bullets,particles,score,lives,wave,running,animId,frame,shootCd,spawnTimer,mouseX,mouseY;
const keys={};

function startGame(){
  player={x:W/2,y:H/2,r:14,angle:0};
  zombies=[];bullets=[];particles=[];
  score=0;lives=3;wave=1;running=true;frame=0;shootCd=0;
  mouseX=W/2;mouseY=0;
  document.getElementById('pts').textContent=0;
  document.getElementById('lives').textContent='❤️❤️❤️';
  document.getElementById('wave').textContent=1;
  document.getElementById('msg').textContent='';
  spawnWave();
  cancelAnimationFrame(animId);animId=requestAnimationFrame(loop);
}

function spawnWave(){
  const n=5+wave*2;
  for(let i=0;i<n;i++){
    const side=Math.floor(Math.random()*4);
    let x,y;
    if(side===0){x=Math.random()*W;y=-30;}
    else if(side===1){x=W+30;y=Math.random()*H;}
    else if(side===2){x=Math.random()*W;y=H+30;}
    else{x=-30;y=Math.random()*H;}
    zombies.push({x,y,r:16,hp:1+Math.floor(wave/3),maxHp:1+Math.floor(wave/3),flash:0,spd:0.5+wave*0.05+Math.random()*0.2});
  }
}

function addParticles(x,y,color,n=6){
  for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,life:20,color,size:Math.random()*4+1});
}

function loop(){animId=requestAnimationFrame(loop);frame++;if(running)update();draw();}

function update(){
  shootCd=Math.max(0,shootCd-1);
  const spd=2.5;
  if(keys['w']||keys['W'])player.y=Math.max(player.r,player.y-spd);
  if(keys['s']||keys['S'])player.y=Math.min(H-player.r,player.y+spd);
  if(keys['a']||keys['A'])player.x=Math.max(player.r,player.x-spd);
  if(keys['d']||keys['D'])player.x=Math.min(W-player.r,player.x+spd);
  player.angle=Math.atan2(mouseY-player.y,mouseX-player.x);

  if((keys[' ']||keys['ArrowUp'])&&shootCd===0){
    shootCd=15;
    bullets.push({x:player.x+Math.cos(player.angle)*20,y:player.y+Math.sin(player.angle)*20,vx:Math.cos(player.angle)*10,vy:Math.sin(player.angle)*10,life:40});
  }

  bullets=bullets.filter(b=>{
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.x<0||b.x>W||b.y<0||b.y>H||b.life<=0)return false;
    for(let z of zombies){
      if(Math.sqrt((b.x-z.x)**2+(b.y-z.y)**2)<z.r+4){
        z.hp--;z.flash=8;
        addParticles(z.x,z.y,'#39ff14',5);
        if(z.hp<=0){addParticles(z.x,z.y,'#ff0055',10);z.dead=true;score+=10*(wave);document.getElementById('pts').textContent=score;}
        return false;
      }
    }
    return true;
  });

  zombies=zombies.filter(z=>{
    if(z.dead)return false;
    if(z.flash>0)z.flash--;
    const dx=player.x-z.x,dy=player.y-z.y,dist=Math.sqrt(dx*dx+dy*dy);
    z.x+=dx/dist*z.spd;z.y+=dy/dist*z.spd;
    if(dist<player.r+z.r){
      lives--;const lv=['❤️❤️❤️','❤️❤️🖤','❤️🖤🖤','🖤🖤🖤'];
      document.getElementById('lives').textContent=lv[3-lives]||'🖤🖤🖤';
      addParticles(player.x,player.y,'#ff0055',12);
      z.x+=dx/dist*-40;z.y+=dy/dist*-40;
      if(lives<=0){running=false;document.getElementById('msg').textContent='💀 GAME OVER — '+score+' pts';}
    }
    return true;
  });

  if(!zombies.length&&running){
    if(wave%3===0)try{localStorage.setItem('ugWin',Date.now());}catch(e){} window.parent.postMessage('ugWin','*');
    wave++;document.getElementById('wave').textContent=wave;
    document.getElementById('msg').textContent='⭐ OLA '+wave+'!';
    setTimeout(()=>{if(running){document.getElementById('msg').textContent='';spawnWave();}},1200);
  }

  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life--;return p.life>0;});
}

function draw(){
  // Background
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#020a02');bg.addColorStop(1,'#050f05');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // Grid
  ctx.strokeStyle='rgba(57,255,20,0.04)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // Particles
  particles.forEach(p=>{
    ctx.globalAlpha=p.life/20;ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;ctx.shadowBlur=0;

  // Zombies
  zombies.forEach(z=>{
    ctx.save();ctx.translate(z.x,z.y);
    if(z.flash>0)ctx.globalAlpha=0.4;
    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.beginPath();ctx.ellipse(2,4,z.r,z.r*0.4,0,0,Math.PI*2);ctx.fill();
    // Body
    ctx.fillStyle='#2a3a1a';ctx.shadowColor='#39ff14';ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(0,0,z.r,0,Math.PI*2);ctx.fill();
    // HP bar
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(-z.r,-z.r-8,z.r*2,4);
    ctx.fillStyle='#39ff14';ctx.shadowBlur=0;ctx.fillRect(-z.r,-z.r-8,z.r*2*(z.hp/z.maxHp),4);
    // Eyes
    ctx.fillStyle='#ff0055';ctx.shadowColor='#ff0055';ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(-5,-4,4,0,Math.PI*2);ctx.arc(5,-4,4,0,Math.PI*2);ctx.fill();
    // Mouth
    ctx.strokeStyle='#ff6644';ctx.lineWidth=2;ctx.shadowBlur=0;
    ctx.beginPath();ctx.arc(0,4,5,0,Math.PI);ctx.stroke();
    ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.restore();
  });

  // Bullets
  bullets.forEach(b=>{
    ctx.fillStyle='#ffe600';ctx.shadowColor='#ffe600';ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,230,0,0.3)';
    ctx.beginPath();ctx.arc(b.x-b.vx,b.y-b.vy,3,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  });

  // Player
  ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.angle);
  ctx.shadowColor='#00fff5';ctx.shadowBlur=20;
  // Body
  const g=ctx.createRadialGradient(-2,-2,2,0,0,player.r);
  g.addColorStop(0,'#ffffff');g.addColorStop(1,PLAYER_COLOR);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,player.r,0,Math.PI*2);ctx.fill();
  // Gun
  ctx.fillStyle='#aaa';ctx.shadowBlur=0;ctx.fillRect(8,-4,18,8);
  ctx.fillStyle='#888';ctx.fillRect(24,-3,6,6);
  // Aim sight
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;ctx.setLineDash([3,3]);
  ctx.beginPath();ctx.moveTo(30,0);ctx.lineTo(60,0);ctx.stroke();ctx.setLineDash([]);
  ctx.shadowBlur=0;ctx.restore();

  // Crosshair at mouse
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(mouseX-10,mouseY);ctx.lineTo(mouseX+10,mouseY);ctx.stroke();
  ctx.beginPath();ctx.moveTo(mouseX,mouseY-10);ctx.lineTo(mouseX,mouseY+10);ctx.stroke();
  ctx.beginPath();ctx.arc(mouseX,mouseY,6,0,Math.PI*2);ctx.stroke();
}

C.addEventListener('mousemove',e=>{const r=C.getBoundingClientRect();mouseX=e.clientX-r.left;mouseY=e.clientY-r.top;});
C.addEventListener('click',()=>{if(running&&shootCd===0&&!e.shiftKey){shootCd=15;bullets.push({x:player.x+Math.cos(player.angle)*20,y:player.y+Math.sin(player.angle)*20,vx:Math.cos(player.angle)*10,vy:Math.sin(player.angle)*10,life:40});}});
document.addEventListener('keydown',e=>{keys[e.key]=true;if([' ','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();});
document.addEventListener('keyup',e=>{keys[e.key]=false;});
</script>
</body>
</html>
