<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basketball</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a1a; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:'Courier New',monospace; color:#fff; }
  h1 { color:#ff9900; font-size:26px; margin-bottom:6px; text-shadow:0 0 15px #ff9900; }
  #info { font-size:15px; color:#aaa; margin-bottom:8px; display:flex; gap:30px; }
  canvas { border:2px solid #ff9900; box-shadow:0 0 20px rgba(255,153,0,0.3); border-radius:4px; }
  #msg { margin-top:10px; font-size:15px; color:#ff9900; min-height:22px; text-align:center; }
  button { margin-top:8px; background:#ff9900; color:#000; border:none; padding:10px 28px; font-size:14px; font-family:'Courier New',monospace; font-weight:bold; border-radius:6px; cursor:pointer; }
  #arrow { font-size:13px; color:#555; margin-top:6px; }
</style>
</head>
<body>
<h1>🏀 BASKETBALL</h1>
<div id="info"><span>GOLES: <b id="pts">0</b></span><span>TIROS: <b id="shots">10</b></span></div>
<canvas id="c" width="400" height="450"></canvas>
<div id="msg">Haz clic y arrastra hacia ARRIBA para lanzar</div>
<button onclick="startGame()">INICIAR</button>
<div id="arrow">↑ Arrastra hacia arriba desde la pelota</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const W = 400, H = 450;
const HX = W/2, HY = 110, HR = 32;

let ball, score, shots, running, animId;
let dragStart = null, dragCurrent = null, isDragging = false;

function startGame() {
  score = 0; shots = 10; running = true;
  document.getElementById('pts').textContent = 0;
  document.getElementById('shots').textContent = 10;
  document.getElementById('msg').textContent = 'Arrastra la pelota hacia arriba para lanzar';
  resetBall();
  cancelAnimationFrame(animId);
  loop();
}

function resetBall() {
  ball = { x: W/2 + (Math.random()-0.5)*100, y: H-70, r: 20, vx: 0, vy: 0, moving: false, scored: false };
  dragStart = null; dragCurrent = null; isDragging = false;
}

function loop() {
  if (!running) return;
  update();
  draw();
  animId = requestAnimationFrame(loop);
}

let hoopFlash = 0;
function update() {
  if (hoopFlash > 0) hoopFlash--;
  if (!ball.moving) return;

  ball.vy += 0.35;
  ball.x += ball.vx;
  ball.y += ball.vy;

  if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx) * 0.6; }
  if (ball.x > W-ball.r) { ball.x = W-ball.r; ball.vx = -Math.abs(ball.vx) * 0.6; }

  // Score check
  if (!ball.scored && ball.vy > 0 && Math.abs(ball.x - HX) < HR-4 && Math.abs(ball.y - HY) < 18) {
    ball.scored = true;
    score++;
    document.getElementById('pts').textContent = score;
    hoopFlash = 25;
  }

  if (ball.y > H + 60 || ball.y < -100) {
    shots--;
    document.getElementById('shots').textContent = shots;
    if (shots <= 0) {
      running = false;
      document.getElementById('msg').textContent = '🏆 FIN — Goles: ' + score + '/10';
      return;
    }
    resetBall();
  }
}

function draw() {
  ctx.fillStyle = '#0a0a1a'; ctx.fillRect(0,0,W,H);

  // Backboard
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  ctx.fillRect(W/2-55, 55, 110, 65);
  ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 2;
  ctx.strokeRect(W/2-55, 55, 110, 65);

  // Hoop
  const hc = hoopFlash > 0 ? '#39ff14' : '#ff9900';
  ctx.strokeStyle = hc; ctx.lineWidth = 5;
  ctx.shadowColor = hc; ctx.shadowBlur = hoopFlash > 0 ? 20 : 8;
  ctx.beginPath(); ctx.arc(HX, HY, HR, 0, Math.PI*2); ctx.stroke();
  ctx.shadowBlur = 0;

  // Net
  ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1;
  for (let i=0; i<7; i++) {
    const a = (i/7)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(HX+Math.cos(a)*HR, HY+Math.sin(a)*HR);
    ctx.lineTo(HX+Math.cos(a)*(HR*0.3), HY+45);
    ctx.stroke();
  }

  // Aim guide when dragging
  if (isDragging && dragStart && dragCurrent) {
    const dx = dragStart.x - dragCurrent.x;
    const dy = dragStart.y - dragCurrent.y;
    const power = Math.min(Math.hypot(dx, dy), 150) / 150;
    ctx.strokeStyle = `rgba(255,255,255,${power*0.5})`;
    ctx.lineWidth = 2; ctx.setLineDash([6,6]);
    // Draw trajectory preview
    let px = ball.x, py = ball.y;
    let pvx = dx * 0.12, pvy = dy * 0.12;
    ctx.beginPath(); ctx.moveTo(px, py);
    for (let i=0; i<20; i++) {
      px += pvx; py += pvy; pvy += 0.35;
      ctx.lineTo(px, py);
      if (py > H) break;
    }
    ctx.stroke(); ctx.setLineDash([]);
  }

  // Ball
  const g = ctx.createRadialGradient(ball.x-6, ball.y-6, 2, ball.x, ball.y, ball.r);
  g.addColorStop(0, '#ffcc44'); g.addColorStop(1, '#cc5500');
  ctx.fillStyle = g; ctx.shadowColor = '#ff9900'; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
  // Lines on ball
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.5; ctx.shadowBlur = 0;
  ctx.beginPath(); ctx.moveTo(ball.x-ball.r, ball.y); ctx.lineTo(ball.x+ball.r, ball.y); ctx.stroke();
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0.1, Math.PI-0.1); ctx.stroke();
}

// Mouse events
c.addEventListener('mousedown', e => {
  if (!running || ball.moving) return;
  const r = c.getBoundingClientRect();
  const mx = e.clientX-r.left, my = e.clientY-r.top;
  if (Math.hypot(mx-ball.x, my-ball.y) < ball.r+20) {
    dragStart = {x: mx, y: my};
    dragCurrent = {x: mx, y: my};
    isDragging = true;
  }
});

c.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const r = c.getBoundingClientRect();
  dragCurrent = {x: e.clientX-r.left, y: e.clientY-r.top};
});

c.addEventListener('mouseup', e => {
  if (!isDragging || !dragStart || !dragCurrent) return;
  const dx = dragStart.x - dragCurrent.x;
  const dy = dragStart.y - dragCurrent.y;
  if (Math.hypot(dx, dy) > 10) {
    ball.vx = dx * 0.12;
    ball.vy = dy * 0.12;
    ball.moving = true;
    document.getElementById('msg').textContent = '';
  }
  isDragging = false;
});

// Touch events
c.addEventListener('touchstart', e => {
  if (!running || ball.moving) return;
  const r = c.getBoundingClientRect();
  const tx = e.touches[0].clientX-r.left, ty = e.touches[0].clientY-r.top;
  dragStart = {x: tx, y: ty};
  dragCurrent = {x: tx, y: ty};
  isDragging = true;
  e.preventDefault();
}, {passive:false});

c.addEventListener('touchmove', e => {
  if (!isDragging) return;
  const r = c.getBoundingClientRect();
  dragCurrent = {x: e.touches[0].clientX-r.left, y: e.touches[0].clientY-r.top};
  e.preventDefault();
}, {passive:false});

c.addEventListener('touchend', e => {
  if (!isDragging || !dragStart || !dragCurrent) return;
  const dx = dragStart.x - dragCurrent.x;
  const dy = dragStart.y - dragCurrent.y;
  if (Math.hypot(dx, dy) > 10) {
    ball.vx = dx * 0.12;
    ball.vy = dy * 0.12;
    ball.moving = true;
  }
  isDragging = false;
  e.preventDefault();
}, {passive:false});

draw();
</script>
</body>
</html>
