<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bowling</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#050510; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; font-family:'Courier New',monospace; color:#fff; padding:12px; overflow:hidden; }
h1 { color:#ff9900; font-size:22px; margin-bottom:4px; text-shadow:0 0 15px #ff9900; }
#info { display:flex; gap:20px; margin-bottom:8px; font-size:12px; }
.sv { font-size:20px; font-weight:bold; color:#ff9900; text-shadow:0 0 10px #ff9900; }
.sl { font-size:9px; color:#555; letter-spacing:2px; text-align:center; }
canvas { display:block; border-radius:8px; box-shadow:0 0 30px rgba(255,150,0,0.2); }
#msg { margin-top:8px; font-size:13px; color:#ff9900; min-height:20px; text-align:center; }
button { margin-top:8px; background:linear-gradient(135deg,#ff9900,#ff6600); color:#fff; border:none; padding:8px 22px; font-size:13px; font-family:'Courier New',monospace; font-weight:bold; border-radius:8px; cursor:pointer; }
#hint { font-size:9px; color:#444; margin-top:4px; }
#power-bar { width:200px; height:10px; background:#1a1a3e; border-radius:5px; margin:6px auto 0; overflow:hidden; }
#power-fill { height:100%; width:0%; background:linear-gradient(90deg,#39ff14,#ffe600,#ff0055); border-radius:5px; transition:width .05s; }
</style>
</head>
<body>
<h1>🎳 BOWLING</h1>
<div id="info">
  <div><div class="sv" id="pts">0</div><div class="sl">PUNTOS</div></div>
  <div><div class="sv" id="frame">1/10</div><div class="sl">FRAME</div></div>
  <div><div class="sv" id="pins">10</div><div class="sl">PINES</div></div>
</div>
<canvas id="c" width="360" height="440"></canvas>
<div id="power-bar"><div id="power-fill"></div></div>
<div id="msg">Mantén clic para potencia</div>
<button onclick="startGame()">INICIAR</button>
<div id="hint">Arrastra para apuntar | Clic para potencia</div>
<script>

// Read player color from Ultra Games
const PLAYER_COLOR = (()=>{ try{return localStorage.getItem('ugColor')||'#00fff5';}catch(e){return '#00fff5';} })();
const C=document.getElementById('c'),ctx=C.getContext('2d');
const W=360,H=440;
let ball,pins,score,frame,roll,state,power,powerDir,animId,particles,ballX,aimX;

const PIN_POS=[];
function initPins(){
  PIN_POS.length=0;
  const rows=[[W/2],[W/2-18,W/2+18],[W/2-36,W/2,W/2+36],[W/2-54,W/2-18,W/2+18,W/2+54]];
  rows.forEach((row,ri)=>row.forEach(x=>PIN_POS.push({x,y:70+ri*30,alive:true})));
}

function startGame(){
  score=0;frame=1;roll=1;state='aim';power=0;powerDir=1;particles=[];
  ballX=W/2;aimX=W/2;
  document.getElementById('pts').textContent=0;
  document.getElementById('frame').textContent='1/10';
  document.getElementById('msg').textContent='Mantén clic para potencia';
  initPins();
  ball={x:aimX||W/2,y:H-50,r:18,vx:0,vy:0,moving:false,trail:[]};
  cancelAnimationFrame(animId);animId=requestAnimationFrame(loop);
}

function addParticles(x,y,color){
  for(let i=0;i<6;i++)particles.push({x,y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6-2,life:20,color});
}

let holding=false,holdStart=0;
C.addEventListener('mousedown',e=>{
  if(state!=='aim')return;
  holding=true;holdStart=Date.now();
  state='power';
});
C.addEventListener('mouseup',e=>{
  if(!holding)return;holding=false;
  if(state==='power'){
    state='rolling';
    ball.vx=((aimX-ball.x)/Math.abs(ball.y-70))*power*0.06;
    ball.vy=-power*0.07;
    ball.moving=true;
  }
});
C.addEventListener('mousemove',e=>{
  if(state!=='aim'&&state!=='power')return;
  const r=C.getBoundingClientRect();
  aimX=e.clientX-r.left;
});
C.addEventListener('touchstart',e=>{if(state==='aim'){holding=true;holdStart=Date.now();state='power';}e.preventDefault();},{passive:false});
C.addEventListener('touchend',e=>{
  if(!holding)return;holding=false;
  if(state==='power'){state='rolling';const ang=Math.atan2(80-ball.y,aimX-ball.x);ball.vx=Math.cos(ang)*power*0.08;ball.vy=Math.sin(ang)*power*0.08;ball.moving=true;}
  e.preventDefault();
},{passive:false});

function loop(){
  animId=requestAnimationFrame(loop);
  update();draw();
}

function update(){
  if(state==='power'){
    power=Math.min(100,power+2*powerDir);
    if(power>=100||power<=0)powerDir*=-1;
    document.getElementById('power-fill').style.width=power+'%';
  }
  if(!ball.moving)return;
  ball.trail.push({x:ball.x,y:ball.y});if(ball.trail.length>10)ball.trail.shift();
  ball.x+=ball.vx;ball.y+=ball.vy;
  if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx);}
  if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx);}

  // Hit pins
  PIN_POS.forEach(p=>{
    if(!p.alive)return;
    const dist=Math.sqrt((ball.x-p.x)**2+(ball.y-p.y)**2);
    if(dist<ball.r+12){
      p.alive=false;p.fallen=true;
      addParticles(p.x,p.y,'#ff9900');
      score+=10;document.getElementById('pts').textContent=score;
      document.getElementById('pins').textContent=PIN_POS.filter(p=>p.alive).length;
      ball.vx*=0.9;
    }
  });

  // Ball out of bounds top
  if(ball.y<50||ball.y<0){
    ball.moving=false;state='waiting';
    setTimeout(()=>{
      const alive=PIN_POS.filter(p=>p.alive).length;
      if(alive===0){document.getElementById('msg').textContent='🎳 ¡STRIKE!';}
      else if(roll===2){document.getElementById('msg').textContent='Score: '+score;}
      roll++;
      if(roll>2||alive===0){
        frame++;document.getElementById('frame').textContent=frame+'/10';roll=1;
        if(frame>10){
          document.getElementById('msg').textContent=`🏆 FIN — Puntos: ${score}`;
          try{localStorage.setItem('ugWin',Date.now());}catch(e){} window.parent.postMessage('ugWin','*');
          state='done';return;
        }
        initPins();
      }
      ball={x:aimX||W/2,y:H-40,r:22,vx:0,vy:0,moving:false,trail:[]};
      state='aim';power=0;document.getElementById('msg').textContent='Mantén clic para potencia';
    },1500);
  }
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.life--;return p.life>0;});
}

function draw(){
  // Background
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#050510');bg.addColorStop(1,'#0a0a20');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // Lane
  const laneG=ctx.createLinearGradient(60,0,300,0);
  laneG.addColorStop(0,'#1a1208');laneG.addColorStop(0.5,'#2a2010');laneG.addColorStop(1,'#1a1208');
  ctx.fillStyle=laneG;ctx.fillRect(60,0,240,H);

  // Lane lines
  ctx.strokeStyle='rgba(255,200,100,0.1)';ctx.lineWidth=1;
  [100,140,180,220,260,300].forEach(x=>{
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
  });

  // Arrows guide
  if(state==='aim'||state==='power'){
    ctx.strokeStyle='rgba(255,200,0,0.2)';ctx.lineWidth=2;ctx.setLineDash([8,8]);
    ctx.beginPath();ctx.moveTo(ball.x||W/2,ball.y||H-40);ctx.lineTo(aimX,80);ctx.stroke();ctx.setLineDash([]);
  }

  // Particles
  particles.forEach(p=>{
    ctx.globalAlpha=p.life/20;ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;ctx.shadowBlur=0;

  // Pins
  PIN_POS.forEach(p=>{
    if(!p.alive)return;
    ctx.shadowColor='#ffffff';ctx.shadowBlur=10;
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(p.x,p.y,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff0055';
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  });

  // Ball trail
  if(ball){
    ball.trail.forEach((t,i)=>{
      ctx.globalAlpha=(i/ball.trail.length)*0.3;
      ctx.fillStyle='#cc00ff';
      ctx.beginPath();ctx.arc(t.x,t.y,ball.r*(i/ball.trail.length),0,Math.PI*2);ctx.fill();
    });
    ctx.globalAlpha=1;

    // Ball
    const bg2=ctx.createRadialGradient(ball.x-6,ball.y-6,2,ball.x,ball.y,ball.r);
    bg2.addColorStop(0,'#ffffff');bg2.addColorStop(0.4,PLAYER_COLOR+'cc');bg2.addColorStop(1,PLAYER_COLOR);
    ctx.fillStyle=bg2;ctx.shadowColor='#cc00ff';ctx.shadowBlur=20;
    ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
    // Holes
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.shadowBlur=0;
    [[6,0],[0,8],[-6,0]].forEach(([dx,dy])=>{ctx.beginPath();ctx.arc(ball.x+dx,ball.y+dy,3,0,Math.PI*2);ctx.fill();});
  }
  ctx.shadowBlur=0;
}
</script>
</body>
</html>
