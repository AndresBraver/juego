<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bowling</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a1a; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:'Courier New',monospace; color:#fff; }
  h1 { color:#ffe600; font-size:26px; margin-bottom:6px; text-shadow:0 0 15px #ffe600; letter-spacing:3px; }
  #info { font-size:15px; color:#aaa; margin-bottom:6px; display:flex; gap:30px; }
  #power-wrap { width:300px; height:12px; background:#1a1a3e; border-radius:6px; margin-bottom:8px; overflow:hidden; border:1px solid #333; }
  #power-bar { height:100%; width:0%; background:linear-gradient(90deg,#39ff14,#ffe600,#ff0055); border-radius:6px; }
  canvas { border:2px solid #ffe600; box-shadow:0 0 20px rgba(255,230,0,0.3); border-radius:4px; cursor:pointer; }
  #msg { margin-top:10px; font-size:15px; color:#ffe600; min-height:20px; text-align:center; }
  #startBtn { margin-top:8px; background:#ffe600; color:#000; border:none; padding:10px 28px; font-size:14px; font-family:'Courier New',monospace; font-weight:bold; border-radius:6px; cursor:pointer; }
  #hint { margin-top:6px; font-size:11px; color:#555; text-align:center; }
</style>
</head>
<body>
<h1>🎳 BOWLING</h1>
<div id="info"><span>PUNTOS: <b id="pts">0</b></span><span>TURNO: <b id="frame">1</b>/5</span></div>
<div id="power-wrap"><div id="power-bar"></div></div>
<canvas id="c" width="360" height="420"></canvas>
<div id="msg">Mantén clic para cargar — suelta para lanzar</div>
<button id="startBtn">INICIAR</button>
<div id="hint">Mueve el mouse izq/der para apuntar</div>
<script>
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const W = 360, H = 420;
const LX = 60, LW = 240;
const PINS = [[W/2,80],[W/2-20,102],[W/2+20,102],[W/2-40,124],[W/2,124],[W/2+40,124],[W/2-60,146],[W/2-20,146],[W/2+20,146],[W/2+60,146]];
let ball, pins, score, frameNum, state, power, powerDir, animId, running, aimX, charging;

function init() {
  score = 0; frameNum = 1; state = 'aiming'; power = 0; powerDir = 1; charging = false; aimX = W/2;
  document.getElementById('pts').textContent = 0;
  document.getElementById('frame').textContent = 1;
  document.getElementById('msg').textContent = 'Apunta con el mouse — mantén clic para cargar';
  document.getElementById('power-bar').style.width = '0%';
  pins = PINS.map(p => ({ x: p[0], y: p[1], r: 10, alive: true }));
  ball = { x: W/2, y: H-40, r: 20, active: false, vx: 0, vy: 0 };
  running = true;
  cancelAnimationFrame(animId);
  animate();
}

function animate() { if (!running) return; update(); draw(); animId = requestAnimationFrame(animate); }

function update() {
  if (charging) {
    power = Math.min(100, power + powerDir*2);
    if (power >= 100 || power <= 0) powerDir *= -1;
    document.getElementById('power-bar').style.width = power + '%';
  }
  if (!ball.active) { ball.x = aimX; return; }
  ball.x += ball.vx; ball.y += ball.vy;
  if (ball.x - ball.r < LX) { ball.x = LX+ball.r; ball.vx *= -0.6; }
  if (ball.x + ball.r > LX+LW) { ball.x = LX+LW-ball.r; ball.vx *= -0.6; }
  pins.forEach(p => {
    if (!p.alive) return;
    if (Math.hypot(ball.x-p.x, ball.y-p.y) < ball.r+p.r) {
      p.alive = false; score += 10; document.getElementById('pts').textContent = score;
    }
  });
  if (ball.y < 60 || ball.y < -50) {
    const knocked = pins.filter(p => !p.alive).length;
    document.getElementById('msg').textContent = knocked === 10 ? '🎳 ¡STRIKE!' : knocked > 0 ? 'Derribaste ' + knocked + ' pinos' : 'Sin pinos...';
    ball.active = false;
    setTimeout(() => {
      frameNum++;
      if (frameNum > 5) { running = false; document.getElementById('msg').textContent = '🏆 FIN — Puntos: ' + score; return; }
      document.getElementById('frame').textContent = frameNum;
      document.getElementById('msg').textContent = 'Apunta con el mouse — mantén clic para cargar';
      pins = PINS.map(p => ({ x: p[0], y: p[1], r: 10, alive: true }));
      ball = { x: W/2, y: H-40, r: 20, active: false, vx: 0, vy: 0 };
      state = 'aiming'; power = 0; charging = false;
      document.getElementById('power-bar').style.width = '0%';
    }, 1200);
    state = 'done';
  }
}

function draw() {
  ctx.fillStyle = '#0a0a1a'; ctx.fillRect(0,0,W,H);
  const lg = ctx.createLinearGradient(LX,0,LX+LW,0);
  lg.addColorStop(0,'#1a1208'); lg.addColorStop(0.5,'#2a1e0c'); lg.addColorStop(1,'#1a1208');
  ctx.fillStyle = lg; ctx.fillRect(LX,0,LW,H);
  ctx.strokeStyle = 'rgba(255,230,0,0.15)'; ctx.lineWidth = 1; ctx.strokeRect(LX,0,LW,H);
  if (state === 'aiming' || charging) {
    ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth=1; ctx.setLineDash([6,6]);
    ctx.beginPath(); ctx.moveTo(ball.x, ball.y); ctx.lineTo(aimX, 100); ctx.stroke();
    ctx.setLineDash([]);
  }
  pins.forEach(p => {
    if (!p.alive) return;
    ctx.fillStyle = '#fff'; ctx.shadowColor = '#ffe600'; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
  });
  const bg = ctx.createRadialGradient(ball.x-5, ball.y-5, 2, ball.x, ball.y, ball.r);
  bg.addColorStop(0,'#555'); bg.addColorStop(1,'#111');
  ctx.fillStyle = bg; ctx.shadowColor = '#ffe600'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
}

canvas.addEventListener('mousemove', e => {
  if (ball.active) return;
  const r = canvas.getBoundingClientRect();
  aimX = Math.max(LX+ball.r, Math.min(LX+LW-ball.r, e.clientX-r.left));
  ball.x = aimX;
});
canvas.addEventListener('mousedown', e => { if (state === 'aiming' && !ball.active) { charging = true; state = 'charging'; } });
canvas.addEventListener('mouseup', e => {
  if (!charging) return;
  const angle = Math.atan2(80-ball.y, aimX-ball.x);
  const force = power/100*12+3;
  ball.vx = Math.cos(angle)*force; ball.vy = Math.sin(angle)*force;
  ball.active = true; charging = false;
  document.getElementById('power-bar').style.width = '0%';
});
canvas.addEventListener('touchstart', e => { if (state==='aiming'&&!ball.active) { charging=true; state='charging'; } e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchmove', e => {
  if (ball.active) return;
  const r = canvas.getBoundingClientRect();
  aimX = Math.max(LX+ball.r, Math.min(LX+LW-ball.r, e.touches[0].clientX-r.left));
  ball.x = aimX; e.preventDefault();
}, {passive:false});
canvas.addEventListener('touchend', e => {
  if (!charging) return;
  const angle = Math.atan2(80-ball.y, aimX-ball.x);
  const force = power/100*12+3;
  ball.vx = Math.cos(angle)*force; ball.vy = Math.sin(angle)*force;
  ball.active = true; charging = false;
  document.getElementById('power-bar').style.width = '0%';
  e.preventDefault();
}, {passive:false});

document.getElementById('startBtn').addEventListener('click', init);
draw();
</script>
</body>
</html>
