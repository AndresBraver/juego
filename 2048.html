<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#050510; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; font-family:'Orbitron',monospace; color:#fff; padding:12px; }
h1 { color:#ffe600; font-size:28px; margin-bottom:4px; text-shadow:0 0 20px #ffe600; letter-spacing:4px; }
#info { display:flex; gap:20px; margin-bottom:12px; }
.panel { background:linear-gradient(135deg,#0d0d2e,#1a1a4e); border:1px solid #2a2a5e; border-radius:10px; padding:10px 18px; text-align:center; min-width:90px; }
.pv { font-size:22px; font-weight:bold; color:#ffe600; text-shadow:0 0 10px #ffe600; }
.pl { font-size:9px; color:#555; letter-spacing:2px; margin-top:2px; }
#board { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:12px; background:linear-gradient(135deg,#0a0a20,#0d0d2e); border:1px solid #1e1e4e; border-radius:14px; box-shadow:0 0 40px rgba(255,230,0,0.15); max-width:340px; width:100%; }
.tile { aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:10px; font-weight:900; font-size:22px; transition:all .1s; position:relative; }
.t0 { background:#0d0d2e; border:1px solid #1a1a3e; }
.t2 { background:linear-gradient(135deg,#1a1a3e,#2a2a5e); color:#aaa; border:1px solid #3a3a7e; font-size:24px; }
.t4 { background:linear-gradient(135deg,#1a2a1a,#2a4a2a); color:#39ff14; border:1px solid #39ff14; box-shadow:0 0 10px rgba(57,255,20,0.2); }
.t8 { background:linear-gradient(135deg,#1a1a0a,#3a3a00); color:#ffe600; border:1px solid #ffe600; box-shadow:0 0 10px rgba(255,230,0,0.3); }
.t16 { background:linear-gradient(135deg,#2a1a00,#4a3000); color:#ff9900; border:1px solid #ff9900; box-shadow:0 0 12px rgba(255,150,0,0.3); }
.t32 { background:linear-gradient(135deg,#2a0a0a,#4a1a1a); color:#ff6644; border:1px solid #ff6644; box-shadow:0 0 12px rgba(255,100,68,0.4); font-size:20px; }
.t64 { background:linear-gradient(135deg,#2a0000,#5a0000); color:#ff0055; border:1px solid #ff0055; box-shadow:0 0 15px rgba(255,0,85,0.4); font-size:20px; }
.t128 { background:linear-gradient(135deg,#1a002a,#3a0055); color:#cc00ff; border:1px solid #cc00ff; box-shadow:0 0 15px rgba(204,0,255,0.5); font-size:17px; }
.t256 { background:linear-gradient(135deg,#002a2a,#005555); color:#00fff5; border:1px solid #00fff5; box-shadow:0 0 18px rgba(0,255,245,0.5); font-size:17px; }
.t512 { background:linear-gradient(135deg,#0a1a2a,#0a3a5a); color:#44aaff; border:1px solid #44aaff; box-shadow:0 0 20px rgba(68,170,255,0.6); font-size:17px; }
.t1024 { background:linear-gradient(135deg,#1a0a2a,#3a1a5a); color:#ff88ff; border:1px solid #ff88ff; box-shadow:0 0 25px rgba(255,136,255,0.7); font-size:13px; }
.t2048 { background:linear-gradient(135deg,#2a2a00,#5a5a00); color:#ffff00; border:2px solid var(--player-color,#ffff00); box-shadow:0 0 30px rgba(255,255,0,0.8); animation:pulse 0.5s ease; font-size:13px; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
.new { animation:pop .15s ease; }
@keyframes pop { 0%{transform:scale(0)} 100%{transform:scale(1)} }
#msg { margin-top:10px; font-size:14px; color:#ffe600; min-height:20px; text-align:center; }
button { margin-top:8px; background:linear-gradient(135deg,#ffe600,#ff9900); color:#000; border:none; padding:10px 28px; font-size:13px; font-family:'Courier New',monospace; font-weight:bold; border-radius:8px; cursor:pointer; box-shadow:0 0 20px rgba(255,230,0,0.3); }
#hint { font-size:9px; color:#444; margin-top:4px; }
</style>
</head>
<body>
<h1>2048</h1>
<div id="info">
  <div class="panel"><div class="pv" id="pts">0</div><div class="pl">PUNTOS</div></div>
  <div class="panel"><div class="pv" id="best">0</div><div class="pl">RECORD</div></div>
</div>
<div id="board"></div>
<div id="msg">Presiona INICIAR</div>
<button onclick="startGame()">INICIAR</button>
<div id="hint">Flechas o desliza para mover</div>
<script>

// Read player color from Ultra Games
const PLAYER_COLOR = (()=>{ try{return localStorage.getItem('ugColor')||'#00fff5';}catch(e){return '#00fff5';} })();
let grid,score,best=parseInt(localStorage.getItem('2048best')||'0'),running;
document.getElementById('best').textContent=best;

function startGame(){
  grid=Array(4).fill(null).map(()=>Array(4).fill(0));
  score=0;running=true;
  document.getElementById('pts').textContent=0;
  document.getElementById('msg').textContent='';
  addTile();addTile();render();
}

function addTile(){
  const empty=[];
  for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!grid[r][c])empty.push([r,c]);
  if(!empty.length)return;
  const [r,c]=empty[Math.floor(Math.random()*empty.length)];
  grid[r][c]=Math.random()<0.9?2:4;
  return[r,c];
}

function move(dir){
  if(!running)return;
  const prev=JSON.stringify(grid);
  const newGrid=Array(4).fill(null).map(()=>Array(4).fill(0));
  let pts=0;
  for(let i=0;i<4;i++){
    let row=[];
    for(let j=0;j<4;j++){
      const [r,c]=dir===0?[i,j]:dir===1?[i,3-j]:dir===2?[j,i]:dir===3?[3-j,i]:[0,0];
      if(grid[r][c])row.push(grid[r][c]);
    }
    // Merge
    for(let j=0;j<row.length-1;j++){
      if(row[j]===row[j+1]){row[j]*=2;pts+=row[j];row.splice(j+1,1);}
    }
    while(row.length<4)row.push(0);
    for(let j=0;j<4;j++){
      const [r,c]=dir===0?[i,j]:dir===1?[i,3-j]:dir===2?[j,i]:dir===3?[3-j,i]:[0,0];
      newGrid[r][c]=row[j];
    }
  }
  if(JSON.stringify(newGrid)===prev)return;
  grid=newGrid;score+=pts;
  if(score>best){best=score;localStorage.setItem('2048best',best);document.getElementById('best').textContent=best;}
  document.getElementById('pts').textContent=score;
  addTile();
  document.documentElement.style.setProperty('--player-color',PLAYER_COLOR);
  if(grid.flat().includes(2048)){document.getElementById('msg').textContent='🏆 ¡GANASTE! 2048!';try{localStorage.setItem('ugWin',Date.now());}catch(e){} window.parent.postMessage('ugWin','*');}
  else if(!canMove()){running=false;document.getElementById('msg').textContent='💀 Sin movimientos — '+score+' pts';}
  render();
}

function canMove(){
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    if(!grid[r][c])return true;
    if(c<3&&grid[r][c]===grid[r][c+1])return true;
    if(r<3&&grid[r][c]===grid[r+1][c])return true;
  }return false;
}

function render(){
  const board=document.getElementById('board');
  board.innerHTML='';
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    const v=grid[r][c];
    const tile=document.createElement('div');
    tile.className=`tile t${v}`;
    if(v)tile.textContent=v>=1024?v.toString():v;
    board.appendChild(tile);
  }
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')move(1);
  if(e.key==='ArrowLeft')move(0);
  if(e.key==='ArrowDown')move(3);
  if(e.key==='ArrowUp')move(2);
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();
});
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)){move(dx>0?1:0);}else{move(dy>0?3:2);}
});
</script>
</body>
</html>
