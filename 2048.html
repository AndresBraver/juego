<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a1a; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; font-family:'Courier New',monospace; color:#fff; padding:20px; }
  h1 { color:#ff9900; font-size:36px; margin-bottom:6px; text-shadow:0 0 15px #ff9900; letter-spacing:4px; }
  #info { font-size:16px; color:#aaa; margin-bottom:14px; display:flex; gap:30px; }
  #grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; background:#0d0d2e; border:2px solid #ff9900; border-radius:10px; padding:10px; width:320px; height:320px; box-shadow:0 0 20px rgba(255,153,0,0.3); }
  .cell { border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:bold; transition:all 0.1s; }
  #msg { margin-top:12px; font-size:16px; color:#ff9900; min-height:22px; }
  #startBtn { margin-top:10px; background:#ff9900; color:#000; border:none; padding:10px 28px; font-size:14px; font-family:'Courier New',monospace; font-weight:bold; border-radius:6px; cursor:pointer; letter-spacing:2px; }
  #hint { margin-top:6px; font-size:12px; color:#555; }
</style>
</head>
<body>
<h1>2048</h1>
<div id="info"><span>PUNTOS: <b id="pts">0</b></span><span>MEJOR: <b id="best">0</b></span></div>
<div id="grid"></div>
<div id="msg"></div>
<button id="startBtn">NUEVO JUEGO</button>
<div id="hint">Flechas del teclado o desliza en pantalla</div>
<script>
const grid=document.getElementById('grid');
const COLORS={'':['#1a1a3e','#555'],'2':['#ff9900','#000'],'4':['#ff6600','#fff'],'8':['#ff0055','#fff'],'16':['#cc00ff','#fff'],'32':['#00fff5','#000'],'64':['#39ff14','#000'],'128':['#ffe600','#000'],'256':['#ff9900','#fff'],'512':['#ff0055','#fff'],'1024':['#00fff5','#000'],'2048':['#fff','#000']};
let board,score,best=0,won=false;

function init(){
  board=Array(4).fill(null).map(()=>Array(4).fill(0));
  score=0; won=false;
  document.getElementById('pts').textContent=0;
  document.getElementById('msg').textContent='';
  addTile(); addTile(); render();
}

function addTile(){
  const empty=[];
  for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(!board[r][c]) empty.push([r,c]);
  if(!empty.length) return;
  const [r,c]=empty[Math.floor(Math.random()*empty.length)];
  board[r][c]=Math.random()<0.9?2:4;
}

function render(){
  grid.innerHTML='';
  board.forEach(row=>row.forEach(val=>{
    const cell=document.createElement('div');
    cell.className='cell';
    const [bg,fg]=COLORS[val+'']||['#fff','#000'];
    cell.style.background=bg; cell.style.color=fg;
    if(val) cell.textContent=val;
    grid.appendChild(cell);
  }));
}

function move(dir){
  let moved=false;
  const rotate=(b)=>b[0].map((_,i)=>b.map(r=>r[i]).reverse());
  let b=board.map(r=>[...r]);
  if(dir==='up') b=rotate(rotate(rotate(b)));
  if(dir==='left') {}
  if(dir==='down') b=rotate(b);
  if(dir==='right') b=rotate(rotate(b));
  b=b.map(row=>{
    let r=row.filter(x=>x);
    for(let i=0;i<r.length-1;i++) if(r[i]===r[i+1]){ r[i]*=2; score+=r[i]; r.splice(i+1,1); }
    while(r.length<4) r.push(0);
    return r;
  });
  if(dir==='up') b=rotate(b);
  if(dir==='right') b=rotate(rotate(b));
  if(dir==='down') b=rotate(rotate(rotate(b)));
  if(JSON.stringify(b)!==JSON.stringify(board)){ board=b; moved=true; }
  if(moved){ addTile(); document.getElementById('pts').textContent=score; if(score>best){ best=score; document.getElementById('best').textContent=best; } }
  if(board.flat().includes(2048)&&!won){ won=true; document.getElementById('msg').textContent='🏆 ¡GANASTE!'; if(window.ugWin)window.ugWin(); }
  render();
  // Check game over
  if(!board.flat().includes(0)){
    let over=true;
    for(let r=0;r<4;r++) for(let c=0;c<4;c++){
      if(c<3&&board[r][c]===board[r][c+1]) over=false;
      if(r<3&&board[r][c]===board[r+1][c]) over=false;
    }
    if(over&&!won) document.getElementById('msg').textContent='💀 GAME OVER — Puntos: '+score;
  }
}

document.addEventListener('keydown',e=>{
  const map={'ArrowLeft':'left','ArrowRight':'right','ArrowUp':'up','ArrowDown':'down'};
  if(map[e.key]){ move(map[e.key]); e.preventDefault(); }
});

let tx,ty;
document.addEventListener('touchstart',e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; });
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)){ move(dx>0?'right':'left'); } else { move(dy>0?'down':'up'); }
});

document.getElementById('startBtn').addEventListener('click',init);
init();
</script>
</body>
</html>
