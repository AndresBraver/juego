<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Invaders</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a1a; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:'Courier New',monospace; color:#fff; }
  h1 { color:#ffe600; font-size:24px; margin-bottom:8px; text-shadow:0 0 15px #ffe600; letter-spacing:3px; }
  #info { font-size:15px; color:#aaa; margin-bottom:10px; display:flex; gap:30px; }
  canvas { border:2px solid #ffe600; box-shadow:0 0 20px rgba(255,230,0,0.3); border-radius:4px; }
  #msg { margin-top:12px; font-size:16px; color:#ffe600; min-height:22px; }
  #startBtn { margin-top:10px; background:#ffe600; color:#000; border:none; padding:10px 28px; font-size:14px; font-family:'Courier New',monospace; font-weight:bold; border-radius:6px; cursor:pointer; letter-spacing:2px; }
</style>
</head>
<body>
<h1>🚀 SPACE INVADERS</h1>
<div id="info"><span>PUNTOS: <b id="pts">0</b></span><span>VIDAS: <b id="lives">3</b></span></div>
<canvas id="c" width="480" height="420"></canvas>
<div id="msg">Presiona INICIO — Flechas para mover, ESPACIO para disparar</div>
<button id="startBtn">INICIAR</button>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const W=480,H=420;
let player,bullets,enemies,enemyBullets,score,lives,running,animId,keys={},enemyDir,enemyTimer,shootTimer;

function init(){
  player={x:W/2-20,y:H-50,w:40,h=20};
  bullets=[]; enemyBullets=[];
  enemyDir=1; enemyTimer=0; shootTimer=0;
  score=0; lives=3;
  document.getElementById('pts').textContent=0;
  document.getElementById('lives').textContent=3;
  enemies=[];
  for(let r=0;r<4;r++) for(let c=0;c<10;c++) enemies.push({x:c*44+20,y:r*36+30,alive:true,r});
  running=true;
  document.getElementById('msg').textContent='';
  cancelAnimationFrame(animId);
  animate();
}

function animate(){ if(!running)return; update(); draw(); animId=requestAnimationFrame(animate); }

function update(){
  // Player move
  if(keys['ArrowLeft']&&player.x>0) player.x-=5;
  if(keys['ArrowRight']&&player.x+player.w<W) player.x+=5;
  // Shoot
  if(keys[' ']&&bullets.length<3){ bullets.push({x:player.x+player.w/2,y:player.y}); keys[' ']=false; }
  // Bullets
  bullets=bullets.filter(b=>{ b.y-=8; return b.y>0; });
  enemyBullets=enemyBullets.filter(b=>{ b.y+=4; return b.y<H; });
  // Enemy move
  enemyTimer++;
  if(enemyTimer>30){ enemyTimer=0;
    const alive=enemies.filter(e=>e.alive);
    const maxX=Math.max(...alive.map(e=>e.x)), minX=Math.min(...alive.map(e=>e.x));
    if((enemyDir>0&&maxX>W-44)||(enemyDir<0&&minX<4)){ enemyDir*=-1; enemies.forEach(e=>e.y+=12); }
    else enemies.forEach(e=>{ if(e.alive) e.x+=enemyDir*12; });
  }
  // Enemy shoot
  shootTimer++;
  if(shootTimer>60){ shootTimer=0;
    const alive=enemies.filter(e=>e.alive);
    if(alive.length){ const e=alive[Math.floor(Math.random()*alive.length)]; enemyBullets.push({x:e.x+16,y:e.y+24}); }
  }
  // Collisions bullets vs enemies
  for(let b of bullets){
    for(let e of enemies){
      if(!e.alive) continue;
      if(b.x>e.x&&b.x<e.x+32&&b.y>e.y&&b.y<e.y+24){ e.alive=false; b.y=-99; score+=10*(4-e.r); document.getElementById('pts').textContent=score; }
    }
  }
  // Enemy bullets vs player
  for(let b of enemyBullets){
    if(b.x>player.x&&b.x<player.x+player.w&&b.y>player.y&&b.y<player.y+player.h){
      lives--; document.getElementById('lives').textContent=lives; b.y=H+1;
      if(lives<=0){ running=false; document.getElementById('msg').textContent='💀 GAME OVER — Puntos: '+score; }
    }
  }
  // Enemies reach bottom
  if(enemies.some(e=>e.alive&&e.y+24>=H-60)){ running=false; document.getElementById('msg').textContent='💀 ¡INVASIÓN! Puntos: '+score; }
  if(enemies.every(e=>!e.alive)){ running=false; document.getElementById('msg').textContent='🏆 ¡GANASTE! Puntos: '+score; }
}

function draw(){
  ctx.fillStyle='#0a0a1a'; ctx.fillRect(0,0,W,H);
  // Enemies
  const emos=['👾','👽','🤖','🦑'];
  enemies.forEach(e=>{ if(!e.alive)return; ctx.font='24px serif'; ctx.fillText(emos[e.r],e.x,e.y+24); });
  // Player
  ctx.fillStyle='#00fff5'; ctx.shadowColor='#00fff5'; ctx.shadowBlur=10;
  ctx.fillRect(player.x+15,player.y,10,8);
  ctx.fillRect(player.x,player.y+8,player.w,12);
  ctx.shadowBlur=0;
  // Bullets
  ctx.fillStyle='#ffe600'; ctx.shadowColor='#ffe600'; ctx.shadowBlur=8;
  bullets.forEach(b=>{ ctx.fillRect(b.x-2,b.y,4,10); });
  ctx.fillStyle='#ff0055'; ctx.shadowColor='#ff0055';
  enemyBullets.forEach(b=>{ ctx.fillRect(b.x-2,b.y,4,10); });
  ctx.shadowBlur=0;
}

document.addEventListener('keydown',e=>{ keys[e.key]=true; e.preventDefault(); });
document.addEventListener('keyup',e=>{ keys[e.key]=false; });
document.getElementById('startBtn').addEventListener('click',init);

// Touch controls
let touchX=null;
canvas.addEventListener('touchstart',e=>{ touchX=e.touches[0].clientX; if(running)keys[' ']=true; e.preventDefault(); },{passive:false});
canvas.addEventListener('touchmove',e=>{
  const dx=e.touches[0].clientX-touchX;
  if(dx>10){keys['ArrowRight']=true;keys['ArrowLeft']=false;}
  else if(dx<-10){keys['ArrowLeft']=true;keys['ArrowRight']=false;}
  e.preventDefault();
},{passive:false});
canvas.addEventListener('touchend',e=>{ keys['ArrowLeft']=false;keys['ArrowRight']=false; e.preventDefault(); },{passive:false});
draw();
</script>
</body>
</html>
