<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Invaders</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#050510; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:'Courier New',monospace; color:#fff; overflow:hidden; }
canvas { display:block; border-radius:8px; box-shadow:0 0 40px rgba(255,230,0,0.3); }
#ui { display:flex; gap:24px; margin-bottom:8px; font-size:12px; }
.stat-val { font-size:20px; font-weight:bold; color:#ffe600; text-shadow:0 0 10px #ffe600; }
.stat-lbl { font-size:9px; color:#555; letter-spacing:2px; text-align:center; }
#msg { margin-top:8px; font-size:12px; color:#ffe600; min-height:16px; text-align:center; }
button { margin-top:8px; background:#ffe600; color:#000; border:none; padding:8px 22px; font-size:12px; font-family:'Courier New',monospace; font-weight:bold; border-radius:6px; cursor:pointer; }
</style>
</head>
<body>
<div id="ui">
  <div class="stat"><div class="stat-val" id="pts">0</div><div class="stat-lbl">PUNTOS</div></div>
  <div class="stat"><div class="stat-val" id="lives">❤️❤️❤️</div><div class="stat-lbl">VIDAS</div></div>
  <div class="stat"><div class="stat-val" id="wave">1</div><div class="stat-lbl">OLA</div></div>
</div>
<canvas id="c" width="480" height="400"></canvas>
<div id="msg">Presiona INICIAR</div>
<button onclick="startGame()">INICIAR</button>
<script>
const C=document.getElementById('c'),ctx=C.getContext('2d');
const W=480,H=400;
let player,bullets,enemies,eBullets,score,lives,running,animId,keys={},eDir,eTimer,eShootTimer,wave,particles,stars,frame,shootCd;

function startGame(){
  wave=1;score=0;lives=3;
  stars=Array.from({length:60},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+0.3,twinkle:Math.random()*Math.PI*2,speed:0.2+Math.random()*0.3}));
  initWave();
  document.getElementById('pts').textContent=0;
  document.getElementById('lives').textContent='❤️❤️❤️';
  document.getElementById('wave').textContent=1;
  document.getElementById('msg').textContent='';
  running=true;
  cancelAnimationFrame(animId);
  animId=requestAnimationFrame(loop);
}

function initWave(){
  player={x:W/2-20,y:H-50,w:40,h:20,trail:[]};
  bullets=[];eBullets=[];particles=[];eDir=1;eTimer=0;eShootTimer=0;shootCd=0;frame=0;
  enemies=[];
  const rows=Math.min(4+Math.floor(wave/2),6),cols=10;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)
    enemies.push({x:c*44+20,y:r*34+30,alive:true,r,flash:0});
}

function addParticles(x,y,color,n=8){
  for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-0.5)*7,vy:(Math.random()-0.5)*7,life:25,color,size:Math.random()*4+1});
}

function loop(){animId=requestAnimationFrame(loop);frame++;if(running)update();draw();}

function update(){
  shootCd=Math.max(0,shootCd-1);
  if(keys['ArrowLeft']&&player.x>0)player.x-=5;
  if(keys['ArrowRight']&&player.x+player.w<W)player.x+=5;
  if((keys[' ']||keys['z']||keys['Z'])&&shootCd===0){bullets.push({x:player.x+player.w/2,y:player.y,trail:[]});shootCd=12;}

  player.trail.push({x:player.x+player.w/2,y:player.y+player.h/2});
  if(player.trail.length>6)player.trail.shift();

  bullets=bullets.filter(b=>{
    b.trail.push({x:b.x,y:b.y});if(b.trail.length>8)b.trail.shift();
    b.y-=9;return b.y>0;
  });
  eBullets=eBullets.filter(b=>{b.y+=4+wave*0.3;return b.y<H;});

  eTimer++;
  if(eTimer>Math.max(25,45-wave*2)){
    eTimer=0;
    const alive=enemies.filter(e=>e.alive);
    if(!alive.length)return;
    const maxX=Math.max(...alive.map(e=>e.x)),minX=Math.min(...alive.map(e=>e.x));
    if((eDir>0&&maxX>W-44)||(eDir<0&&minX<4)){eDir*=-1;enemies.forEach(e=>e.y+=12);}
    else enemies.forEach(e=>{if(e.alive)e.x+=eDir*(10+wave);});
  }

  eShootTimer++;
  if(eShootTimer>Math.max(20,55-wave*5)){
    eShootTimer=0;
    const alive=enemies.filter(e=>e.alive);
    if(alive.length){const e=alive[Math.floor(Math.random()*alive.length)];eBullets.push({x:e.x+16,y:e.y+24,trail:[]});}
  }

  for(let b of bullets){
    for(let e of enemies){
      if(!e.alive)continue;
      if(b.x>e.x&&b.x<e.x+32&&b.y>e.y&&b.y<e.y+24){
        e.alive=false;b.y=-99;
        const pts=10*(4-e.r)*(1+Math.floor(wave/3));
        score+=pts;document.getElementById('pts').textContent=score;
        addParticles(e.x+16,e.y+12,['#ff0055','#ff9900','#ffe600','#39ff14'][e.r],10);
      }
    }
  }

  for(let b of eBullets){
    if(b.x>player.x&&b.x<player.x+player.w&&b.y>player.y&&b.y<player.y+player.h){
      lives--;
      const lv=['❤️❤️❤️','❤️❤️🖤','❤️🖤🖤','🖤🖤🖤'];
      document.getElementById('lives').textContent=lv[3-lives]||'🖤🖤🖤';
      addParticles(player.x+20,player.y,'#00fff5',12);b.y=H+1;
      if(lives<=0){running=false;document.getElementById('msg').textContent='💀 GAME OVER — Puntos: '+score;}
    }
  }

  enemies.forEach(e=>{if(e.flash>0)e.flash--;});

  if(enemies.some(e=>e.alive&&e.y+24>=H-60)){running=false;document.getElementById('msg').textContent='💀 ¡INVASIÓN! Puntos: '+score;}

  if(enemies.every(e=>!e.alive)){
    try{localStorage.setItem('ugWin',Date.now());}catch(ex){}
    wave++;document.getElementById('wave').textContent=wave;
    document.getElementById('msg').textContent='⭐ ¡OLA '+wave+'!';
    setTimeout(()=>{if(running){document.getElementById('msg').textContent='';initWave();}},1200);
    running=false;setTimeout(()=>{running=true;},1200);
  }

  stars.forEach(s=>{s.twinkle+=0.04;s.y+=s.speed;if(s.y>H)s.y=0;});
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life--;return p.life>0;});
}

const ALIEN_SHAPES=[
  // Row 0 - big alien
  (x,y,f)=>{ctx.fillStyle='#ff0055';ctx.shadowColor='#ff0055';ctx.shadowBlur=8;
    ctx.beginPath();ctx.ellipse(x+16,y+12,14,10,0,0,Math.PI*2);ctx.fill();
    ctx.fillRect(x+4,y+6,4,8);ctx.fillRect(x+24,y+6,4,8);
    if(f%20<10){ctx.fillRect(x,y+16,6,4);ctx.fillRect(x+26,y+16,6,4);}
    else{ctx.fillRect(x+2,y+20,6,4);ctx.fillRect(x+24,y+20,6,4);}
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+11,y+10,3,0,Math.PI*2);ctx.arc(x+21,y+10,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(x+12,y+10,1.5,0,Math.PI*2);ctx.arc(x+22,y+10,1.5,0,Math.PI*2);ctx.fill();},
  // Row 1
  (x,y,f)=>{ctx.fillStyle='#ff9900';ctx.shadowColor='#ff9900';ctx.shadowBlur=8;
    ctx.fillRect(x+6,y+4,20,16);ctx.fillRect(x+2,y+8,28,8);
    if(f%20<10){ctx.fillRect(x,y+12,4,6);ctx.fillRect(x+28,y+12,4,6);}
    else{ctx.fillRect(x+2,y+16,4,6);ctx.fillRect(x+26,y+16,4,6);}
    ctx.fillStyle='#fff';ctx.fillRect(x+8,y+8,4,5);ctx.fillRect(x+20,y+8,4,5);},
  // Row 2
  (x,y,f)=>{ctx.fillStyle='#ffe600';ctx.shadowColor='#ffe600';ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(x+16,y+12,12,0,Math.PI*2);ctx.fill();
    if(f%20<10){ctx.fillRect(x+2,y+18,8,5);ctx.fillRect(x+22,y+18,8,5);}
    else{ctx.fillRect(x+4,y+22,8,5);ctx.fillRect(x+20,y+22,8,5);}
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(x+11,y+10,3,0,Math.PI*2);ctx.arc(x+21,y+10,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffe600';ctx.beginPath();ctx.arc(x+16,y+16,4,0,Math.PI);ctx.stroke();},
  // Row 3
  (x,y,f)=>{ctx.fillStyle='#39ff14';ctx.shadowColor='#39ff14';ctx.shadowBlur=8;
    ctx.fillRect(x+4,y+2,24,20);ctx.fillRect(x,y+8,32,8);
    if(f%20<10){ctx.fillRect(x+4,y+20,6,6);ctx.fillRect(x+22,y+20,6,6);}
    else{ctx.fillRect(x+6,y+24,6,4);ctx.fillRect(x+20,y+24,6,4);}
    ctx.fillStyle='#000';ctx.fillRect(x+8,y+6,5,6);ctx.fillRect(x+19,y+6,5,6);},
];

function drawPlayer(){
  ctx.save();ctx.translate(player.x,player.y);
  // Engine glow
  ctx.shadowColor='#00fff5';ctx.shadowBlur=20;
  // Body
  const g=ctx.createLinearGradient(0,0,player.w,player.h);
  g.addColorStop(0,'#00fff5');g.addColorStop(0.5,'#0088aa');g.addColorStop(1,'#004455');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(player.w/2,0);ctx.lineTo(player.w,player.h);ctx.lineTo(0,player.h);ctx.closePath();ctx.fill();
  // Cockpit
  ctx.fillStyle='rgba(150,230,255,0.8)';
  ctx.beginPath();ctx.ellipse(player.w/2,player.h*0.4,6,8,0,0,Math.PI*2);ctx.fill();
  // Exhaust
  if(frame%4<2){
    ctx.fillStyle='rgba(255,150,0,0.8)';ctx.shadowColor='#ff9900';ctx.shadowBlur=10;
    ctx.beginPath();ctx.ellipse(player.w/2,player.h+4,5,8+Math.random()*4,0,0,Math.PI*2);ctx.fill();
  }
  ctx.shadowBlur=0;ctx.restore();
}

function draw(){
  // Space bg
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#020208');bg.addColorStop(1,'#050518');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // Stars
  stars.forEach(s=>{
    const a=0.4+Math.sin(s.twinkle)*0.4;
    ctx.fillStyle=`rgba(255,255,255,${a})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  });

  // Nebula
  for(let i=0;i<3;i++){
    const nx=80+i*160,ny=100+i*50;
    const ng=ctx.createRadialGradient(nx,ny,10,nx,ny,80);
    ng.addColorStop(0,`rgba(${i===0?'100,0,50':i===1?'0,50,100':'50,0,100'},0.05)`);
    ng.addColorStop(1,'transparent');
    ctx.fillStyle=ng;ctx.beginPath();ctx.arc(nx,ny,80,0,Math.PI*2);ctx.fill();
  }

  // Enemies
  enemies.forEach(e=>{
    if(!e.alive)return;
    ctx.save();
    if(e.flash>0){ctx.globalAlpha=0.3;}
    const drawFn=ALIEN_SHAPES[Math.min(e.r,ALIEN_SHAPES.length-1)];
    drawFn(e.x,e.y,frame);
    ctx.shadowBlur=0;ctx.restore();
  });

  // Bullets
  bullets.forEach(b=>{
    // Bullet trail
    b.trail.forEach((t,i)=>{
      ctx.fillStyle=`rgba(255,230,0,${i/b.trail.length*0.4})`;
      ctx.fillRect(t.x-1,t.y,2,3);
    });
    ctx.fillStyle='#ffe600';ctx.shadowColor='#ffe600';ctx.shadowBlur=10;
    ctx.beginPath();ctx.ellipse(b.x,b.y,3,6,0,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  });

  eBullets.forEach(b=>{
    ctx.fillStyle='#ff0055';ctx.shadowColor='#ff0055';ctx.shadowBlur=8;
    ctx.beginPath();ctx.ellipse(b.x,b.y,3,5,0,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  });

  // Particles
  particles.forEach(p=>{
    ctx.globalAlpha=p.life/25;ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*(p.life/25),0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;ctx.shadowBlur=0;

  drawPlayer();

  // Ground line
  ctx.strokeStyle='rgba(0,255,245,0.3)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,H-40);ctx.lineTo(W,H-40);ctx.stroke();
}

document.addEventListener('keydown',e=>{keys[e.key]=true;if([' ','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();});
document.addEventListener('keyup',e=>{keys[e.key]=false;});
let tx=null;
C.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;if(running)bullets.push({x:player.x+player.w/2,y:player.y,trail:[]});e.preventDefault();},{passive:false});
C.addEventListener('touchmove',e=>{
  const dx=e.touches[0].clientX-tx;
  if(dx>10){keys['ArrowRight']=true;keys['ArrowLeft']=false;}
  else if(dx<-10){keys['ArrowLeft']=true;keys['ArrowRight']=false;}
  e.preventDefault();
},{passive:false});
C.addEventListener('touchend',e=>{keys['ArrowLeft']=false;keys['ArrowRight']=false;e.preventDefault();},{passive:false});
</script>
</body>
</html>
