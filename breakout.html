<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a1a; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:'Courier New',monospace; color:#fff; }
  h1 { color:#00fff5; font-size:28px; margin-bottom:8px; text-shadow:0 0 15px #00fff5; letter-spacing:4px; }
  #info { font-size:16px; color:#aaa; margin-bottom:12px; display:flex; gap:30px; }
  canvas { border:2px solid #00fff5; box-shadow:0 0 20px rgba(0,255,245,0.3); border-radius:4px; }
  #msg { margin-top:14px; font-size:16px; color:#00fff5; min-height:24px; }
  #startBtn { margin-top:10px; background:#00fff5; color:#000; border:none; padding:10px 28px; font-size:14px; font-family:'Courier New',monospace; font-weight:bold; border-radius:6px; cursor:pointer; }
</style>
</head>
<body>
<h1>🧱 BREAKOUT</h1>
<div id="info"><span>PUNTOS: <b id="pts">0</b></span><span>VIDAS: <b id="lives">3</b></span></div>
<canvas id="c" width="480" height="400"></canvas>
<div id="msg">Presiona INICIO para jugar</div>
<button id="startBtn">INICIAR</button>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 480, H = 400;
const ROWS = 5, COLS = 10, BW = 42, BH = 16, PAD = 3;
const COLORS = ['#ff0055','#ff6600','#ffe600','#39ff14','#00fff5'];
let paddle, ball, bricks, score, lives, running, animId, launched;

function init() {
  paddle = { x: W/2 - 40, y: H - 30, w: 80, h: 12 };
  ball = { x: W/2, y: H - 50, r: 8, vx: 3.5, vy: -3.5 };
  launched = false;
  score = 0; lives = 3;
  document.getElementById('pts').textContent = 0;
  document.getElementById('lives').textContent = 3;
  bricks = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      bricks.push({ x: c*(BW+PAD)+5, y: r*(BH+PAD)+40, alive: true, color: COLORS[r] });
  running = true;
  document.getElementById('msg').textContent = 'Mueve el mouse — clic para lanzar';
  cancelAnimationFrame(animId);
  animate();
}

function animate() {
  if (!running) return;
  update(); draw();
  animId = requestAnimationFrame(animate);
}

function update() {
  if (!launched) { ball.x = paddle.x + paddle.w/2; return; }
  ball.x += ball.vx; ball.y += ball.vy;
  if (ball.x - ball.r < 0 || ball.x + ball.r > W) ball.vx *= -1;
  if (ball.y - ball.r < 0) ball.vy *= -1;
  if (ball.y + ball.r > H) {
    lives--;
    document.getElementById('lives').textContent = lives;
    if (lives <= 0) { running = false; document.getElementById('msg').textContent = '💀 GAME OVER — Puntos: ' + score; return; }
    ball = { x: paddle.x + paddle.w/2, y: H - 50, r: 8, vx: 3.5, vy: -3.5 };
    launched = false;
  }
  if (ball.y + ball.r >= paddle.y && ball.x >= paddle.x && ball.x <= paddle.x + paddle.w && ball.vy > 0) {
    ball.vy *= -1;
    ball.vx = ((ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2)) * 5;
  }
  for (let b of bricks) {
    if (!b.alive) continue;
    if (ball.x+ball.r > b.x && ball.x-ball.r < b.x+BW && ball.y+ball.r > b.y && ball.y-ball.r < b.y+BH) {
      b.alive = false; ball.vy *= -1; score += 10;
      document.getElementById('pts').textContent = score;
    }
  }
  if (bricks.every(b => !b.alive)) { running = false; document.getElementById('msg').textContent = '🏆 ¡GANASTE! Puntos: ' + score; }
}

function draw() {
  ctx.fillStyle = '#0a0a1a'; ctx.fillRect(0,0,W,H);
  bricks.forEach(b => {
    if (!b.alive) return;
    ctx.fillStyle = b.color; ctx.shadowColor = b.color; ctx.shadowBlur = 6;
    ctx.fillRect(b.x, b.y, BW, BH);
  });
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#00fff5'; ctx.shadowColor = '#00fff5'; ctx.shadowBlur = 10;
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
}

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  paddle.x = e.clientX - rect.left - paddle.w/2;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
});
canvas.addEventListener('click', () => { if (!launched && running) launched = true; });
canvas.addEventListener('touchmove', e => {
  const rect = canvas.getBoundingClientRect();
  paddle.x = e.touches[0].clientX - rect.left - paddle.w/2;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  e.preventDefault();
}, {passive:false});
canvas.addEventListener('touchstart', () => { if (!launched && running) launched = true; });
document.getElementById('startBtn').addEventListener('click', init);
draw();
</script>
</body>
</html>
