<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a1a; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:'Courier New',monospace; color:#fff; }
  h1 { color:#00fff5; font-size:26px; margin-bottom:8px; text-shadow:0 0 15px #00fff5; letter-spacing:4px; }
  #info { font-size:16px; color:#aaa; margin-bottom:10px; display:flex; gap:30px; }
  canvas { border:2px solid #00fff5; box-shadow:0 0 20px rgba(0,255,245,0.3); border-radius:4px; }
  #msg { margin-top:12px; font-size:15px; color:#00fff5; min-height:22px; text-align:center; }
  button { margin-top:10px; background:#00fff5; color:#000; border:none; padding:10px 28px; font-size:14px; font-family:'Courier New',monospace; font-weight:bold; border-radius:6px; cursor:pointer; }
</style>
</head>
<body>
<h1>🧱 BREAKOUT</h1>
<div id="info"><span>PUNTOS: <b id="pts">0</b></span><span>VIDAS: <b id="lives">3</b></span></div>
<canvas id="c" width="480" height="400"></canvas>
<div id="msg">Clic en INICIAR — mueve el mouse para mover la paleta</div>
<button onclick="startGame()">INICIAR</button>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const W = 480, H = 400;

let px, bx, by, bvx, bvy, bricks, score, lives, launched, animId, running;

function startGame() {
  px = W/2 - 40;
  bx = W/2; by = H - 60;
  bvx = 0; bvy = 0;
  launched = false;
  score = 0; lives = 3; running = true;
  document.getElementById('pts').textContent = 0;
  document.getElementById('lives').textContent = 3;
  document.getElementById('msg').textContent = 'Clic en el canvas para lanzar';
  bricks = [];
  const colors = ['#ff0055','#ff6600','#ffe600','#39ff14','#00fff5'];
  for (let r = 0; r < 5; r++) {
    for (let col = 0; col < 10; col++) {
      bricks.push({ x: col*46+5, y: r*22+40, alive: true, color: colors[r] });
    }
  }
  cancelAnimationFrame(animId);
  loop();
}

function loop() {
  if (!running) return;
  update();
  draw();
  animId = requestAnimationFrame(loop);
}

function update() {
  if (!launched) {
    bx = px + 40;
    return;
  }
  bx += bvx;
  by += bvy;

  // Wall bounce
  if (bx < 8) { bx = 8; bvx = Math.abs(bvx); }
  if (bx > W-8) { bx = W-8; bvx = -Math.abs(bvx); }
  if (by < 8) { by = 8; bvy = Math.abs(bvy); }

  // Miss
  if (by > H + 10) {
    lives--;
    document.getElementById('lives').textContent = lives;
    if (lives <= 0) {
      running = false;
      document.getElementById('msg').textContent = '💀 GAME OVER — Puntos: ' + score;
      return;
    }
    launched = false;
    bx = px + 40; by = H - 60;
    bvx = 0; bvy = 0;
    document.getElementById('msg').textContent = 'Clic para lanzar';
    return;
  }

  // Paddle
  const PY = H - 30, PH = 12;
  if (by + 8 >= PY && by - 8 <= PY + PH && bx >= px && bx <= px + 80 && bvy > 0) {
    bvy = -Math.abs(bvy);
    bvx = ((bx - (px + 40)) / 40) * 5;
  }

  // Bricks
  for (let b of bricks) {
    if (!b.alive) continue;
    if (bx+8>b.x && bx-8<b.x+44 && by+8>b.y && by-8<b.y+20) {
      b.alive = false;
      bvy *= -1;
      score += 10;
      document.getElementById('pts').textContent = score;
      break;
    }
  }

  if (bricks.every(b => !b.alive)) {
    running = false;
    document.getElementById('msg').textContent = '🏆 ¡GANASTE! Puntos: ' + score; if(window.ugWin)window.ugWin();
  }
}

function draw() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);

  // Bricks
  bricks.forEach(b => {
    if (!b.alive) return;
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 5;
    ctx.fillRect(b.x, b.y, 44, 20);
  });

  // Paddle
  ctx.fillStyle = '#00fff5';
  ctx.shadowColor = '#00fff5';
  ctx.shadowBlur = 10;
  ctx.fillRect(px, H-30, 80, 12);

  // Ball
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc(bx, by, 8, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

// Mouse
c.addEventListener('mousemove', e => {
  const r = c.getBoundingClientRect();
  px = Math.max(0, Math.min(W-80, e.clientX - r.left - 40));
});

// Touch
c.addEventListener('touchmove', e => {
  const r = c.getBoundingClientRect();
  px = Math.max(0, Math.min(W-80, e.touches[0].clientX - r.left - 40));
  e.preventDefault();
}, {passive:false});

// Launch
c.addEventListener('click', () => {
  if (!launched && running) {
    bvx = 3;
    bvy = -4;
    launched = true;
    document.getElementById('msg').textContent = '';
  }
});

c.addEventListener('touchstart', () => {
  if (!launched && running) {
    bvx = 3;
    bvy = -4;
    launched = true;
    document.getElementById('msg').textContent = '';
  }
}, {passive:true});

draw();
</script>
</body>
</html>
