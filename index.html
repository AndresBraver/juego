<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRA GAMES 🎮</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --cyan:#00fff5; --pink:#ff0090; --yellow:#ffe600; --green:#39ff14;
  --dark:#060610; --dark2:#0d0d22; --dark3:#13132e; --card:#0e0e24; --border:#1e1e4a;
  --grid-color: rgba(0,255,245,0.03);
  --bg-color: #060610;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg-color); color:#fff; font-family:'Rajdhani',sans-serif; min-height:100vh; overflow-x:hidden; transition:background .5s; }
body::before { content:''; position:fixed; inset:0; background-image:linear-gradient(var(--grid-color) 1px,transparent 1px),linear-gradient(90deg,var(--grid-color) 1px,transparent 1px); background-size:40px 40px; pointer-events:none; z-index:0; }

/* ── HEADER ── */
header { position:relative; z-index:10; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); background:linear-gradient(180deg,rgba(0,255,245,.05) 0%,transparent 100%); flex-wrap:wrap; gap:8px; }
.logo { font-family:'Press Start 2P',monospace; font-size:clamp(10px,2vw,16px); color:var(--cyan); text-shadow:0 0 20px var(--cyan); letter-spacing:2px; }
.logo span { color:var(--pink); }
.header-right { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.search-bar { display:flex; align-items:center; gap:8px; background:var(--dark3); border:1px solid var(--border); border-radius:8px; padding:6px 12px; }
.search-bar:focus-within { border-color:var(--cyan); }
.search-bar input { background:none; border:none; outline:none; color:#fff; font-family:'Rajdhani',sans-serif; font-size:14px; width:150px; }
.search-bar input::placeholder { color:#555; }
.hbtn { font-family:'Orbitron',sans-serif; font-size:10px; font-weight:700; border:none; padding:8px 14px; border-radius:8px; cursor:pointer; letter-spacing:1px; transition:all .2s; }
#loginBtn  { background:rgba(0,255,245,.1); border:1px solid var(--cyan); color:var(--cyan); }
#shopBtn   { background:linear-gradient(135deg,var(--yellow),#ff9900); color:#000; display:none; }
#addBtn    { background:linear-gradient(135deg,var(--pink),#9000ff); color:#fff; display:none; }
.points-badge { background:var(--dark3); border:1px solid var(--yellow); border-radius:20px; padding:4px 12px; font-size:12px; color:var(--yellow); font-family:'Orbitron',sans-serif; display:none; }

/* ── CATEGORIES ── */
.categories { position:relative; z-index:10; display:flex; gap:8px; padding:14px 20px; overflow-x:auto; scrollbar-width:none; }
.categories::-webkit-scrollbar { display:none; }
.cat-btn { font-family:'Orbitron',sans-serif; font-size:10px; font-weight:700; background:var(--dark3); border:1px solid var(--border); color:#888; padding:7px 14px; border-radius:6px; cursor:pointer; white-space:nowrap; transition:all .2s; }
.cat-btn:hover { border-color:var(--cyan); color:var(--cyan); }
.cat-btn.active { background:rgba(0,255,245,.1); border-color:var(--cyan); color:var(--cyan); }

/* ── GRID ── */
.main { position:relative; z-index:10; padding:8px 20px 40px; }
.section-title { font-family:'Orbitron',sans-serif; font-size:12px; font-weight:700; color:#555; letter-spacing:3px; margin-bottom:16px; }
.section-title span { color:var(--yellow); }
.games-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(185px,1fr)); gap:14px; }
.game-card { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; cursor:pointer; transition:all .3s; position:relative; }
.game-card:hover { border-color:var(--cyan); transform:translateY(-4px); box-shadow:0 8px 30px rgba(0,255,245,.15); }
.game-card:hover .play-overlay { opacity:1; }
.game-thumb { width:100%; aspect-ratio:16/10; background:linear-gradient(135deg,#0d0d2e,#1a1a3e); display:flex; align-items:center; justify-content:center; position:relative; }
.thumb-emoji { font-size:48px; }
.play-overlay { position:absolute; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .2s; }
.play-circle { width:48px; height:48px; background:var(--cyan); border-radius:50%; display:flex; align-items:center; justify-content:center; }
.tag { position:absolute; top:8px; left:8px; font-family:'Orbitron',sans-serif; font-size:8px; font-weight:700; padding:3px 7px; border-radius:4px; }
.tag-hot{background:var(--pink);color:#fff;} .tag-new{background:var(--green);color:#000;} .tag-top{background:var(--yellow);color:#000;}
.game-info { padding:10px 12px; }
.game-title { font-family:'Orbitron',sans-serif; font-size:10px; font-weight:700; color:#fff; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.game-cat { font-size:11px; color:#666; }
.game-stars { color:var(--yellow); font-size:11px; margin-top:3px; }
.empty { text-align:center; padding:60px 20px; display:none; }
.empty.show { display:block; }
.empty h3 { font-family:'Press Start 2P',monospace; font-size:13px; color:#333; margin-bottom:10px; }

/* ── PLAYER MODAL ── */
.player-modal { position:fixed; inset:0; z-index:1000; display:none; flex-direction:column; background:var(--dark); }
.player-modal.open { display:flex; }
.player-header { display:flex; align-items:center; gap:14px; padding:12px 18px; background:var(--dark2); border-bottom:1px solid var(--border); flex-shrink:0; }
.close-btn { background:rgba(255,0,0,.2); border:1px solid rgba(255,0,0,.4); color:#ff5555; width:34px; height:34px; border-radius:8px; cursor:pointer; font-size:17px; display:flex; align-items:center; justify-content:center; }
.player-title { font-family:'Orbitron',sans-serif; font-size:13px; font-weight:700; color:var(--cyan); }
.fs-btn { margin-left:auto; background:rgba(0,255,245,.1); border:1px solid rgba(0,255,245,.3); color:var(--cyan); padding:7px 14px; border-radius:8px; cursor:pointer; font-family:'Orbitron',sans-serif; font-size:10px; font-weight:700; }
.player-frame { flex:1; position:relative; }
.player-frame iframe { width:100%; height:100%; border:none; }

/* ── OVERLAYS ── */
.overlay { position:fixed; inset:0; z-index:2000; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.85); backdrop-filter:blur(6px); }
.overlay.open { display:flex; }
.modal-box { background:var(--dark2); border:1px solid var(--cyan); border-radius:16px; padding:28px; width:min(460px,92vw); animation:slideUp .3s ease; }
@keyframes slideUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
.modal-title { font-family:'Orbitron',sans-serif; font-size:15px; font-weight:900; color:var(--cyan); margin-bottom:20px; }
.field { margin-bottom:14px; }
.field label { display:block; font-family:'Orbitron',sans-serif; font-size:9px; color:#666; letter-spacing:2px; margin-bottom:6px; }
.field input { width:100%; background:var(--dark3); border:1px solid var(--border); border-radius:8px; padding:10px 13px; color:#fff; font-family:'Rajdhani',sans-serif; font-size:15px; outline:none; }
.field input:focus { border-color:var(--cyan); }
.modal-btns { display:flex; gap:10px; margin-top:18px; }
.btn-cancel { flex:1; padding:10px; background:var(--dark3); border:1px solid var(--border); color:#888; border-radius:8px; cursor:pointer; font-family:'Orbitron',sans-serif; font-size:10px; }
.btn-save { flex:2; padding:10px; background:linear-gradient(135deg,var(--cyan),#00a8ff); border:none; color:#000; border-radius:8px; cursor:pointer; font-family:'Orbitron',sans-serif; font-size:10px; font-weight:900; }
.modal-err { color:#ff5555; font-size:12px; min-height:18px; margin-top:6px; }
.modal-switch { color:#888; font-size:12px; margin-top:10px; text-align:center; cursor:pointer; }
.modal-switch span { color:var(--cyan); text-decoration:underline; }

/* ── SHOP ── */
.shop-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; max-height:60vh; overflow-y:auto; }
.shop-item { background:var(--dark3); border:1px solid var(--border); border-radius:10px; padding:12px; text-align:center; cursor:pointer; transition:all .2s; }
.shop-item:hover { border-color:var(--yellow); }
.shop-item.owned { border-color:var(--green); opacity:.7; cursor:default; }
.shop-item.equipped { border-color:var(--cyan); box-shadow:0 0 12px rgba(0,255,245,.2); }
.shop-item .si-icon { font-size:30px; margin-bottom:6px; }
.shop-item .si-name { font-family:'Orbitron',sans-serif; font-size:9px; color:#fff; margin-bottom:4px; }
.shop-item .si-price { font-size:11px; color:var(--yellow); }
.shop-item .si-owned { font-size:10px; color:var(--green); }
.shop-tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
.shop-tab { font-family:'Orbitron',sans-serif; font-size:9px; padding:6px 12px; border-radius:6px; cursor:pointer; background:var(--dark3); border:1px solid var(--border); color:#888; transition:all .2s; }
.shop-tab.active { background:rgba(255,230,0,.1); border-color:var(--yellow); color:var(--yellow); }
.shop-points { font-family:'Orbitron',sans-serif; font-size:12px; color:var(--yellow); margin-bottom:14px; }

/* ── ADD MODAL ── */
.emoji-grid { display:grid; grid-template-columns:repeat(8,1fr); gap:5px; margin-top:7px; }
.emo { aspect-ratio:1; background:var(--dark3); border:1px solid var(--border); border-radius:7px; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.emo.sel,.emo:hover { border-color:var(--cyan); background:rgba(0,255,245,.1); }
.field select { width:100%; background:var(--dark3); border:1px solid var(--border); border-radius:8px; padding:10px 13px; color:#fff; font-family:'Rajdhani',sans-serif; font-size:15px; outline:none; }
.field select option { background:var(--dark2); }

/* ── WIN TOAST ── */
#winToast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg,#1a3a1a,#0a2e0a); border:1px solid var(--green); border-radius:10px; padding:12px 24px; font-family:'Orbitron',sans-serif; font-size:12px; color:var(--green); z-index:9999; display:none; box-shadow:0 0 20px rgba(57,255,20,.3); }

::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
@keyframes fadeIn { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
@media(max-width:600px){ header{padding:10px 12px;} .search-bar input{width:100px;} .main{padding:8px 12px 40px;} .categories{padding:10px 12px;} .games-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;} }
</style>
</head>
<body>

<header>
  <div class="logo">ULTRA<span>GAMES</span> 🎮</div>
  <div class="header-right">
    <div class="search-bar">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="color:#555"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Buscar...">

    <button class="hbtn" id="loginBtn" onclick="openLogin()">👤 LOGIN</button>

</header>

<div class="categories">

  <button class="cat-btn" onclick="filterCat('multijugador',this)">👥 MULTI</button>
</div>

<div class="main">
  <div class="section-title">🎯 <span id="cnt">0</span> JUEGOS</div>
  <div class="games-grid" id="grid"></div>

</div>

<!-- Player -->
<div class="player-modal" id="playerModal">

  </div>
  <div class="player-frame">
    <iframe id="gameFrame" allow="fullscreen;autoplay" allowfullscreen></iframe>
  </div>
</div>

<!-- Login Modal -->
<div class="overlay" id="loginModal">

    <div class="modal-err" id="loginErr"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeLogin()">CANCELAR</button>
      <button class="btn-save" id="loginSubmit" onclick="doLogin()">ENTRAR</button>
    </div>
    <div class="modal-switch" id="loginSwitch" onclick="toggleAuthMode()">¿No tienes cuenta? <span>Regístrate</span></div>
  </div>
</div>

<!-- Shop Modal -->
<div class="overlay" id="shopModal">

    </div>

    <div class="shop-tabs">

      <button class="shop-tab" onclick="shopTab('bg',this)">🌌 FONDOS</button>
    </div>
    <div class="shop-grid" id="shopGrid"></div>
  </div>
</div>

<!-- Add Game Modal -->
<div class="overlay" id="addModal">
  <div class="modal-box">
    <div class="modal-title">⚡ AGREGAR JUEGO</div>
    <div class="field"><label>NOMBRE</label><input type="text" id="iName" placeholder="ej. Snake"></div>
    <div class="field"><label>URL</label><input type="text" id="iUrl" placeholder="https://..."></div>
    <div class="field"><label>CATEGORÍA</label>

        <option value="accion">⚔️ Acción</option><option value="puzzle">🧩 Puzzle</option>
        <option value="arcade">👾 Arcade</option><option value="aventura">🗺️ Aventura</option>
        <option value="multijugador">👥 Multijugador</option>
      </select>
    </div>
    <div class="field"><label>ETIQUETA</label>

    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeAdd()">CANCELAR</button>
      <button class="btn-save" onclick="saveGame()">GUARDAR ✓</button>
    </div>
  </div>
</div>

<!-- Win Toast -->
<div id="winToast">🏆 ¡Ganaste! +3 ⭐</div>

async function sbFetch(path, opts) {
  opts = opts || {};
  const res = await fetch(SB_URL+'/rest/v1/'+path, {
    method: opts.method||'GET',
    headers: {
      'apikey': SB_KEY, 'Authorization': 'Bearer '+SB_KEY,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer||''
    },
    body: opts.body||undefined
  });
  if(res.status===204||res.status===200&&!res.headers.get('content-length')&&opts.method==='PATCH') return null;
  try { return await res.json(); } catch(e) { return null; }
}

// ════════════════════════════════════════
// STATE
// ════════════════════════════════════════
let currentUser = null;
let currentUD = null;
let filter = 'all';
let selEmoji = '🎮';
let admin = false;
let combo = [];
let isLoginMode = true;

function allGames() { const extra=(currentUD&&Array.isArray(currentUD.extra_games))?currentUD.extra_games:[]; return [...FIXED,...extra]; }

async function saveUD() {
  if(!currentUD||!currentUser) return;
  await sbFetch('ug_users?username=eq.'+encodeURIComponent(currentUser), {
    method:'PATCH', prefer:'return=minimal',
    body: JSON.stringify({
      points: currentUD.points, owned: currentUD.owned,
      equipped: currentUD.equipped, hints: currentUD.hints,
      extra_lives: currentUD.extra_lives, extra_games: currentUD.extra_games
    })
  });
}

// ════════════════════════════════════════
// AUTH
// ════════════════════════════════════════
function openLogin() { isLoginMode=true; updateLoginUI(); document.getElementById('loginModal').classList.add('open'); }
function closeLogin() { document.getElementById('loginModal').classList.remove('open'); document.getElementById('loginErr').textContent=''; }
function toggleAuthMode() { isLoginMode=!isLoginMode; updateLoginUI(); }
function updateLoginUI() {
  document.getElementById('loginTitle').textContent = isLoginMode ? '👤 INICIAR SESIÓN' : '📝 CREAR CUENTA';
  document.getElementById('loginSubmit').textContent = isLoginMode ? 'ENTRAR' : 'REGISTRAR';
  document.getElementById('loginSwitch').innerHTML = isLoginMode
    ? '¿No tienes cuenta? <span>Regístrate</span>'
    : '¿Ya tienes cuenta? <span>Inicia sesión</span>';
}
async function doLogin() {
  const user=document.getElementById('loginUser').value.trim();
  const pass=document.getElementById('loginPass').value;
  const err=document.getElementById('loginErr');
  if(!user||!pass){err.textContent='Llena todos los campos';return;}
  const btn=document.getElementById('loginSubmit');
  btn.textContent='...';
  try {
    if(isLoginMode){
      const data=await sbFetch('ug_users?username=eq.'+encodeURIComponent(user)+'&select=*');
      if(!data||!data.length){err.textContent='Usuario no encontrado';btn.textContent='ENTRAR';return;}
      if(data[0].password!==btoa(pass)){err.textContent='Contraseña incorrecta';btn.textContent='ENTRAR';return;}
      currentUser=user; currentUD=data[0]; if(!currentUD.extra_games)currentUD.extra_games=[]; closeLogin(); onLogin();
    } else {
      if(pass.length<4){err.textContent='Contraseña mínimo 4 caracteres';btn.textContent='REGISTRAR';return;}
      const check=await sbFetch('ug_users?username=eq.'+encodeURIComponent(user)+'&select=id');
      if(check&&check.length){err.textContent='Ese usuario ya existe';btn.textContent='REGISTRAR';return;}
      const res=await sbFetch('ug_users', {
        method:'POST', prefer:'return=representation',
        body:JSON.stringify({username:user,password:btoa(pass),points:0,owned:[],equipped:{color:'',bg:''},hints:0,extra_lives:0,extra_games:[]})
      });
      if(!res){err.textContent='Error al crear cuenta';btn.textContent='REGISTRAR';return;}
      const ud=Array.isArray(res)?res[0]:res; if(!ud.extra_games)ud.extra_games=[]; currentUser=user; currentUD=ud; closeLogin(); onLogin();
    }
  } catch(e) { err.textContent='Error de conexión'; btn.textContent=isLoginMode?'ENTRAR':'REGISTRAR'; }
}
function onLogin() {
  document.getElementById('loginBtn').textContent='👤 '+currentUser;
  document.getElementById('loginBtn').onclick=doLogout;
  document.getElementById('shopBtn').style.display='inline-block';
  document.getElementById('pointsBadge').style.display='inline-block';
  updatePoints(); applyEquipped(); render();
}
function doLogout() {
  currentUser=null;
  document.getElementById('loginBtn').textContent='👤 LOGIN';
  document.getElementById('loginBtn').onclick=openLogin;
  document.getElementById('shopBtn').style.display='none';
  document.getElementById('pointsBadge').style.display='none';
  document.getElementById('addBtn').style.display='none';
  admin=false;
  document.body.style.setProperty('--grid-color','rgba(0,255,245,0.03)');
  document.body.style.setProperty('--bg-color','#060610');
  render();
}
function updatePoints() {
  if(!currentUser||!currentUD)return;
  const p=currentUD.points;
  document.getElementById('pointsBadge').textContent='⭐ '+p;
  const sm=document.getElementById('shopPoints');
  if(sm)sm.textContent='⭐ '+p+' puntos';
}

// ════════════════════════════════════════
// WIN / POINTS
// ════════════════════════════════════════
function awardPoints(n=3) {
  if(!currentUser||!currentUD){
    // Show toast even without login
    const t=document.getElementById('winToast');
    t.textContent='🏆 ¡Ganaste! Inicia sesión para guardar puntos';
    t.style.display='block';
    setTimeout(()=>t.style.display='none',3000);
    return;
  }
  currentUD.points+=n;
  updatePoints();
  saveUD();
  const t=document.getElementById('winToast');
  t.textContent='🏆 ¡Ganaste! +'+n+' ⭐';
  t.style.display='block';
  setTimeout(()=>t.style.display='none',3000);
}
// Expose globally for games to call
window.ugWin=()=>awardPoints(3);

// ════════════════════════════════════════
// SHOP
// ════════════════════════════════════════
let shopCurrentTab='colors';
function openShop() { updatePoints(); renderShop(); document.getElementById('shopModal').classList.add('open'); }
function closeShop() { document.getElementById('shopModal').classList.remove('open'); }
function shopTab(tab,btn) {
  shopCurrentTab=tab;
  document.querySelectorAll('.shop-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderShop();
}
function renderShop() {
  if(!currentUser||!currentUD)return;
  const ud=currentUD;
  document.getElementById('shopPoints').textContent='⭐ '+ud.points+' puntos';
  const items=SHOP[shopCurrentTab]||[];
  document.getElementById('shopGrid').innerHTML=items.map(item=>{
    const owned=ud.owned.includes(item.id);
    const equipped=ud.equipped&&(ud.equipped.color===item.id||ud.equipped.bg===item.id);
    return `<div class="shop-item ${owned?'owned':''} ${equipped?'equipped':''}" onclick="buyItem('${item.id}')">
      <div class="si-icon">${item.icon}</div>
      <div class="si-name">${item.name}</div>
      ${item.desc?`<div style="font-size:9px;color:#666;margin-bottom:4px">${item.desc}</div>`:''}
      ${owned
        ? `<div class="si-owned">${equipped?'✅ Equipado':'✓ Comprado'}</div>`
        : `<div class="si-price">⭐ ${item.price}</div>`
      }
    </div>`;
  }).join('');
}
function buyItem(id) {
  if(!currentUser||!currentUD)return;
  const ud=currentUD;
  // Find item
  let item=null;
  Object.values(SHOP).forEach(arr=>arr.forEach(i=>{if(i.id===id)item=i;}));
  if(!item)return;
  if(item.type==='hint'||item.type==='life'){
    // Consumable - can buy multiple
    if(ud.points<item.price){alert('No tienes suficientes puntos ⭐');return;}
    ud.points-=item.price;
    if(item.type==='hint')ud.hints=(ud.hints||0)+item.val;
    if(item.type==='life')ud.extraLives=(ud.extraLives||0)+item.val;
    saveUD(); updatePoints(); renderShop();
    const t=document.getElementById('winToast');
    t.textContent=(item.type==='hint'?'💡 +'+item.val+' pistas':'❤️ +'+item.val+' vidas')+' compradas!';
    t.style.display='block'; setTimeout(()=>t.style.display='none',2500);
    return;
  }
  if(ud.owned.includes(id)){
    // Equip/unequip
    if(item.type==='color'){ud.equipped.color=ud.equipped.color===id?'':id;}
    if(item.type==='bg'){ud.equipped.bg=ud.equipped.bg===id?'':id;}
    saveUD(); applyEquipped(); renderShop(); return;
  }
  if(ud.points<item.price){alert('No tienes suficientes puntos ⭐');return;}
  ud.points-=item.price; ud.owned.push(id);
  if(item.type==='color')ud.equipped.color=id;
  if(item.type==='bg')ud.equipped.bg=id;
  saveUD(); updatePoints(); applyEquipped(); renderShop();
}
function applyEquipped() {
  if(!currentUser||!currentUD)return;
  const ud=currentUD;
  // Color
  const col=ud.equipped&&ud.equipped.color?SHOP.colors.find(i=>i.id===ud.equipped.color):null;
  document.body.style.setProperty('--grid-color',col?col.val:'rgba(0,255,245,0.03)');
  // Background
  const bg=ud.equipped&&ud.equipped.bg?SHOP.bg.find(i=>i.id===ud.equipped.bg):null;
  document.body.style.setProperty('--bg-color',bg?bg.val:'#060610');
}

// ════════════════════════════════════════
// RENDER
// ════════════════════════════════════════
function render() {
  const q=document.getElementById('searchInput').value.toLowerCase();
  const list=allGames().filter(g=>(filter==='all'||g.cat===filter)&&g.name.toLowerCase().includes(q));
  document.getElementById('cnt').textContent=list.length;
  const g=document.getElementById('grid');
  const e=document.getElementById('empty');
  if(!list.length){g.innerHTML='';e.classList.add('show');return;}
  e.classList.remove('show');
  g.innerHTML=list.map((gm,i)=>`
    <div class="game-card" style="animation:fadeIn .3s ${i*.04}s both" onclick="play('${gm.url}','${gm.name.replace(/'/g,"\\'")}')">
      <div class="game-thumb">
        <div class="thumb-emoji">${gm.emoji||'🎮'}</div>
        ${gm.tag?`<div class="tag tag-${gm.tag}">${gm.tag.toUpperCase()}</div>`:''}
        <div class="play-overlay"><div class="play-circle"><svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></div></div>
      </div>
      <div class="game-info">
        <div class="game-title">${gm.name}</div>
        <div class="game-cat">${catLabel(gm.cat)}</div>
        <div class="game-stars">★★★★☆</div>
      </div>
    </div>`).join('');
}
function catLabel(c){return {runner:'Runner',deportes:'Deportes',accion:'Acción',puzzle:'Puzzle',arcade:'Arcade',aventura:'Aventura',multijugador:'Multijugador'}[c]||c;}
function filterCat(cat,btn){filter=cat;document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}

// ════════════════════════════════════════
// PLAYER
// ════════════════════════════════════════
function play(url,name){
  if(url.includes('wordwall')){window.open(url,'_blank');return;}
  document.getElementById('playerTitle').textContent=name;
  document.getElementById('playerModal').classList.add('open');
  document.getElementById('gameFrame').src=url;
}
function closePlayer(){document.getElementById('playerModal').classList.remove('open');document.getElementById('gameFrame').src='';}
function goFS(){const f=document.getElementById('gameFrame');if(f.requestFullscreen)f.requestFullscreen();else if(f.webkitRequestFullscreen)f.webkitRequestFullscreen();}

// ════════════════════════════════════════
// ADD GAME
// ════════════════════════════════════════
function openAdd(){selEmoji='🎮';document.getElementById('iName').value='';document.getElementById('iUrl').value='';renderEmo();document.getElementById('addModal').classList.add('open');}
function closeAdd(){document.getElementById('addModal').classList.remove('open');}
function renderEmo(){document.getElementById('emoGrid').innerHTML=EMOJIS.map(e=>`<div class="emo ${e===selEmoji?'sel':''}" onclick="pickEmo('${e}')">${e}</div>`).join('');}
function pickEmo(e){selEmoji=e;renderEmo();}
function saveGame(){
  if(!currentUser)return;
  const name=document.getElementById('iName').value.trim(),url=document.getElementById('iUrl').value.trim();
  if(!name||!url){alert('Escribe nombre y URL');return;}
  if(!currentUD)return;
  if(!currentUD.extra_games)currentUD.extra_games=[];
  currentUD.extra_games.unshift({id:Date.now(),name,url,cat:document.getElementById('iCat').value,tag:document.getElementById('iTag').value,emoji:selEmoji});
  saveUD();closeAdd();render();
}

// ════════════════════════════════════════
// KEYBOARD
// ════════════════════════════════════════
// Poll localStorage for win signal from games
let lastWinCheck = 0;
setInterval(() => {
  try {
    const val = localStorage.getItem('ugWin');
    if(val && parseInt(val) > lastWinCheck) {
      lastWinCheck = parseInt(val);
      awardPoints(3);
      localStorage.removeItem('ugWin');
    }
  } catch(e) {}
}, 500);

document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closePlayer();
  if(e.key==='f'||e.key==='F'){window.open('https://docs.google.com/document/u/0/?tgif=d','_blank');return;}
  combo.push(e.key);if(combo.length>4)combo.shift();
  if(combo.join('')==='2013'){
    admin=!admin;
    document.getElementById('addBtn').style.display=admin&&currentUser?'inline-block':'none';
    combo=[];render();
  }
});
document.getElementById('addModal').addEventListener('click',function(e){if(e.target===this)closeAdd();});
document.getElementById('loginModal').addEventListener('click',function(e){if(e.target===this)closeLogin();});
document.getElementById('shopModal').addEventListener('click',function(e){if(e.target===this)closeShop();});
document.getElementById('searchInput').addEventListener('input',render);

render();
</script>
