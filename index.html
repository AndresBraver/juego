<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRA GAMES 🎮</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --neon-cyan: #00fff5;
    --neon-pink: #ff0090;
    --neon-yellow: #ffe600;
    --neon-green: #39ff14;
    --dark: #060610;
    --dark2: #0d0d22;
    --dark3: #13132e;
    --card-bg: #0e0e24;
    --border: #1e1e4a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,245,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,245,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Header */
  header {
    position: relative;
    z-index: 10;
    padding: 20px 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(0,255,245,0.05) 0%, transparent 100%);
  }

  .logo {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(12px, 2.5vw, 20px);
    color: var(--neon-cyan);
    text-shadow: 0 0 20px var(--neon-cyan), 0 0 40px rgba(0,255,245,0.3);
    letter-spacing: 2px;
    animation: pulse-logo 3s ease-in-out infinite;
  }

  @keyframes pulse-logo {
    0%, 100% { text-shadow: 0 0 20px var(--neon-cyan), 0 0 40px rgba(0,255,245,0.3); }
    50% { text-shadow: 0 0 30px var(--neon-cyan), 0 0 60px rgba(0,255,245,0.5), 0 0 80px rgba(0,255,245,0.2); }
  }

  .logo span { color: var(--neon-pink); }

  .search-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    transition: border-color 0.3s;
  }
  .search-bar:focus-within { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0,255,245,0.15); }
  .search-bar input {
    background: none;
    border: none;
    outline: none;
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    font-weight: 500;
    width: 200px;
  }
  .search-bar input::placeholder { color: #555; }
  .search-bar svg { color: #555; flex-shrink: 0; }

  .add-btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--neon-pink), #9000ff);
    border: none;
    color: #fff;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.3s;
    box-shadow: 0 0 20px rgba(255,0,144,0.3);
  }
  .add-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 30px rgba(255,0,144,0.5);
  }

  /* Category tabs */
  .categories {
    position: relative;
    z-index: 10;
    display: flex;
    gap: 8px;
    padding: 20px 30px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .categories::-webkit-scrollbar { display: none; }

  .cat-btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    font-weight: 700;
    background: var(--dark3);
    border: 1px solid var(--border);
    color: #888;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    letter-spacing: 1px;
  }
  .cat-btn:hover { border-color: var(--neon-cyan); color: var(--neon-cyan); }
  .cat-btn.active {
    background: rgba(0,255,245,0.1);
    border-color: var(--neon-cyan);
    color: var(--neon-cyan);
    box-shadow: 0 0 15px rgba(0,255,245,0.2);
  }

  /* Game grid */
  .main {
    position: relative;
    z-index: 10;
    padding: 10px 30px 40px;
  }

  .section-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: #555;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .section-title span { color: var(--neon-yellow); }

  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .game-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    group: true;
    animation: fadeInUp 0.4s ease both;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .game-card:hover {
    border-color: var(--neon-cyan);
    transform: translateY(-4px);
    box-shadow: 0 8px 30px rgba(0,255,245,0.15), 0 0 0 1px rgba(0,255,245,0.1);
  }

  .game-card:hover .play-overlay { opacity: 1; }

  .game-thumb {
    width: 100%;
    aspect-ratio: 16/10;
    background: linear-gradient(135deg, #0d0d2e, #1a1a3e);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .game-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .game-thumb .thumb-emoji {
    font-size: 52px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
  }

  .play-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .play-btn {
    width: 52px;
    height: 52px;
    background: var(--neon-cyan);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 30px rgba(0,255,245,0.6);
  }

  .play-btn svg { color: #000; margin-left: 4px; }

  .tag-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    font-family: 'Orbitron', sans-serif;
    font-size: 8px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 4px;
    letter-spacing: 1px;
  }
  .tag-hot { background: var(--neon-pink); color: #fff; }
  .tag-new { background: var(--neon-green); color: #000; }
  .tag-top { background: var(--neon-yellow); color: #000; }

  .delete-btn-card {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 26px;
    height: 26px;
    background: rgba(255,0,0,0.8);
    border: none;
    border-radius: 50%;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 5;
  }
  .game-card:hover .delete-btn-card { opacity: 1; }

  .game-info {
    padding: 12px 14px;
  }

  .game-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .game-category {
    font-size: 12px;
    font-weight: 500;
    color: #666;
  }

  .game-rating {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 6px;
    font-size: 12px;
    color: var(--neon-yellow);
  }

  /* Player modal */
  .player-modal {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    flex-direction: column;
    background: var(--dark);
  }
  .player-modal.open { display: flex; }

  .player-header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 20px;
    background: var(--dark2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .close-btn {
    background: rgba(255,0,0,0.2);
    border: 1px solid rgba(255,0,0,0.4);
    color: #ff5555;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .close-btn:hover { background: rgba(255,0,0,0.4); }

  .player-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--neon-cyan);
  }

  .fullscreen-btn {
    margin-left: auto;
    background: rgba(0,255,245,0.1);
    border: 1px solid rgba(0,255,245,0.3);
    color: var(--neon-cyan);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    font-weight: 700;
    transition: all 0.2s;
  }
  .fullscreen-btn:hover { background: rgba(0,255,245,0.2); }

  .player-frame {
    flex: 1;
    position: relative;
  }

  .player-frame iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  .iframe-warning {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--dark2);
    gap: 16px;
    text-align: center;
    padding: 30px;
  }
  .iframe-warning.show { display: flex; }
  .iframe-warning h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    color: var(--neon-pink);
  }
  .iframe-warning p { color: #888; font-size: 14px; max-width: 400px; }
  .open-tab-btn {
    background: var(--neon-cyan);
    color: #000;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .open-tab-btn:hover { box-shadow: 0 0 20px rgba(0,255,245,0.5); }

  /* Add game modal */
  .add-modal {
    position: fixed;
    inset: 0;
    z-index: 2000;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(6px);
  }
  .add-modal.open { display: flex; }

  .add-modal-box {
    background: var(--dark2);
    border: 1px solid var(--neon-cyan);
    border-radius: 16px;
    padding: 32px;
    width: min(500px, 90vw);
    box-shadow: 0 0 60px rgba(0,255,245,0.1);
    animation: slideUp 0.3s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .add-modal-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    font-weight: 900;
    color: var(--neon-cyan);
    margin-bottom: 24px;
    text-shadow: 0 0 20px rgba(0,255,245,0.4);
  }

  .field-group {
    margin-bottom: 16px;
  }

  .field-group label {
    display: block;
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    font-weight: 700;
    color: #666;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .field-group input,
  .field-group select {
    width: 100%;
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 500;
    outline: none;
    transition: border-color 0.2s;
  }

  .field-group input:focus,
  .field-group select:focus {
    border-color: var(--neon-cyan);
    box-shadow: 0 0 10px rgba(0,255,245,0.1);
  }

  .field-group select option { background: var(--dark2); }

  .emoji-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
    margin-top: 8px;
  }

  .emoji-opt {
    aspect-ratio: 1;
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .emoji-opt:hover, .emoji-opt.selected { border-color: var(--neon-cyan); background: rgba(0,255,245,0.1); }

  .modal-actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
  }

  .btn-cancel {
    flex: 1;
    padding: 12px;
    background: var(--dark3);
    border: 1px solid var(--border);
    color: #888;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    font-weight: 700;
    transition: all 0.2s;
  }
  .btn-cancel:hover { border-color: #888; color: #fff; }

  .btn-save {
    flex: 2;
    padding: 12px;
    background: linear-gradient(135deg, var(--neon-cyan), #00a8ff);
    border: none;
    color: #000;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    font-weight: 900;
    transition: all 0.2s;
    letter-spacing: 1px;
  }
  .btn-save:hover { box-shadow: 0 0 25px rgba(0,255,245,0.4); transform: translateY(-1px); }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    display: none;
  }
  .empty-state.show { display: block; }
  .empty-state h3 {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: #333;
    margin-bottom: 12px;
  }
  .empty-state p { color: #555; font-size: 14px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--dark2); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--neon-cyan); }

  @media (max-width: 600px) {
    header { padding: 14px 16px; flex-wrap: wrap; gap: 10px; }
    .search-bar input { width: 120px; }
    .main { padding: 10px 16px 40px; }
    .categories { padding: 14px 16px; }
    .games-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">ULTRA<span>GAMES</span> 🎮</div>
  <div class="search-bar">
    <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" id="searchInput" placeholder="Buscar juego...">
  </div>
  <button class="add-btn" onclick="openAddModal()">+ AGREGAR JUEGO</button>
</header>

<div class="categories">
  <button class="cat-btn active" onclick="filterCat('all', this)">🕹️ TODOS</button>
  <button class="cat-btn" onclick="filterCat('runner', this)">🏃 RUNNER</button>
  <button class="cat-btn" onclick="filterCat('deportes', this)">⚽ DEPORTES</button>
  <button class="cat-btn" onclick="filterCat('accion', this)">⚔️ ACCIÓN</button>
  <button class="cat-btn" onclick="filterCat('puzzle', this)">🧩 PUZZLE</button>
  <button class="cat-btn" onclick="filterCat('arcade', this)">👾 ARCADE</button>
  <button class="cat-btn" onclick="filterCat('aventura', this)">🗺️ AVENTURA</button>
  <button class="cat-btn" onclick="filterCat('multijugador', this)">👥 MULTI</button>
</div>

<div class="main">
  <div class="section-title">🎯 <span id="gameCount">0</span> JUEGOS DISPONIBLES</div>
  <div class="games-grid" id="gamesGrid"></div>
  <div class="empty-state" id="emptyState">
    <h3>NO HAY JUEGOS</h3>
    <p>Agrega tu primer juego con el botón de arriba ↑</p>
  </div>
</div>

<!-- Player modal -->
<div class="player-modal" id="playerModal">
  <div class="player-header">
    <button class="close-btn" onclick="closePlayer()">✕</button>
    <div class="player-title" id="playerTitle">JUGANDO</div>
    <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ PANTALLA COMPLETA</button>
  </div>
  <div class="player-frame" id="playerFrame">
    <iframe id="gameFrame" allow="fullscreen; autoplay" allowfullscreen sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-top-navigation"></iframe>
    <div class="iframe-warning" id="iframeWarning">
      <div style="font-size:48px">🚫</div>
      <h2>ESTE JUEGO NO PERMITE EMBEBIDO</h2>
      <p>Algunos sitios bloquean que se abran dentro de otra página. Puedes abrirlo en una nueva pestaña.</p>
      <button class="open-tab-btn" id="openTabBtn">ABRIR EN NUEVA PESTAÑA ↗</button>
    </div>
  </div>
</div>

<!-- Add game modal -->
<div class="add-modal" id="addModal">
  <div class="add-modal-box">
    <div class="add-modal-title">⚡ AGREGAR NUEVO JUEGO</div>
    
    <div class="field-group">
      <label>Nombre del juego</label>
      <input type="text" id="inputName" placeholder="ej. Subway Surfers">
    </div>

    <div class="field-group">
      <label>URL del juego (embed o link directo)</label>
      <input type="text" id="inputUrl" placeholder="https://poki.com/es/g/subway-surfers">
    </div>

    <div class="field-group">
      <label>Categoría</label>
      <select id="inputCat">
        <option value="runner">🏃 Runner</option>
        <option value="deportes">⚽ Deportes</option>
        <option value="accion">⚔️ Acción</option>
        <option value="puzzle">🧩 Puzzle</option>
        <option value="arcade">👾 Arcade</option>
        <option value="aventura">🗺️ Aventura</option>
        <option value="multijugador">👥 Multijugador</option>
      </select>
    </div>

    <div class="field-group">
      <label>Etiqueta</label>
      <select id="inputTag">
        <option value="">Sin etiqueta</option>
        <option value="hot">🔥 HOT</option>
        <option value="new">✨ NEW</option>
        <option value="top">⭐ TOP</option>
      </select>
    </div>

    <div class="field-group">
      <label>Icono del juego</label>
      <div class="emoji-grid" id="emojiGrid"></div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAddModal()">CANCELAR</button>
      <button class="btn-save" onclick="saveGame()">GUARDAR JUEGO ✓</button>
    </div>
  </div>
</div>

<script>
const EMOJIS = ['🎮','🕹️','🏃','⚽','🏀','🎯','🚀','🏎️','🛹','🎪','👾','🤺','🦸','🐉','🗡️','💎','🧩','🌍','🏆','⚡','🔫','🎲','🧟','🦊','🐱','🐺','🦅','🎸','🌊','🔥','💀','🌟'];

let games = JSON.parse(localStorage.getItem('ultragames_games') || '[]');
let selectedEmoji = '🎮';
let currentFilter = 'all';
let currentUrl = '';


function save() {
  localStorage.setItem('ultragames_games', JSON.stringify(games));
}

function renderGames() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const grid = document.getElementById('gamesGrid');
  const empty = document.getElementById('emptyState');

  let filtered = games.filter(g => {
    const matchCat = currentFilter === 'all' || g.cat === currentFilter;
    const matchQ = g.name.toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  document.getElementById('gameCount').textContent = filtered.length;

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.classList.add('show');
    return;
  }
  empty.classList.remove('show');

  grid.innerHTML = filtered.map((g, i) => `
    <div class="game-card" style="animation-delay:${i * 0.05}s" onclick="playGame('${g.url}', '${g.name.replace(/'/g,"\\'")}')">
      <div class="game-thumb">
        <div class="thumb-emoji">${g.emoji || '🎮'}</div>
        ${g.tag ? `<div class="tag-badge tag-${g.tag}">${g.tag.toUpperCase()}</div>` : ''}
        <div class="play-overlay">
          <div class="play-btn">
            <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
          </div>
        </div>
        <button class="delete-btn-card" onclick="event.stopPropagation(); deleteGame(${g.id})">✕</button>
      </div>
      <div class="game-info">
        <div class="game-title">${g.name}</div>
        <div class="game-category">${catLabel(g.cat)}</div>
        <div class="game-rating">★★★★☆ <span style="color:#555; font-size:11px">Play</span></div>
      </div>
    </div>
  `).join('');
}

function catLabel(c) {
  const map = { runner:'Runner', deportes:'Deportes', accion:'Acción', puzzle:'Puzzle', arcade:'Arcade', aventura:'Aventura', multijugador:'Multijugador' };
  return map[c] || c;
}

function filterCat(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGames();
}

function playGame(url, name) {
  currentUrl = url;
  document.getElementById('playerTitle').textContent = name;
  document.getElementById('playerModal').classList.add('open');
  document.getElementById('iframeWarning').classList.remove('show');
  document.getElementById('openTabBtn').onclick = () => window.open(url, '_blank');
  const frame = document.getElementById('gameFrame');
  frame.src = url;
  frame.onerror = () => showWarning();
  // Only show warning for external URLs that block embedding
  const isSameDomain = url.startsWith('/') || url.includes(window.location.hostname);
  if (!isSameDomain) {
    setTimeout(() => {
      try {
        if (!frame.contentDocument) showWarning();
      } catch(e) {
        showWarning();
      }
    }, 3000);
  }
}

function showWarning() {
  document.getElementById('iframeWarning').classList.add('show');
}

function closePlayer() {
  document.getElementById('playerModal').classList.remove('open');
  document.getElementById('gameFrame').src = '';
}

function toggleFullscreen() {
  const frame = document.getElementById('gameFrame');
  if (frame.requestFullscreen) frame.requestFullscreen();
  else if (frame.webkitRequestFullscreen) frame.webkitRequestFullscreen();
}

function deleteGame(id) {
  if (!confirm('¿Eliminar este juego?')) return;
  games = games.filter(g => g.id !== id);
  save();
  renderGames();
}

// Add modal
function openAddModal() {
  selectedEmoji = '🎮';
  document.getElementById('inputName').value = '';
  document.getElementById('inputUrl').value = '';
  renderEmojiGrid();
  document.getElementById('addModal').classList.add('open');
}

function closeAddModal() {
  document.getElementById('addModal').classList.remove('open');
}

function renderEmojiGrid() {
  document.getElementById('emojiGrid').innerHTML = EMOJIS.map(e => `
    <button class="emoji-opt ${e === selectedEmoji ? 'selected' : ''}" onclick="selectEmoji('${e}')">${e}</button>
  `).join('');
}

function selectEmoji(e) {
  selectedEmoji = e;
  renderEmojiGrid();
}

function saveGame() {
  const name = document.getElementById('inputName').value.trim();
  const url = document.getElementById('inputUrl').value.trim();
  const cat = document.getElementById('inputCat').value;
  const tag = document.getElementById('inputTag').value;

  if (!name || !url) { alert('Escribe el nombre y la URL del juego'); return; }

  games.unshift({ id: Date.now(), name, url, cat, tag, emoji: selectedEmoji });
  save();
  closeAddModal();
  renderGames();
}

// Search
document.getElementById('searchInput').addEventListener('input', renderGames);

// Close modals on backdrop
document.getElementById('addModal').addEventListener('click', function(e) {
  if (e.target === this) closeAddModal();
});

// ESC to close player
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePlayer();
});

renderGames();
</script>
</body>
</html>
