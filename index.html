
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRA GAMES 🎮</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --cyan:#00fff5; --pink:#ff0090; --yellow:#ffe600; --green:#39ff14;
  --dark:#060610; --dark2:#0d0d22; --dark3:#13132e; --card:#0e0e24; --border:#1e1e4a;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--dark); color:#fff; font-family:'Rajdhani',sans-serif; min-height:100vh; overflow-x:hidden; }
body::before { content:''; position:fixed; inset:0; background-image:linear-gradient(rgba(0,255,245,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,245,.03) 1px,transparent 1px); background-size:40px 40px; pointer-events:none; z-index:0; }
header { position:relative; z-index:10; padding:18px 28px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); background:linear-gradient(180deg,rgba(0,255,245,.05) 0%,transparent 100%); gap:12px; flex-wrap:wrap; }
.logo { font-family:'Press Start 2P',monospace; font-size:clamp(11px,2vw,18px); color:var(--cyan); text-shadow:0 0 20px var(--cyan); letter-spacing:2px; }
.logo span { color:var(--pink); }
.search-bar { display:flex; align-items:center; gap:8px; background:var(--dark3); border:1px solid var(--border); border-radius:8px; padding:7px 14px; }
.search-bar:focus-within { border-color:var(--cyan); }
.search-bar input { background:none; border:none; outline:none; color:#fff; font-family:'Rajdhani',sans-serif; font-size:15px; width:180px; }
.search-bar input::placeholder { color:#555; }
.add-btn { display:none; font-family:'Orbitron',sans-serif; font-size:11px; font-weight:700; background:linear-gradient(135deg,var(--pink),#9000ff); border:none; color:#fff; padding:10px 18px; border-radius:8px; cursor:pointer; }
.categories { position:relative; z-index:10; display:flex; gap:8px; padding:16px 28px; overflow-x:auto; scrollbar-width:none; }
.categories::-webkit-scrollbar { display:none; }
.cat-btn { font-family:'Orbitron',sans-serif; font-size:10px; font-weight:700; background:var(--dark3); border:1px solid var(--border); color:#888; padding:8px 14px; border-radius:6px; cursor:pointer; white-space:nowrap; transition:all .2s; }
.cat-btn:hover { border-color:var(--cyan); color:var(--cyan); }
.cat-btn.active { background:rgba(0,255,245,.1); border-color:var(--cyan); color:var(--cyan); }
.main { position:relative; z-index:10; padding:8px 28px 40px; }
.section-title { font-family:'Orbitron',sans-serif; font-size:12px; font-weight:700; color:#555; letter-spacing:3px; margin-bottom:18px; }
.section-title span { color:var(--yellow); }
.games-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; }
.game-card { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; cursor:pointer; transition:all .3s; position:relative; }
.game-card:hover { border-color:var(--cyan); transform:translateY(-4px); box-shadow:0 8px 30px rgba(0,255,245,.15); }
.game-card:hover .play-overlay { opacity:1; }
.game-card:hover .del-btn { opacity:1; }
.game-thumb { width:100%; aspect-ratio:16/10; background:linear-gradient(135deg,#0d0d2e,#1a1a3e); display:flex; align-items:center; justify-content:center; position:relative; }
.thumb-emoji { font-size:50px; }
.play-overlay { position:absolute; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .2s; }
.play-circle { width:50px; height:50px; background:var(--cyan); border-radius:50%; display:flex; align-items:center; justify-content:center; }
.tag { position:absolute; top:8px; left:8px; font-family:'Orbitron',sans-serif; font-size:8px; font-weight:700; padding:3px 7px; border-radius:4px; }
.tag-hot { background:var(--pink); color:#fff; }
.tag-new { background:var(--green); color:#000; }
.tag-top { background:var(--yellow); color:#000; }
.del-btn { position:absolute; top:8px; right:8px; width:24px; height:24px; background:rgba(255,0,0,.8); border:none; border-radius:50%; color:#fff; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .2s; z-index:5; }
.game-info { padding:11px 13px; }
.game-title { font-family:'Orbitron',sans-serif; font-size:10px; font-weight:700; color:#fff; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.game-cat { font-size:12px; color:#666; }
.game-stars { color:var(--yellow); font-size:12px; margin-top:4px; }
.player-modal { position:fixed; inset:0; z-index:1000; display:none; flex-direction:column; background:var(--dark); }
.player-modal.open { display:flex; }
.player-header { display:flex; align-items:center; gap:14px; padding:12px 18px; background:var(--dark2); border-bottom:1px solid var(--border); flex-shrink:0; }
.close-btn { background:rgba(255,0,0,.2); border:1px solid rgba(255,0,0,.4); color:#ff5555; width:34px; height:34px; border-radius:8px; cursor:pointer; font-size:17px; display:flex; align-items:center; justify-content:center; }
.player-title { font-family:'Orbitron',sans-serif; font-size:13px; font-weight:700; color:var(--cyan); }
.fs-btn { margin-left:auto; background:rgba(0,255,245,.1); border:1px solid rgba(0,255,245,.3); color:var(--cyan); padding:7px 14px; border-radius:8px; cursor:pointer; font-family:'Orbitron',sans-serif; font-size:10px; font-weight:700; }
.player-frame { flex:1; position:relative; }
.player-frame iframe { width:100%; height:100%; border:none; }
.add-modal { position:fixed; inset:0; z-index:2000; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.8); backdrop-filter:blur(6px); }
.add-modal.open { display:flex; }
.add-box { background:var(--dark2); border:1px solid var(--cyan); border-radius:16px; padding:30px; width:min(480px,90vw); }
.add-title { font-family:'Orbitron',sans-serif; font-size:15px; font-weight:900; color:var(--cyan); margin-bottom:22px; }
.field { margin-bottom:14px; }
.field label { display:block; font-family:'Orbitron',sans-serif; font-size:9px; color:#666; letter-spacing:2px; margin-bottom:6px; }
.field input, .field select { width:100%; background:var(--dark3); border:1px solid var(--border); border-radius:8px; padding:10px 13px; color:#fff; font-family:'Rajdhani',sans-serif; font-size:15px; outline:none; }
.field input:focus, .field select:focus { border-color:var(--cyan); }
.field select option { background:var(--dark2); }
.emoji-grid { display:grid; grid-template-columns:repeat(8,1fr); gap:5px; margin-top:7px; }
.emo { aspect-ratio:1; background:var(--dark3); border:1px solid var(--border); border-radius:7px; font-size:19px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.emo.sel, .emo:hover { border-color:var(--cyan); background:rgba(0,255,245,.1); }
.modal-btns { display:flex; gap:10px; margin-top:20px; }
.btn-cancel { flex:1; padding:11px; background:var(--dark3); border:1px solid var(--border); color:#888; border-radius:8px; cursor:pointer; font-family:'Orbitron',sans-serif; font-size:10px; font-weight:700; }
.btn-save { flex:2; padding:11px; background:linear-gradient(135deg,var(--cyan),#00a8ff); border:none; color:#000; border-radius:8px; cursor:pointer; font-family:'Orbitron',sans-serif; font-size:10px; font-weight:900; }
.empty { text-align:center; padding:60px 20px; display:none; }
.empty.show { display:block; }
.empty h3 { font-family:'Press Start 2P',monospace; font-size:13px; color:#333; margin-bottom:10px; }
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
@keyframes fadeIn { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
@media(max-width:600px){
  header{padding:12px 14px;}
  .search-bar input{width:110px;}
  .main{padding:8px 14px 40px;}
  .categories{padding:12px 14px;}
  .games-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
}
</style>
</head>
<body>

<header>
  <div class="logo">ULTRA<span>GAMES</span> 🎮</div>
  <div class="search-bar">
    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="color:#555"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="Buscar juego...">
  </div>
  <button class="add-btn" id="addBtn" onclick="openAdd()">+ AGREGAR</button>
</header>

<div class="categories">
  <button class="cat-btn active" onclick="filterCat('all',this)">🕹️ TODOS</button>
  <button class="cat-btn" onclick="filterCat('runner',this)">🏃 RUNNER</button>
  <button class="cat-btn" onclick="filterCat('deportes',this)">⚽ DEPORTES</button>
  <button class="cat-btn" onclick="filterCat('accion',this)">⚔️ ACCIÓN</button>
  <button class="cat-btn" onclick="filterCat('puzzle',this)">🧩 PUZZLE</button>
  <button class="cat-btn" onclick="filterCat('arcade',this)">👾 ARCADE</button>
  <button class="cat-btn" onclick="filterCat('aventura',this)">🗺️ AVENTURA</button>
</div>

<div class="main">
  <div class="section-title">🎯 <span id="cnt">0</span> JUEGOS</div>
  <div class="games-grid" id="grid"></div>
  <div class="empty" id="empty"><h3>SIN JUEGOS</h3><p>No hay juegos en esta categoría</p></div>
</div>

<div class="player-modal" id="playerModal">
  <div class="player-header">
    <button class="close-btn" onclick="closePlayer()">✕</button>
    <div class="player-title" id="playerTitle">JUGANDO</div>
    <button class="fs-btn" onclick="goFS()">⛶ PANTALLA COMPLETA</button>
  </div>
  <div class="player-frame">
    <iframe id="gameFrame" allow="fullscreen;autoplay" allowfullscreen sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>
  </div>
</div>

<div class="add-modal" id="addModal">
  <div class="add-box">
    <div class="add-title">⚡ AGREGAR JUEGO</div>
    <div class="field"><label>NOMBRE</label><input type="text" id="iName" placeholder="ej. Snake"></div>
    <div class="field"><label>URL</label><input type="text" id="iUrl" placeholder="https://..."></div>
    <div class="field"><label>CATEGORÍA</label>
      <select id="iCat">
        <option value="runner">🏃 Runner</option>
        <option value="deportes">⚽ Deportes</option>
        <option value="accion">⚔️ Acción</option>
        <option value="puzzle">🧩 Puzzle</option>
        <option value="arcade">👾 Arcade</option>
        <option value="aventura">🗺️ Aventura</option>
      </select>
    </div>
    <div class="field"><label>ETIQUETA</label>
      <select id="iTag">
        <option value="">Sin etiqueta</option>
        <option value="hot">🔥 HOT</option>
        <option value="new">✨ NEW</option>
        <option value="top">⭐ TOP</option>
      </select>
    </div>
    <div class="field"><label>ICONO</label><div class="emoji-grid" id="emoGrid"></div></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeAdd()">CANCELAR</button>
      <button class="btn-save" onclick="saveGame()">GUARDAR ✓</button>
    </div>
  </div>
</div>

<script>
const EMOJIS = ['🎮','🕹️','🏃','⚽','🎯','🚀','🏎️','👾','🗡️','💎','🧩','🌍','🏆','⚡','🎲','🧟','🎸','🌊','🔥','💀','🌟','🐍','🐦','🧱','🪂','🎳','⚔️','🃏','💣','🍎'];

const FIXED = [
  {id:1,  name:'Snake',          url:'https://ultragames.vercel.app/snake.html',        cat:'arcade',   tag:'top', emoji:'🐍'},
  {id:2,  name:'Breakout',       url:'https://ultragames.vercel.app/breakout.html',      cat:'arcade',   tag:'',    emoji:'🧱'},
  {id:3,  name:'Space Invaders', url:'https://ultragames.vercel.app/spaceinvaders.html', cat:'accion',   tag:'hot', emoji:'👾'},
  {id:4,  name:'Flappy Bird',    url:'https://ultragames.vercel.app/flappybird.html',    cat:'arcade',   tag:'hot', emoji:'🐦'},
  {id:5,  name:'2048',           url:'https://ultragames.vercel.app/2048.html',          cat:'puzzle',   tag:'top', emoji:'🎯'},
  {id:6,  name:'Pong',           url:'https://ultragames.vercel.app/pong.html',          cat:'arcade',   tag:'',    emoji:'🏓'},
  {id:7,  name:'Endless Runner', url:'https://ultragames.vercel.app/runner.html',        cat:'runner',   tag:'',    emoji:'🏃'},
  {id:8,  name:'Tetris',         url:'https://ultragames.vercel.app/tetris.html',        cat:'puzzle',   tag:'top', emoji:'🧩'},
  {id:9,  name:'Whack a Mole',   url:'https://ultragames.vercel.app/whackamole.html',    cat:'arcade',   tag:'',    emoji:'🎪'},
  {id:10, name:'Memory',         url:'https://ultragames.vercel.app/memory.html',        cat:'puzzle',   tag:'',    emoji:'🃏'},
  {id:11, name:'Tank Battle',    url:'https://ultragames.vercel.app/tankbattle.html',    cat:'accion',   tag:'',    emoji:'🗡️'},
  {id:12, name:'Fruit Slicer',   url:'https://ultragames.vercel.app/fruitslicer.html',   cat:'accion',   tag:'new', emoji:'🍎'},
  {id:13, name:'Racing',         url:'https://ultragames.vercel.app/racing.html',        cat:'arcade',   tag:'',    emoji:'🏎️'},
  {id:14, name:'Zombie Shooter', url:'https://ultragames.vercel.app/zombieshooter.html', cat:'accion',   tag:'hot', emoji:'🧟'},
  {id:15, name:'Penales',        url:'https://ultragames.vercel.app/penales.html',       cat:'deportes', tag:'',    emoji:'⚽'},
  {id:16, name:'Minesweeper',    url:'https://ultragames.vercel.app/minesweeper.html',   cat:'puzzle',   tag:'',    emoji:'💣'},
  {id:17, name:'Parachute',      url:'https://ultragames.vercel.app/parachute.html',     cat:'arcade',   tag:'new', emoji:'🪂'},
  {id:18, name:'Bowling',        url:'https://ultragames.vercel.app/bowling.html',       cat:'deportes', tag:'',    emoji:'🎳'},
  {id:19, name:'Sword Fighter',  url:'https://ultragames.vercel.app/swordfighter.html',  cat:'accion',   tag:'new', emoji:'⚔️'},
  {id:20, name:'Pac-Man',         url:'https://ultragames.vercel.app/pacman.html',          cat:'arcade',   tag:'hot', emoji:'🟡'},
  {id:21, name:'Buscar Tema',     url:'https://ultragames.vercel.app/wordwall.html',         cat:'aventura', tag:'new', emoji:'📚'},
  {id:22, name:'Among Us',        url:'https://ultragames.vercel.app/amongus.html',          cat:'multijugador', tag:'hot', emoji:'🔴'},
];

let extra = JSON.parse(localStorage.getItem('ug_extra')||'[]');
let filter = 'all';
let selEmoji = '🎮';
let admin = false;
let combo = [];

function allGames() { return [...FIXED, ...extra]; }

function render() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const list = allGames().filter(g => (filter==='all'||g.cat===filter) && g.name.toLowerCase().includes(q));
  document.getElementById('cnt').textContent = list.length;
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  if (!list.length) { grid.innerHTML=''; empty.classList.add('show'); return; }
  empty.classList.remove('show');
  grid.innerHTML = list.map((g,i) => `
    <div class="game-card" style="animation:fadeIn .3s ${i*.04}s both" onclick="play('${g.url}','${g.name.replace(/'/g,"\\'")}')">
      <div class="game-thumb">
        <div class="thumb-emoji">${g.emoji||'🎮'}</div>
        ${g.tag?`<div class="tag tag-${g.tag}">${g.tag.toUpperCase()}</div>`:''}
        <div class="play-overlay"><div class="play-circle"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></div></div>
        ${admin&&g.id>100?`<button class="del-btn" onclick="event.stopPropagation();del(${g.id})">✕</button>`:''}
      </div>
      <div class="game-info">
        <div class="game-title">${g.name}</div>
        <div class="game-cat">${catLabel(g.cat)}</div>
        <div class="game-stars">★★★★☆</div>
      </div>
    </div>`).join('');
}

function catLabel(c) {
  return {runner:'Runner',deportes:'Deportes',accion:'Acción',puzzle:'Puzzle',arcade:'Arcade',aventura:'Aventura'}[c]||c;
}

function filterCat(cat, btn) {
  filter = cat;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function play(url, name) {
  // Open in new tab for wordwall and pacman (iframe blocked)
  if (url.includes('wordwall') || url.includes('pacman') || url.includes('amongus')) {
    window.open(url, '_blank');
    return;
  }
  document.getElementById('playerTitle').textContent = name;
  document.getElementById('playerModal').classList.add('open');
  document.getElementById('gameFrame').src = url;
}

function closePlayer() {
  document.getElementById('playerModal').classList.remove('open');
  document.getElementById('gameFrame').src = '';
}

function goFS() {
  const f = document.getElementById('gameFrame');
  if (f.requestFullscreen) f.requestFullscreen();
  else if (f.webkitRequestFullscreen) f.webkitRequestFullscreen();
}

function del(id) {
  if (!confirm('¿Eliminar?')) return;
  extra = extra.filter(g=>g.id!==id);
  localStorage.setItem('ug_extra', JSON.stringify(extra));
  render();
}

function openAdd() {
  selEmoji='🎮';
  document.getElementById('iName').value='';
  document.getElementById('iUrl').value='';
  renderEmo();
  document.getElementById('addModal').classList.add('open');
}

function closeAdd() { document.getElementById('addModal').classList.remove('open'); }

function renderEmo() {
  document.getElementById('emoGrid').innerHTML = EMOJIS.map(e=>`<div class="emo ${e===selEmoji?'sel':''}" onclick="pickEmo('${e}')">${e}</div>`).join('');
}

function pickEmo(e) { selEmoji=e; renderEmo(); }

function saveGame() {
  const name = document.getElementById('iName').value.trim();
  const url = document.getElementById('iUrl').value.trim();
  if (!name||!url) { alert('Escribe nombre y URL'); return; }
  extra.unshift({id:Date.now(),name,url,cat:document.getElementById('iCat').value,tag:document.getElementById('iTag').value,emoji:selEmoji});
  localStorage.setItem('ug_extra', JSON.stringify(extra));
  closeAdd(); render();
}

document.getElementById('addModal').addEventListener('click', function(e){ if(e.target===this) closeAdd(); });
document.getElementById('searchInput').addEventListener('input', render);

document.addEventListener('keydown', e => {
  if (e.key==='Escape') closePlayer();
  if (e.key==='f'||e.key==='F') { window.open('https://docs.google.com/document/u/0/?tgif=d','_blank'); return; }
  combo.push(e.key);
  if (combo.length>4) combo.shift();
  if (combo.join('')==='2013') {
    admin=!admin;
    document.getElementById('addBtn').style.display=admin?'block':'none';
    combo=[];
    render();
  }
});

render();
</script>
</body>
</html>
