<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racing</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#050510; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:'Courier New',monospace; color:#fff; overflow:hidden; }
canvas { display:block; border-radius:8px; box-shadow:0 0 40px rgba(255,0,85,0.3); }
#ui { display:flex; gap:20px; margin-bottom:8px; font-size:12px; }
.stat { text-align:center; }
.stat-val { font-size:20px; font-weight:bold; color:#ff0055; text-shadow:0 0 10px #ff0055; }
.stat-lbl { font-size:9px; color:#555; letter-spacing:2px; }
#msg { margin-top:8px; font-size:12px; color:#ff0055; min-height:16px; text-align:center; }
#hint { font-size:9px; color:#444; text-align:center; margin-top:3px; }
</style>
</head>
<body>
<div id="ui">
  <div class="stat"><div class="stat-val" id="pts">0</div><div class="stat-lbl">PUNTOS</div></div>
  <div class="stat"><div class="stat-val" id="lives">❤️❤️❤️</div><div class="stat-lbl">VIDAS</div></div>
  <div class="stat"><div class="stat-val" id="spd">1x</div><div class="stat-lbl">VELOCIDAD</div></div>
</div>
<canvas id="c" width="360" height="480"></canvas>
<div id="msg">Presiona INICIAR</div>
<button onclick="startGame()" style="margin-top:8px;background:#ff0055;color:#fff;border:none;padding:8px 22px;font-size:12px;font-family:'Courier New',monospace;font-weight:bold;border-radius:6px;cursor:pointer;">INICIAR</button>
<div id="hint">← → o A D para mover</div>
<script>

// Read player color from Ultra Games
const PLAYER_COLOR = (()=>{ try{return localStorage.getItem('ugColor')||'#00fff5';}catch(e){return '#00fff5';} })();
const C = document.getElementById('c');
const ctx = C.getContext('2d');
const W=360, H=480;
const LANES=[55,120,185,250,315];
const COLORS=['#ff0055','#ff9900','#ffe600','#39ff14','#00fff5','#cc00ff'];

let player,cars,score,lives,speed,running,animId,keys={},spawnTimer,lineOffset;
let particles=[], frameCount=0, lastAward=0;

function startGame(){
  player={x:LANES[2],y:H-90,w:40,h:70,lane:2,trail:[]};
  cars=[]; score=0; lives=3; speed=1.5; lineOffset=0; spawnTimer=0; particles=[]; frameCount=0; lastAward=0;
  document.getElementById('pts').textContent=0;
  document.getElementById('lives').textContent='❤️❤️❤️';
  document.getElementById('spd').textContent='1x';
  document.getElementById('msg').textContent='';
  running=true;
  cancelAnimationFrame(animId);
  animId=requestAnimationFrame(loop);
}

function addParticles(x,y,color,n=8){
  for(let i=0;i<n;i++) particles.push({
    x,y,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,
    life:25,color,size:Math.random()*5+2
  });
}

function loop(){
  animId=requestAnimationFrame(loop);
  frameCount++;
  if(running) update();
  draw();
}

let moveCd=0;
function update(){
  moveCd=Math.max(0,moveCd-1);
  score+=0.05; speed=1.5+Math.floor(score/100)*0.25;
  document.getElementById('pts').textContent=Math.floor(score);
  document.getElementById('spd').textContent=(1+Math.floor(score/50)*0.15).toFixed(1)+'x';

  // Award points
  const sc=Math.floor(score);
  if(sc%100===0&&sc>0&&sc!==lastAward){lastAward=sc;try{localStorage.setItem('ugWin',Date.now());}catch(e){} window.parent.postMessage('ugWin','*');}

  if((keys['ArrowLeft']||keys['a']||keys['A'])&&player.lane>0&&moveCd===0){
    player.lane--;player.x=LANES[player.lane];moveCd=10;
  }
  if((keys['ArrowRight']||keys['d']||keys['D'])&&player.lane<4&&moveCd===0){
    player.lane++;player.x=LANES[player.lane];moveCd=10;
  }

  lineOffset=(lineOffset+speed)%60;

  // Player trail
  player.trail.push({x:player.x,y:player.y+player.h/2});
  if(player.trail.length>12) player.trail.shift();

  spawnTimer++;
  if(spawnTimer>Math.max(40,80-Math.floor(score/30))){
    const lane=Math.floor(Math.random()*5);
    cars.push({x:LANES[lane],y:-90,w:40,h:70,color:COLORS[Math.floor(Math.random()*COLORS.length)],
      trail:[],smoke:0});
    spawnTimer=0;
  }

  cars=cars.filter(c=>{
    c.y+=speed;
    c.trail.push({x:c.x,y:c.y-c.h/2});
    if(c.trail.length>8) c.trail.shift();
    c.smoke++;
    if(c.y>H+90) return false;
    if(Math.abs(c.x-player.x)<34&&Math.abs(c.y-player.y)<58){
      lives--;
      addParticles(player.x,player.y,'#ff0055',12);
      const lv=['❤️❤️❤️','❤️❤️🖤','❤️🖤🖤','🖤🖤🖤'];
      document.getElementById('lives').textContent=lv[3-lives]||'🖤🖤🖤';
      c.y=H+99;
      if(lives<=0){running=false;document.getElementById('msg').textContent='💀 GAME OVER — Puntos: '+Math.floor(score);}
    }
    return true;
  });

  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.life--;return p.life>0;});
}

function drawRoad(){
  // Road bg
  ctx.fillStyle='#111'; ctx.fillRect(30,0,W-60,H);

  // Road texture
  for(let y=0;y<H;y+=30){
    const alpha=0.03+Math.sin(y*0.1)*0.02;
    ctx.fillStyle=`rgba(255,255,255,${alpha})`;
    ctx.fillRect(30,y,W-60,2);
  }

  // Lane markings
  ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=3;
  ctx.setLineDash([40,20]); ctx.lineDashOffset=-lineOffset;
  [88,153,218,283].forEach(x=>{
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
  });
  ctx.setLineDash([]);

  // Edge lines with glow
  ctx.strokeStyle='#ff0055'; ctx.lineWidth=3;
  ctx.shadowColor='#ff0055'; ctx.shadowBlur=8;
  ctx.beginPath();ctx.moveTo(30,0);ctx.lineTo(30,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W-30,0);ctx.lineTo(W-30,H);ctx.stroke();
  ctx.shadowBlur=0;

  // Side grass
  const gL=ctx.createLinearGradient(0,0,30,0);
  gL.addColorStop(0,'#0a1a0a');gL.addColorStop(1,'#051005');
  ctx.fillStyle=gL; ctx.fillRect(0,0,30,H);
  const gR=ctx.createLinearGradient(W-30,0,W,0);
  gR.addColorStop(0,'#051005');gR.addColorStop(1,'#0a1a0a');
  ctx.fillStyle=gR; ctx.fillRect(W-30,0,30,H);

  // Road reflections
  const speed2=speed;
  ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1; ctx.setLineDash([10,40]);
  ctx.lineDashOffset=-(lineOffset*0.3);
  ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();
  ctx.setLineDash([]);
}

function drawCar(x,y,color,trail,isPlayer){
  // Trail / motion blur
  if(trail&&trail.length>1){
    for(let i=0;i<trail.length-1;i++){
      const alpha=(i/trail.length)*0.3;
      ctx.fillStyle=`rgba(${hexToRgb(color)},${alpha})`;
      ctx.fillRect(trail[i].x-18,trail[i].y-8,36,16);
    }
  }

  ctx.save(); ctx.translate(x,y);

  // Car body shadow
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(0,5,22,8,0,0,Math.PI*2); ctx.fill();

  // Car body
  const bodyG=ctx.createLinearGradient(-20,-35,20,35);
  bodyG.addColorStop(0,lighten(color,40));
  bodyG.addColorStop(0.5,color);
  bodyG.addColorStop(1,darken(color,30));
  ctx.fillStyle=bodyG;
  ctx.shadowColor=color; ctx.shadowBlur=isPlayer?15:6;
  ctx.beginPath(); ctx.roundRect(-18,-35,36,70,8); ctx.fill();

  // Roof
  const roofG=ctx.createLinearGradient(-12,-28,12,0);
  roofG.addColorStop(0,lighten(color,60));
  roofG.addColorStop(1,color);
  ctx.fillStyle=roofG;
  ctx.beginPath(); ctx.roundRect(-12,-28,24,30,6); ctx.fill();

  // Windows
  ctx.fillStyle='rgba(150,230,255,0.6)';
  ctx.beginPath(); ctx.roundRect(-10,-26,20,12,3); ctx.fill();
  ctx.fillStyle='rgba(150,230,255,0.4)';
  ctx.beginPath(); ctx.roundRect(-10,-12,20,10,2); ctx.fill();

  // Headlights / taillights
  if(isPlayer){
    ctx.fillStyle='rgba(255,255,200,0.9)'; ctx.shadowColor='#ffffa0'; ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(-12,-33,4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(12,-33,4,0,Math.PI*2);ctx.fill();
  } else {
    ctx.fillStyle='rgba(255,50,50,0.9)'; ctx.shadowColor='#ff0000'; ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(-12,33,4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(12,33,4,0,Math.PI*2);ctx.fill();
  }

  // Wheels
  ctx.fillStyle='#222'; ctx.shadowBlur=0;
  [[-16,-22],[-16,18],[16,-22],[16,18]].forEach(([wx,wy])=>{
    ctx.beginPath();ctx.ellipse(wx,wy,5,7,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#555';ctx.beginPath();ctx.arc(wx,wy,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#222';
  });

  // Player indicator
  if(isPlayer){
    ctx.fillStyle='rgba(0,255,245,0.3)'; ctx.shadowColor='#00fff5'; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.ellipse(0,0,22,36,0,0,Math.PI*2); ctx.stroke();
  }

  ctx.shadowBlur=0; ctx.restore();
}

function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}
function lighten(hex,amt){
  let r=parseInt(hex.slice(1,3),16)+amt,g=parseInt(hex.slice(3,5),16)+amt,b=parseInt(hex.slice(5,7),16)+amt;
  return `rgb(${Math.min(255,r)},${Math.min(255,g)},${Math.min(255,b)})`;
}
function darken(hex,amt){
  let r=parseInt(hex.slice(1,3),16)-amt,g=parseInt(hex.slice(3,5),16)-amt,b=parseInt(hex.slice(5,7),16)-amt;
  return `rgb(${Math.max(0,r)},${Math.max(0,g)},${Math.max(0,b)})`;
}

function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha=p.life/25;
    ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*(p.life/25),0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1; ctx.shadowBlur=0;
}

function draw(){
  // Sky
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#050510');sky.addColorStop(1,'#0a0a20');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

  drawRoad();

  // Draw cars
  cars.forEach(c=>drawCar(c.x,c.y,c.color,c.trail,false));
  drawParticles();
  if(player) drawCar(player.x,player.y,PLAYER_COLOR,player.trail,true);

  // HUD overlay
  if(!running&&cars.length>=0){
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,W,H);
  }
}

document.addEventListener('keydown',e=>{keys[e.key]=true;});
document.addEventListener('keyup',e=>{keys[e.key]=false;});
let tx=0;
C.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;e.preventDefault();},{passive:false});
C.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(dx>30&&player.lane<4){player.lane++;player.x=LANES[player.lane];}
  if(dx<-30&&player.lane>0){player.lane--;player.x=LANES[player.lane];}
  e.preventDefault();
},{passive:false});

draw();
</script>
</body>
</html>
