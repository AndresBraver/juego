<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racing</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a1a; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:'Courier New',monospace; color:#fff; }
  h1 { color:#ff0055; font-size:26px; margin-bottom:6px; text-shadow:0 0 15px #ff0055; letter-spacing:3px; }
  #info { font-size:15px; color:#aaa; margin-bottom:8px; display:flex; gap:30px; }
  canvas { border:2px solid #ff0055; box-shadow:0 0 20px rgba(255,0,85,0.3); border-radius:4px; }
  #msg { margin-top:10px; font-size:16px; color:#ff0055; min-height:22px; text-align:center; }
  #startBtn { margin-top:8px; background:#ff0055; color:#fff; border:none; padding:10px 28px; font-size:14px; font-family:'Courier New',monospace; font-weight:bold; border-radius:6px; cursor:pointer; }
  #hint { margin-top:6px; font-size:11px; color:#555; }
</style>
</head>
<body>
<h1>🏎️ RACING</h1>
<div id="info"><span>PUNTOS: <b id="pts">0</b></span><span>VIDAS: <b id="lives">3</b></span></div>
<canvas id="c" width="360" height="480"></canvas>
<div id="msg">Presiona INICIO</div>
<button id="startBtn">INICIAR</button>
<div id="hint">← → o A D para mover</div>
<script>
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const W = 360, H = 480;
const LANES = [60, 130, 200, 270, 330];
const COLORS = ['#ff0055','#ff9900','#cc00ff','#00fff5','#39ff14'];
let player, cars, score, lives, speed, running, animId, keys = {}, spawnTimer, lineOffset, moveCooldown;

function init() {
  player = { x: W/2, y: H-80, w: 40, h: 70, lane: 2 };
  player.x = LANES[2];
  cars = []; score = 0; lives = 3; speed = 3; lineOffset = 0; spawnTimer = 0; moveCooldown = 0;
  document.getElementById('pts').textContent = 0;
  document.getElementById('lives').textContent = 3;
  document.getElementById('msg').textContent = '';
  running = true;
  cancelAnimationFrame(animId);
  animate();
}

function animate() { if (!running) return; update(); draw(); animId = requestAnimationFrame(animate); }

function update() {
  moveCooldown = Math.max(0, moveCooldown - 1);
  score += 0.05;
  speed = 3 + Math.floor(score/50) * 0.5;
  document.getElementById('pts').textContent = Math.floor(score);

  if ((keys['ArrowLeft'] || keys['a']) && player.lane > 0 && moveCooldown === 0) {
    player.lane--; player.x = LANES[player.lane]; moveCooldown = 12;
  }
  if ((keys['ArrowRight'] || keys['d']) && player.lane < 4 && moveCooldown === 0) {
    player.lane++; player.x = LANES[player.lane]; moveCooldown = 12;
  }

  lineOffset = (lineOffset + speed) % 60;

  spawnTimer++;
  if (spawnTimer > Math.max(30, 60 - Math.floor(score/20))) {
    const lane = Math.floor(Math.random()*5);
    cars.push({ x: LANES[lane], y: -80, w: 40, h: 70, color: COLORS[Math.floor(Math.random()*COLORS.length)] });
    spawnTimer = 0;
  }

  cars = cars.filter(c => {
    c.y += speed;
    if (c.y > H+80) return false;
    if (Math.abs(c.x - player.x) < 35 && Math.abs(c.y - player.y) < 60) {
      lives--; document.getElementById('lives').textContent = lives; c.y = H+99;
      if (lives <= 0) { running = false; document.getElementById('msg').textContent = '💀 GAME OVER — Puntos: ' + Math.floor(score); }
    }
    return true;
  });
}

function drawCar(x, y, w, h, color, isPlayer) {
  ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = isPlayer ? 12 : 4;
  ctx.beginPath(); ctx.roundRect(x-w/2, y-h/2, w, h, 6); ctx.fill();
  ctx.fillStyle = isPlayer ? '#fff' : 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 0;
  ctx.fillRect(x-w/2+4, y-h/2+8, w-8, 12);
  ctx.fillRect(x-w/2+4, y+h/2-20, w-8, 12);
}

function draw() {
  ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#0a0a0a'; ctx.fillRect(30,0,W-60,H);
  ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 3;
  ctx.setLineDash([40,20]); ctx.lineDashOffset = -lineOffset;
  [95,165,235,295].forEach(x => { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); });
  ctx.setLineDash([]);
  ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 3; ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.moveTo(30,0); ctx.lineTo(30,H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W-30,0); ctx.lineTo(W-30,H); ctx.stroke();
  ctx.shadowBlur = 0;
  cars.forEach(c => drawCar(c.x, c.y, c.w, c.h, c.color, false));
  drawCar(player.x, player.y, 40, 70, '#00fff5', true);
}

document.addEventListener('keydown', e => { keys[e.key] = true; });
document.addEventListener('keyup', e => { keys[e.key] = false; });

let touchStartX = null;
canvas.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (dx > 30 && player.lane < 4) { player.lane++; player.x = LANES[player.lane]; }
  if (dx < -30 && player.lane > 0) { player.lane--; player.x = LANES[player.lane]; }
  e.preventDefault();
}, {passive:false});

document.getElementById('startBtn').addEventListener('click', init);
draw();
</script>
</body>
</html>
