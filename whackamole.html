<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whack a Mole</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a1a; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; font-family:'Courier New',monospace; color:#fff; padding:20px; }
  h1 { color:#ff9900; font-size:26px; margin-bottom:8px; text-shadow:0 0 15px #ff9900; letter-spacing:3px; }
  #info { font-size:16px; color:#aaa; margin-bottom:14px; display:flex; gap:30px; }
  #grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px; }
  .hole { width:110px; height:110px; background:#1a0a2e; border:2px solid #333; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:52px; cursor:pointer; transition:transform 0.1s; position:relative; overflow:hidden; user-select:none; }
  .hole:active { transform:scale(0.92); }
  .hole.active { border-color:#ff9900; box-shadow:0 0 20px rgba(255,153,0,0.5); }
  .hole.hit { background:#ff000033; border-color:#ff0055; }
  #msg { font-size:16px; color:#ff9900; min-height:22px; text-align:center; }
  #startBtn { margin-top:10px; background:#ff9900; color:#000; border:none; padding:10px 28px; font-size:14px; font-family:'Courier New',monospace; font-weight:bold; border-radius:6px; cursor:pointer; letter-spacing:2px; }
  #timer-bar { width:330px; height:10px; background:#1a1a3e; border-radius:5px; margin-bottom:14px; overflow:hidden; }
  #timer-fill { height:100%; background:#ff9900; border-radius:5px; transition:width 0.1s linear; width:100%; }
</style>
</head>
<body>
<h1>🎪 WHACK A MOLE</h1>
<div id="info"><span>PUNTOS: <b id="pts">0</b></span><span>TIEMPO: <b id="time">30</b>s</span></div>
<div id="timer-bar"><div id="timer-fill"></div></div>
<div id="grid"></div>
<div id="msg">Presiona INICIO para jugar</div>
<button id="startBtn">INICIAR</button>
<script>
const MOLES=['🐹','🐭','🐀'];
const BOMBS=['💣'];
let score,timeLeft,running,activeHoles,intervals=[];
const grid=document.getElementById('grid');

// Create holes
const holes=[];
for(let i=0;i<9;i++){
  const h=document.createElement('div');
  h.className='hole'; h.textContent='🌑';
  h.addEventListener('click',()=>whack(i));
  h.addEventListener('touchstart',e=>{ whack(i); e.preventDefault(); },{passive:false});
  grid.appendChild(h); holes.push(h);
}

function init(){
  score=0; timeLeft=30; running=true; activeHoles={};
  document.getElementById('pts').textContent=0;
  document.getElementById('time').textContent=30;
  document.getElementById('timer-fill').style.width='100%';
  document.getElementById('msg').textContent='';
  holes.forEach(h=>{ h.textContent='🌑'; h.className='hole'; });
  intervals.forEach(clearInterval); intervals=[];
  // Spawn moles
  intervals.push(setInterval(spawnMole,800));
  // Countdown
  intervals.push(setInterval(()=>{
    timeLeft--;
    document.getElementById('time').textContent=timeLeft;
    document.getElementById('timer-fill').style.width=(timeLeft/30*100)+'%';
    if(timeLeft<=0){ endGame(); }
  },1000));
}

function spawnMole(){
  if(!running) return;
  // Find empty hole
  const empty=[];
  for(let i=0;i<9;i++) if(!activeHoles[i]) empty.push(i);
  if(!empty.length) return;
  const idx=empty[Math.floor(Math.random()*empty.length)];
  const isBomb=Math.random()<0.15;
  activeHoles[idx]={bomb:isBomb};
  holes[idx].textContent=isBomb?BOMBS[0]:MOLES[Math.floor(Math.random()*MOLES.length)];
  holes[idx].className='hole active';
  setTimeout(()=>{
    if(activeHoles[idx]){ delete activeHoles[idx]; holes[idx].textContent='🌑'; holes[idx].className='hole'; }
  },900);
}

function whack(i){
  if(!running||!activeHoles[i]) return;
  const isBomb=activeHoles[i].bomb;
  delete activeHoles[i];
  holes[i].className='hole hit';
  if(isBomb){ score=Math.max(0,score-5); holes[i].textContent='💥'; }
  else { score+=10; holes[i].textContent='⭐'; }
  document.getElementById('pts').textContent=score;
  setTimeout(()=>{ holes[i].textContent='🌑'; holes[i].className='hole'; },300);
}

function endGame(){
  running=false; intervals.forEach(clearInterval);
  holes.forEach(h=>{ h.textContent='🌑'; h.className='hole'; });
  document.getElementById('msg').textContent=`🏆 ¡TIEMPO! Puntos finales: ${score}`;
}

document.getElementById('startBtn').addEventListener('click',init);
</script>
</body>
</html>
