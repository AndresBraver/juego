<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a1a; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:'Courier New',monospace; color:#fff; }
  h1 { color:#ff0055; font-size:28px; margin-bottom:8px; text-shadow:0 0 15px #ff0055; letter-spacing:4px; }
  canvas { border:2px solid #ff0055; box-shadow:0 0 20px rgba(255,0,85,0.3); border-radius:4px; }
  #msg { margin-top:12px; font-size:16px; color:#ff0055; min-height:22px; text-align:center; }
  #startBtn { margin-top:10px; background:#ff0055; color:#fff; border:none; padding:10px 28px; font-size:14px; font-family:'Courier New',monospace; font-weight:bold; border-radius:6px; cursor:pointer; letter-spacing:2px; }
  #hint { margin-top:6px; font-size:12px; color:#555; }
</style>
</head>
<body>
<h1>🏓 PONG</h1>
<canvas id="c" width="480" height="360"></canvas>
<div id="msg">Presiona INICIO para jugar</div>
<button id="startBtn">INICIAR</button>
<div id="hint">W/S = Jugador 1 | ↑/↓ = Jugador 2</div>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const W=480,H=360,PH=70,PW=10,BALL=8,SPEED=5,WIN=7;
let p1,p2,ball,score,running,animId,keys={};

function init(){
  p1={x:10,y:H/2-PH/2,score:0};
  p2={x:W-20,y:H/2-PH/2,score:0};
  score={p1:0,p2:0};
  resetBall();
  running=true;
  document.getElementById('msg').textContent='';
  cancelAnimationFrame(animId);
  animate();
}

function resetBall(){
  ball={x:W/2,y:H/2,vx:(Math.random()>0.5?1:-1)*SPEED,vy:(Math.random()-0.5)*6};
}

function animate(){ if(!running)return; update(); draw(); animId=requestAnimationFrame(animate); }

function update(){
  // Player controls
  if(keys['w']&&p1.y>0) p1.y-=5;
  if(keys['s']&&p1.y+PH<H) p1.y+=5;
  if(keys['ArrowUp']&&p2.y>0) p2.y-=5;
  if(keys['ArrowDown']&&p2.y+PH<H) p2.y+=5;
  // AI for p2 if needed (optional - using keyboard)
  // Ball
  ball.x+=ball.vx; ball.y+=ball.vy;
  if(ball.y-BALL<0||ball.y+BALL>H) ball.vy*=-1;
  // Paddle collision p1
  if(ball.x-BALL<p1.x+PW&&ball.y>p1.y&&ball.y<p1.y+PH&&ball.vx<0){
    ball.vx*=-1.05; ball.vy=((ball.y-(p1.y+PH/2))/(PH/2))*6;
  }
  // Paddle collision p2
  if(ball.x+BALL>p2.x&&ball.y>p2.y&&ball.y<p2.y+PH&&ball.vx>0){
    ball.vx*=-1.05; ball.vy=((ball.y-(p2.y+PH/2))/(PH/2))*6;
  }
  // Limit speed
  ball.vx=Math.max(-12,Math.min(12,ball.vx));
  // Score
  if(ball.x<0){ score.p2++; check(); resetBall(); }
  if(ball.x>W){ score.p1++; check(); resetBall(); }
}

function check(){
  if(score.p1>=WIN){ running=false; document.getElementById('msg').textContent='🏆 ¡JUGADOR 1 GANA!'; if(window.ugWin)window.ugWin(); }
  if(score.p2>=WIN){ running=false; document.getElementById('msg').textContent='🏆 ¡JUGADOR 2 GANA!'; if(window.ugWin)window.ugWin(); }
}

function draw(){
  ctx.fillStyle='#0a0a1a'; ctx.fillRect(0,0,W,H);
  // Center line
  ctx.setLineDash([8,8]); ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke();
  ctx.setLineDash([]);
  // Score
  ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.font='bold 60px Courier New'; ctx.textAlign='center';
  ctx.fillText(score.p1,W/4,H/2+20); ctx.fillText(score.p2,3*W/4,H/2+20);
  // Paddles
  ctx.fillStyle='#ff0055'; ctx.shadowColor='#ff0055'; ctx.shadowBlur=12;
  ctx.beginPath(); ctx.roundRect(p1.x,p1.y,PW,PH,4); ctx.fill();
  ctx.fillStyle='#00fff5'; ctx.shadowColor='#00fff5';
  ctx.beginPath(); ctx.roundRect(p2.x,p2.y,PW,PH,4); ctx.fill();
  ctx.shadowBlur=0;
  // Ball
  ctx.fillStyle='#fff'; ctx.shadowColor='#fff'; ctx.shadowBlur=15;
  ctx.beginPath(); ctx.arc(ball.x,ball.y,BALL,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0; ctx.textAlign='left';
}

document.addEventListener('keydown',e=>{ keys[e.key]=true; if(['ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault(); });
document.addEventListener('keyup',e=>{ keys[e.key]=false; });
document.getElementById('startBtn').addEventListener('click',init);
draw();
</script>
</body>
</html>
