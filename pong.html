<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#050510; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:'Courier New',monospace; color:#fff; overflow:hidden; }
canvas { display:block; border-radius:8px; box-shadow:0 0 40px rgba(255,230,0,0.3); }
#msg { margin-top:8px; font-size:13px; color:#ffe600; min-height:18px; text-align:center; }
button { margin-top:8px; background:linear-gradient(135deg,#ffe600,#ff9900); color:#000; border:none; padding:8px 24px; font-size:13px; font-family:'Courier New',monospace; font-weight:bold; border-radius:8px; cursor:pointer; }
#hint { font-size:9px; color:#444; margin-top:4px; text-align:center; }
</style>
</head>
<body>
<canvas id="c" width="480" height="320"></canvas>
<div id="msg">Presiona INICIAR</div>
<button onclick="startGame()">INICIAR</button>
<div id="hint">J1: W/S | J2: ↑/↓ | Primero en 7 gana</div>
<script>
const C=document.getElementById('c'),ctx=C.getContext('2d');
const W=480,H=320,PAD_H=70,PAD_W=12,BALL_R=8;
let p1,p2,ball,score1,score2,running,animId,keys={},particles,frame,trail;

function startGame(){
  p1={y:H/2-PAD_H/2};p2={y:H/2-PAD_H/2};
  score1=0;score2=0;particles=[];trail=[];frame=0;
  ball={x:W/2,y:H/2,vx:4*(Math.random()>0.5?1:-1),vy:3*(Math.random()>0.5?1:-1)};
  running=true;document.getElementById('msg').textContent='';
  cancelAnimationFrame(animId);animId=requestAnimationFrame(loop);
}

function addParticles(x,y,color,n=8){
  for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,life:20,color});
}

function loop(){animId=requestAnimationFrame(loop);frame++;if(running)update();draw();}

function update(){
  // Paddles
  if(keys['w']||keys['W'])p1.y=Math.max(0,p1.y-5);
  if(keys['s']||keys['S'])p1.y=Math.min(H-PAD_H,p1.y+5);
  if(keys['ArrowUp'])p2.y=Math.max(0,p2.y-5);
  if(keys['ArrowDown'])p2.y=Math.min(H-PAD_H,p2.y+5);

  ball.x+=ball.vx;ball.y+=ball.vy;
  trail.push({x:ball.x,y:ball.y});
  if(trail.length>12)trail.shift();

  // Walls
  if(ball.y-BALL_R<=0){ball.y=BALL_R;ball.vy=Math.abs(ball.vy);addParticles(ball.x,0,'#ffe600',4);}
  if(ball.y+BALL_R>=H){ball.y=H-BALL_R;ball.vy=-Math.abs(ball.vy);addParticles(ball.x,H,'#ffe600',4);}

  // Paddle 1
  if(ball.x-BALL_R<=26+PAD_W&&ball.x-BALL_R>=22&&ball.y>=p1.y&&ball.y<=p1.y+PAD_H&&ball.vx<0){
    ball.vx=Math.abs(ball.vx)*1.05;ball.vy=((ball.y-(p1.y+PAD_H/2))/(PAD_H/2))*6;
    addParticles(26+PAD_W,ball.y,'#00fff5',6);
  }
  // Paddle 2
  if(ball.x+BALL_R>=W-26-PAD_W&&ball.x+BALL_R<=W-22&&ball.y>=p2.y&&ball.y<=p2.y+PAD_H&&ball.vx>0){
    ball.vx=-Math.abs(ball.vx)*1.05;ball.vy=((ball.y-(p2.y+PAD_H/2))/(PAD_H/2))*6;
    addParticles(W-26-PAD_W,ball.y,'#ff0055',6);
  }

  // Limit speed
  const spd=Math.sqrt(ball.vx**2+ball.vy**2);
  if(spd>12){ball.vx=ball.vx/spd*12;ball.vy=ball.vy/spd*12;}

  // Score
  if(ball.x<0){score2++;addParticles(0,ball.y,'#ff0055',12);resetBall(1);}
  if(ball.x>W){score1++;addParticles(W,ball.y,'#00fff5',12);resetBall(-1);}

  if(score1>=7){running=false;document.getElementById('msg').textContent='🏆 ¡JUGADOR 1 GANA!';try{localStorage.setItem('ugWin',Date.now());}catch(e){} window.parent.postMessage('ugWin','*');}
  if(score2>=7){running=false;document.getElementById('msg').textContent='🏆 ¡JUGADOR 2 GANA!';try{localStorage.setItem('ugWin',Date.now());}catch(e){} window.parent.postMessage('ugWin','*');}

  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life--;return p.life>0;});
}

function resetBall(dir){
  trail=[];
  setTimeout(()=>{ball={x:W/2,y:H/2,vx:4*dir,vy:3*(Math.random()>0.5?1:-1)};},600);
  ball.x=W/2;ball.y=H/2;ball.vx=0;ball.vy=0;
}

function drawPaddle(x,y,color){
  const g=ctx.createLinearGradient(x,y,x+PAD_W,y+PAD_H);
  g.addColorStop(0,color);g.addColorStop(0.5,'#ffffff44');g.addColorStop(1,color);
  ctx.fillStyle=g;ctx.shadowColor=color;ctx.shadowBlur=20;
  ctx.beginPath();ctx.roundRect(x,y,PAD_W,PAD_H,6);ctx.fill();
  ctx.shadowBlur=0;
}

function draw(){
  // Background
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#020208');bg.addColorStop(1,'#080818');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // Center line
  ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=2;ctx.setLineDash([10,10]);
  ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);

  // Scores
  ctx.fillStyle='rgba(0,255,245,0.15)';ctx.font='bold 80px Courier New';ctx.textAlign='center';
  ctx.fillText(score1,W/4,H/2+30);
  ctx.fillStyle='rgba(255,0,85,0.15)';
  ctx.fillText(score2,W*3/4,H/2+30);

  // Score labels
  ctx.fillStyle='#00fff5';ctx.font='bold 32px Courier New';
  ctx.fillText(score1,W/4,60);
  ctx.fillStyle='#ff0055';
  ctx.fillText(score2,W*3/4,60);
  ctx.textAlign='left';

  // Ball trail
  trail.forEach((t,i)=>{
    const alpha=(i/trail.length)*0.4;
    const size=BALL_R*(i/trail.length);
    ctx.fillStyle=`rgba(255,230,0,${alpha})`;ctx.shadowColor='#ffe600';ctx.shadowBlur=i*2;
    ctx.beginPath();ctx.arc(t.x,t.y,size,0,Math.PI*2);ctx.fill();
  });

  // Particles
  particles.forEach(p=>{
    ctx.globalAlpha=p.life/20;ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;ctx.shadowBlur=0;

  // Paddles
  drawPaddle(22,p1.y,'#00fff5');
  drawPaddle(W-22-PAD_W,p2.y,'#ff0055');

  // Ball
  const ballG=ctx.createRadialGradient(ball.x-2,ball.y-2,1,ball.x,ball.y,BALL_R);
  ballG.addColorStop(0,'#ffffff');ballG.addColorStop(0.5,'#ffee88');ballG.addColorStop(1,'#ffe600');
  ctx.fillStyle=ballG;ctx.shadowColor='#ffe600';ctx.shadowBlur=25;
  ctx.beginPath();ctx.arc(ball.x,ball.y,BALL_R,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
}

document.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();});
document.addEventListener('keyup',e=>{keys[e.key]=false;});
</script>
</body>
</html>
