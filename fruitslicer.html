<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Slicer</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a1a; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:'Courier New',monospace; color:#fff; }
  h1 { color:#ff6600; font-size:26px; margin-bottom:6px; text-shadow:0 0 15px #ff6600; letter-spacing:3px; }
  #info { font-size:15px; color:#aaa; margin-bottom:8px; display:flex; gap:30px; }
  canvas { border:2px solid #ff6600; box-shadow:0 0 20px rgba(255,102,0,0.3); border-radius:4px; cursor:none; }
  #msg { margin-top:10px; font-size:16px; color:#ff6600; min-height:22px; text-align:center; }
  #startBtn { margin-top:8px; background:#ff6600; color:#fff; border:none; padding:10px 28px; font-size:14px; font-family:'Courier New',monospace; font-weight:bold; border-radius:6px; cursor:pointer; letter-spacing:2px; }
</style>
</head>
<body>
<h1>🍎 FRUIT SLICER</h1>
<div id="info"><span>PUNTOS: <b id="pts">0</b></span><span>VIDAS: <b id="lives">3</b></span><span>TIEMPO: <b id="time">60</b>s</span></div>
<canvas id="c" width="480" height="380"></canvas>
<div id="msg">Mueve el mouse o desliza para cortar frutas</div>
<button id="startBtn">INICIAR</button>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const W=480,H=380;
const FRUITS=['🍎','🍊','🍋','🍇','🍓','🍑','🥝','🍍'];
let fruits,bombs,score,lives,timeLeft,running,animId,blade,spawnTimer,countdown,particles;

function init(){
  fruits=[]; bombs=[]; particles=[]; blade=[];
  score=0; lives=3; timeLeft=60; running=true; spawnTimer=0;
  document.getElementById('pts').textContent=0;
  document.getElementById('lives').textContent=3;
  document.getElementById('time').textContent=60;
  document.getElementById('msg').textContent='';
  clearInterval(countdown);
  countdown=setInterval(()=>{
    timeLeft--;
    document.getElementById('time').textContent=timeLeft;
    if(timeLeft<=0){ endGame(); }
  },1000);
  cancelAnimationFrame(animId);
  animate();
}

function spawnFruit(){
  const x=60+Math.random()*(W-120);
  const isBomb=Math.random()<0.12;
  if(isBomb) bombs.push({x,y:H+20,vx:(Math.random()-0.5)*3,vy:-12-Math.random()*4,r:26,sliced:false});
  else fruits.push({x,y:H+20,emoji:FRUITS[Math.floor(Math.random()*FRUITS.length)],vx:(Math.random()-0.5)*4,vy:-13-Math.random()*5,r:26,sliced:false,rot:Math.random()*Math.PI*2});
}

function animate(){ if(!running)return; update(); draw(); animId=requestAnimationFrame(animate); }

function update(){
  spawnTimer++;
  if(spawnTimer%45===0) spawnFruit();
  // Fruits
  fruits=fruits.filter(f=>{ f.x+=f.vx; f.y+=f.vy; f.vy+=0.3; f.rot+=0.05;
    if(f.y>H+50&&!f.sliced){ lives--; document.getElementById('lives').textContent=lives; if(lives<=0){ endGame(); } return false; }
    return !f.sliced||f.y<H+50;
  });
  bombs=bombs.filter(b=>{ b.x+=b.vx; b.y+=b.vy; b.vy+=0.3; return b.y<H+50; });
  // Particles
  particles=particles.filter(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.2; p.life--; return p.life>0; });
  // Blade slice check
  if(blade.length>1){
    const last=blade[blade.length-1], prev=blade[blade.length-2];
    fruits.forEach(f=>{
      if(f.sliced) return;
      if(lineCircle(prev.x,prev.y,last.x,last.y,f.x,f.y,f.r)){
        f.sliced=true; score+=10; document.getElementById('pts').textContent=score;
        for(let i=0;i<6;i++) particles.push({x:f.x,y:f.y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:20,color:['#ff6600','#ff0055','#ffe600'][Math.floor(Math.random()*3)]});
      }
    });
    bombs.forEach(b=>{
      if(b.sliced) return;
      if(lineCircle(prev.x,prev.y,last.x,last.y,b.x,b.y,b.r)){
        b.sliced=true; lives--; document.getElementById('lives').textContent=lives;
        if(lives<=0) endGame();
      }
    });
  }
  if(blade.length>12) blade.shift();
}

function lineCircle(x1,y1,x2,y2,cx,cy,r){
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);
  if(!len) return false;
  const t=Math.max(0,Math.min(1,((cx-x1)*dx+(cy-y1)*dy)/(len*len)));
  return Math.hypot(cx-(x1+t*dx),cy-(y1+t*dy))<r;
}

function draw(){
  ctx.fillStyle='#0a0a1a'; ctx.fillRect(0,0,W,H);
  // Blade trail
  if(blade.length>1){
    ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.shadowColor='#fff'; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.moveTo(blade[0].x,blade[0].y);
    blade.forEach(p=>ctx.lineTo(p.x,p.y)); ctx.stroke();
    ctx.shadowBlur=0;
  }
  // Particles
  particles.forEach(p=>{ ctx.fillStyle=p.color; ctx.globalAlpha=p.life/20; ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2); ctx.fill(); });
  ctx.globalAlpha=1;
  // Fruits
  ctx.font='40px serif';
  fruits.forEach(f=>{ if(f.sliced)return; ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.rot); ctx.fillText(f.emoji,-20,-20); ctx.restore(); });
  // Bombs
  bombs.forEach(b=>{ if(b.sliced)return; ctx.fillText('💣',b.x-20,b.y+10); });
}

function endGame(){
  running=false; clearInterval(countdown); cancelAnimationFrame(animId);
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,H);
  document.getElementById('msg').textContent=`🏆 FIN — Puntos: ${score}`;
}

canvas.addEventListener('mousemove',e=>{ const r=canvas.getBoundingClientRect(); blade.push({x:e.clientX-r.left,y:e.clientY-r.top}); });
canvas.addEventListener('touchmove',e=>{ const r=canvas.getBoundingClientRect(); blade.push({x:e.touches[0].clientX-r.left,y:e.touches[0].clientY-r.top}); e.preventDefault(); },{passive:false});
document.getElementById('startBtn').addEventListener('click',init);
draw();
</script>
</body>
</html>
