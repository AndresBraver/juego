<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Slicer</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#050510; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:'Courier New',monospace; color:#fff; overflow:hidden; }
#ui { display:flex; gap:20px; margin-bottom:6px; font-size:12px; }
.sv { font-size:20px; font-weight:bold; color:#ff9900; text-shadow:0 0 10px #ff9900; }
.sl { font-size:9px; color:#555; letter-spacing:2px; text-align:center; }
canvas { display:block; border-radius:8px; box-shadow:0 0 30px rgba(255,150,0,0.3); cursor:crosshair; }
#msg { margin-top:6px; font-size:13px; color:#ff9900; min-height:16px; text-align:center; }
button { margin-top:6px; background:linear-gradient(135deg,#ff9900,#ff6600); color:#fff; border:none; padding:8px 22px; font-size:13px; font-family:'Courier New',monospace; font-weight:bold; border-radius:8px; cursor:pointer; }
</style>
</head>
<body>
<div id="ui">
  <div><div class="sv" id="pts">0</div><div class="sl">PUNTOS</div></div>
  <div><div class="sv" id="lives">❤️❤️❤️</div><div class="sl">VIDAS</div></div>
  <div><div class="sv" id="combo">x1</div><div class="sl">COMBO</div></div>
</div>
<canvas id="c" width="400" height="380"></canvas>
<div id="msg">Presiona INICIAR</div>
<button onclick="startGame()">INICIAR</button>
<script>
const C=document.getElementById('c'),ctx=C.getContext('2d');
const W=400,H=380;
const FRUITS=[
  {emoji:'🍎',color:'#ff2244',pts:10},
  {emoji:'🍊',color:'#ff8800',pts:10},
  {emoji:'🍋',color:'#ffe600',pts:15},
  {emoji:'🍇',color:'#cc00ff',pts:15},
  {emoji:'🍓',color:'#ff0055',pts:20},
  {emoji:'🍑',color:'#ffaa44',pts:20},
  {emoji:'🥝',color:'#39ff14',pts:25},
  {emoji:'🍉',color:'#ff4466',pts:25},
];
let fruits,particles,slices,score,lives,running,animId,frame,combo,comboTimer,spawnTimer,mouseX,mouseY,lastMX,lastMY,spawnInterval;

function startGame(){
  fruits=[];particles=[];slices=[];score=0;lives=3;running=true;frame=0;combo=1;comboTimer=0;spawnTimer=0;spawnInterval=80;
  mouseX=W/2;mouseY=H/2;lastMX=W/2;lastMY=H/2;
  document.getElementById('pts').textContent=0;
  document.getElementById('lives').textContent='❤️❤️❤️';
  document.getElementById('combo').textContent='x1';
  document.getElementById('msg').textContent='¡Corta las frutas!';
  cancelAnimationFrame(animId);animId=requestAnimationFrame(loop);
}

function spawnFruit(){
  const f=FRUITS[Math.floor(Math.random()*FRUITS.length)];
  const isBomb=Math.random()<0.12;
  fruits.push({
    x:50+Math.random()*(W-100),y:H+30,
    vx:(Math.random()-0.5)*3,vy:-(7+Math.random()*5),
    r:22,color:isBomb?'#444':f.color,
    emoji:isBomb?'💣':f.emoji,
    pts:isBomb?0:f.pts,isBomb,sliced:false,
    rot:Math.random()*Math.PI*2,rotV:(Math.random()-0.5)*0.15
  });
}

function addParticles(x,y,color,n=8){
  for(let i=0;i<n;i++)particles.push({
    x,y,vx:(Math.random()-0.5)*10,vy:(Math.random()-0.5)*10-2,
    life:20,color,size:Math.random()*5+2
  });
}

function checkSlice(){
  const dx=mouseX-lastMX,dy=mouseY-lastMY;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if(dist<5)return;
  fruits.forEach(f=>{
    if(f.sliced)return;
    const fd=Math.sqrt((mouseX-f.x)**2+(mouseY-f.y)**2);
    if(fd<f.r+5){
      f.sliced=true;
      if(f.isBomb){
        lives--;const lv=['❤️❤️❤️','❤️❤️🖤','❤️🖤🖤','🖤🖤🖤'];
        document.getElementById('lives').textContent=lv[3-lives]||'🖤🖤🖤';
        addParticles(f.x,f.y,'#ff0055',15);
        if(lives<=0){running=false;document.getElementById('msg').textContent=`💀 GAME OVER — ${score} pts`;try{localStorage.setItem('ugWin',Date.now());}catch(e){}}
      } else {
        const pts=f.pts*combo;score+=pts;combo=Math.min(combo+1,8);comboTimer=90;
        document.getElementById('pts').textContent=score;
        document.getElementById('combo').textContent='x'+combo;
        addParticles(f.x,f.y,f.color,10);
        slices.push({x1:lastMX,y1:lastMY,x2:mouseX,y2:mouseY,life:15,color:f.color});
      }
    }
  });
}

function loop(){
  animId=requestAnimationFrame(loop);frame++;
  if(running)update();
  draw();
}

function update(){
  checkSlice();
  spawnTimer++;spawnInterval=Math.max(40,80-Math.floor(score/100));
  if(spawnTimer>=spawnInterval){spawnTimer=0;spawnFruit();}
  if(comboTimer>0){comboTimer--;if(comboTimer===0){combo=1;document.getElementById('combo').textContent='x1';}}

  fruits=fruits.filter(f=>{
    f.x+=f.vx;f.y+=f.vy;f.vy+=0.18;f.rot+=f.rotV;
    if(!f.sliced&&f.y>H+50){
      if(!f.isBomb){
        lives--;const lv=['❤️❤️❤️','❤️❤️🖤','❤️🖤🖤','🖤🖤🖤'];
        document.getElementById('lives').textContent=lv[3-lives]||'🖤🖤🖤';
        if(lives<=0){running=false;document.getElementById('msg').textContent=`💀 GAME OVER — ${score} pts`;try{localStorage.setItem('ugWin',Date.now());}catch(e){}}
      }return false;
    }
    return f.y<H+60&&!f.sliced;
  });
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.life--;return p.life>0;});
  slices=slices.filter(s=>{s.life--;return s.life>0;});
  lastMX=mouseX;lastMY=mouseY;
}

function draw(){
  // Background
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#020208');bg.addColorStop(1,'#080818');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // Subtle grid
  ctx.strokeStyle='rgba(255,150,0,0.03)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // Slice trails
  slices.forEach(s=>{
    ctx.strokeStyle=`rgba(${hexRgb(s.color)},${s.life/15})`;
    ctx.lineWidth=3;ctx.shadowColor=s.color;ctx.shadowBlur=8;
    ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();
    ctx.shadowBlur=0;
  });

  // Particles
  particles.forEach(p=>{
    ctx.globalAlpha=p.life/20;ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*(p.life/20),0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;ctx.shadowBlur=0;

  // Fruits
  fruits.forEach(f=>{
    ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);
    // Glow
    ctx.shadowColor=f.color;ctx.shadowBlur=15;
    // Circle bg
    const g=ctx.createRadialGradient(-4,-4,2,0,0,f.r);
    g.addColorStop(0,'rgba(255,255,255,0.3)');g.addColorStop(1,f.color+'88');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,f.r,0,Math.PI*2);ctx.fill();
    // Emoji
    ctx.shadowBlur=0;ctx.font=`${f.r*1.5}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(f.emoji,0,2);
    ctx.restore();
  });

  // Cursor blade
  ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=2;
  ctx.shadowColor='#fff';ctx.shadowBlur=8;
  ctx.beginPath();ctx.moveTo(lastMX,lastMY);ctx.lineTo(mouseX,mouseY);ctx.stroke();
  ctx.shadowBlur=0;
}

function hexRgb(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

C.addEventListener('mousemove',e=>{const r=C.getBoundingClientRect();mouseX=e.clientX-r.left;mouseY=e.clientY-r.top;});
C.addEventListener('touchmove',e=>{const r=C.getBoundingClientRect();mouseX=e.touches[0].clientX-r.left;mouseY=e.touches[0].clientY-r.top;e.preventDefault();},{passive:false});
</script>
</body>
</html>
