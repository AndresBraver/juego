<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sword Fighter</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a1a; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:'Courier New',monospace; color:#fff; }
  h1 { color:#cc00ff; font-size:24px; margin-bottom:6px; text-shadow:0 0 15px #cc00ff; }
  #bars { display:flex; gap:20px; align-items:center; margin-bottom:8px; font-size:13px; }
  .bar { width:130px; height:14px; background:#1a1a3e; border-radius:7px; overflow:hidden; border:1px solid #333; }
  .fill { height:100%; border-radius:7px; transition:width 0.15s; }
  canvas { border:2px solid #cc00ff; box-shadow:0 0 20px rgba(204,0,255,0.3); border-radius:4px; }
  #msg { margin-top:10px; font-size:15px; color:#cc00ff; min-height:22px; text-align:center; }
  button { margin-top:8px; background:#cc00ff; color:#fff; border:none; padding:10px 28px; font-size:14px; font-family:'Courier New',monospace; font-weight:bold; border-radius:6px; cursor:pointer; }
  #hint { margin-top:6px; font-size:11px; color:#555; text-align:center; }
</style>
</head>
<body>
<h1>⚔️ SWORD FIGHTER</h1>
<div id="bars">
  <span>🧙 TÚ</span>
  <div class="bar"><div class="fill" id="php" style="width:100%;background:#00fff5"></div></div>
  <span id="pts" style="color:#ffe600">0pts</span>
  <div class="bar"><div class="fill" id="ehp" style="width:100%;background:#ff0055"></div></div>
  <span>👹 CPU</span>
</div>
<canvas id="c" width="480" height="280"></canvas>
<div id="msg">Presiona INICIAR</div>
<button onclick="startGame()">INICIAR</button>
<div id="hint">← → Mover | Z Atacar | X Bloquear | ↑ Saltar</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const W = 480, H = 280, FLOOR = 210;
const G = 0.5, SPD = 3.2, JMP = -11;

let p, e, score, running, animId, keys, particles, frame;

function startGame() {
  keys = {};
  p = { x:80, y:FLOOR, vy:0, hp:100, facing:1, atk:0, atkCd:0, block:false, flash:0, ground:true };
  e = { x:370, y:FLOOR, vy:0, hp:100, facing:-1, atk:0, atkCd:0, block:false, flash:0, ground:true };
  score = 0; particles = []; frame = 0; running = true;
  document.getElementById('pts').textContent = '0pts';
  document.getElementById('msg').textContent = '';
  updateBars();
  cancelAnimationFrame(animId);
  gameLoop();
}

function updateBars() {
  document.getElementById('php').style.width = Math.max(0,p.hp)+'%';
  document.getElementById('ehp').style.width = Math.max(0,e.hp)+'%';
  document.getElementById('php').style.background = p.hp>50?'#00fff5':p.hp>25?'#ffe600':'#ff0055';
}

function gameLoop() {
  if (!running) return;
  frame++;
  update();
  draw();
  animId = requestAnimationFrame(gameLoop);
}

function update() {
  // Cooldowns
  for (const ch of [p,e]) {
    ch.atkCd = Math.max(0, ch.atkCd-1);
    ch.atk = Math.max(0, ch.atk-1);
    ch.flash = Math.max(0, ch.flash-1);
  }

  // Player input
  p.block = !!(keys['x']||keys['X']);
  if (keys['ArrowLeft']) { p.x -= SPD; p.facing = -1; }
  if (keys['ArrowRight']) { p.x += SPD; p.facing = 1; }
  if ((keys['ArrowUp']||keys['w']) && p.ground) { p.vy = JMP; p.ground = false; }
  if ((keys['z']||keys['Z']) && p.atkCd===0) { p.atk=12; p.atkCd=24; }

  // Enemy AI - simple state machine
  const dist = p.x - e.x;
  e.facing = dist > 0 ? 1 : -1;
  if (frame % 3 === 0) {
    if (Math.abs(dist) > 80) e.x += e.facing * 2;
    else if (e.atkCd === 0) { e.atk = 12; e.atkCd = 38 + (Math.random()*20|0); }
    if (Math.random() < 0.004) e.block = true;
    else if (Math.random() < 0.01) e.block = false;
  }

  // Physics
  for (const ch of [p,e]) {
    ch.vy += G;
    ch.y += ch.vy;
    if (ch.y >= FLOOR) { ch.y = FLOOR; ch.vy = 0; ch.ground = true; }
    ch.x = Math.max(20, Math.min(W-20, ch.x));
  }

  // Hit detection
  hitCheck(p, e);
  hitCheck(e, p);

  // Particles
  particles = particles.filter(pt => { pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.25; pt.life--; return pt.life>0; });

  updateBars();

  if (p.hp <= 0) { running=false; document.getElementById('msg').textContent='💀 DERROTA — '+score+' pts'; }
  if (e.hp <= 0) { score+=50; document.getElementById('pts').textContent=score+'pts'; running=false; document.getElementById('msg').textContent='🏆 ¡VICTORIA! '+score+' pts'; if(window.ugWin)window.ugWin(); }
}

function hitCheck(atk, def) {
  if (atk.atk < 5) return;
  const sx = atk.x + atk.facing * 50;
  if (Math.abs(sx - def.x) < 34 && Math.abs(atk.y - def.y) < 55) {
    if (def.block && def.facing !== atk.facing) {
      spawnParticles(sx, atk.y-25, '#ffe600', 3);
    } else {
      def.hp -= 15;
      def.flash = 8;
      spawnParticles(def.x, def.y-35, '#ff0055', 5);
    }
    atk.atk = 0;
  }
}

function spawnParticles(x, y, color, n) {
  for (let i=0;i<n;i++) particles.push({x,y,vx:(Math.random()-0.5)*7,vy:-Math.random()*5,life:14,color});
}

function drawChar(ch, bodyColor, emoji) {
  ctx.save();
  ctx.translate(ch.x, ch.y);
  if (ch.flash>0 && ch.flash%2===0) ctx.globalAlpha=0.25;
  // Body
  ctx.fillStyle = bodyColor; ctx.shadowColor = bodyColor; ctx.shadowBlur = 8;
  ctx.fillRect(-15, -60, 30, 42);
  // Legs
  ctx.fillRect(-14, -18, 12, 18);
  ctx.fillRect(2, -18, 12, 18);
  ctx.shadowBlur=0; ctx.globalAlpha=1;
  // Head emoji
  ctx.font='22px serif'; ctx.fillText(emoji, -11, -64);
  // Sword
  if (ch.atk>0) {
    ctx.fillStyle='#ffe600'; ctx.shadowColor='#ffe600'; ctx.shadowBlur=14;
    ctx.fillRect(ch.facing>0 ? 14 : -66, -48, 52, 7);
    ctx.shadowBlur=0;
  } else {
    ctx.fillStyle='#aaa';
    ctx.fillRect(ch.facing>0 ? 14 : -44, -45, 30, 5);
  }
  // Shield
  if (ch.block) {
    ctx.fillStyle='rgba(0,255,245,0.35)'; ctx.shadowColor='#00fff5'; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(ch.facing*28, -38, 18, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }
  ctx.restore();
}

function draw() {
  ctx.fillStyle='#0a0a1a'; ctx.fillRect(0,0,W,H);
  // Floor
  ctx.fillStyle='#1a1a3e'; ctx.fillRect(0,FLOOR,W,H-FLOOR);
  ctx.fillStyle='#cc00ff'; ctx.shadowColor='#cc00ff'; ctx.shadowBlur=6;
  ctx.fillRect(0,FLOOR,W,3); ctx.shadowBlur=0;
  // Pillars
  [[100,140],[W/2-15,140],[W-130,140]].forEach(([x,h])=>{
    ctx.fillStyle='#0d0d2a'; ctx.fillRect(x,FLOOR-h,28,h);
    ctx.strokeStyle='#1a1a4a'; ctx.strokeRect(x,FLOOR-h,28,h);
  });
  // Particles
  particles.forEach(pt=>{
    ctx.fillStyle=pt.color; ctx.globalAlpha=pt.life/14;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,3.5,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
  drawChar(p,'#00fff5','🧙');
  drawChar(e,'#ff0055','👹');
}

document.addEventListener('keydown', ev=>{
  keys[ev.key]=true;
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(ev.key)) ev.preventDefault();
});
document.addEventListener('keyup', ev=>{ keys[ev.key]=false; });

// Touch zones: left third=move left, right third=move right, middle=attack, tap twice quick=block
c.addEventListener('touchstart', ev=>{
  if (!running) return;
  const r=c.getBoundingClientRect(), tx=ev.touches[0].clientX-r.left;
  if (tx<W/3) { keys['ArrowLeft']=true; keys['ArrowRight']=false; }
  else if (tx>W*2/3) { keys['ArrowRight']=true; keys['ArrowLeft']=false; }
  else { keys['z']=true; }
  ev.preventDefault();
},{passive:false});
c.addEventListener('touchend', ev=>{
  keys['ArrowLeft']=false; keys['ArrowRight']=false; keys['z']=false;
  ev.preventDefault();
},{passive:false});

draw();
</script>
</body>
</html>
