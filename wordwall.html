<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscar Tema</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a1a; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:'Courier New',monospace; color:#fff; padding:20px; }
  h1 { color:#00fff5; font-size:22px; margin-bottom:8px; text-shadow:0 0 15px #00fff5; letter-spacing:3px; text-align:center; }
  p { color:#666; font-size:13px; margin-bottom:30px; text-align:center; }
  .search-box { display:flex; gap:10px; width:100%; max-width:480px; }
  input { flex:1; background:#0d0d22; border:2px solid #1e1e4a; border-radius:10px; padding:14px 18px; color:#fff; font-family:'Courier New',monospace; font-size:16px; outline:none; transition:border-color .2s; }
  input:focus { border-color:#00fff5; box-shadow:0 0 15px rgba(0,255,245,.15); }
  input::placeholder { color:#444; }
  button { background:linear-gradient(135deg,#00fff5,#00a8ff); border:none; color:#000; padding:14px 22px; border-radius:10px; cursor:pointer; font-family:'Courier New',monospace; font-size:14px; font-weight:bold; white-space:nowrap; transition:all .2s; }
  button:hover { box-shadow:0 0 20px rgba(0,255,245,.4); transform:translateY(-1px); }
  .suggestions { display:flex; flex-wrap:wrap; gap:8px; margin-top:20px; max-width:480px; justify-content:center; }
  .chip { background:#0d0d22; border:1px solid #1e1e4a; border-radius:20px; padding:6px 14px; font-size:12px; color:#888; cursor:pointer; transition:all .2s; }
  .chip:hover { border-color:#00fff5; color:#00fff5; }
  .icon { font-size:60px; margin-bottom:16px; }
</style>
</head>
<body>
<div class="icon">📚</div>
<h1>BUSCAR TEMA</h1>
<p>Escribe un tema y te llevamos a Google</p>
<div class="search-box">
  <input type="text" id="query" placeholder="ej. sustantivos, verbos, fracciones..." autofocus>
  <button onclick="buscar()">BUSCAR →</button>
</div>
<div class="suggestions">
  <div class="chip" onclick="buscarTema('sustantivos')">sustantivos</div>
  <div class="chip" onclick="buscarTema('adjetivos')">adjetivos</div>
  <div class="chip" onclick="buscarTema('verbos')">verbos</div>
  <div class="chip" onclick="buscarTema('fracciones')">fracciones</div>
  <div class="chip" onclick="buscarTema('multiplicación')">multiplicación</div>
  <div class="chip" onclick="buscarTema('animales')">animales</div>
  <div class="chip" onclick="buscarTema('colores')">colores</div>
  <div class="chip" onclick="buscarTema('sinónimos')">sinónimos</div>
  <div class="chip" onclick="buscarTema('antónimos')">antónimos</div>
</div>
<script>
function buscar() {
  const q = document.getElementById('query').value.trim();
  if (!q) return;
  window.open('https://www.google.com/search?q=' + encodeURIComponent(q), '_blank');
}
function buscarTema(tema) {
  window.open('https://www.google.com/search?q=' + encodeURIComponent(tema), '_blank');
}
document.getElementById('query').addEventListener('keydown', e => {
  if (e.key === 'Enter') buscar();
});
</script>
</body>
</html>
