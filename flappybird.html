<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1a0a2e; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; overflow:hidden; font-family:'Courier New',monospace; }
canvas { display:block; border-radius:8px; box-shadow:0 0 40px rgba(255,150,0,0.4); }
#ui { position:absolute; top:10px; left:50%; transform:translateX(-50%); color:#fff; font-size:13px; text-align:center; pointer-events:none; }
</style>
</head>
<body>
<div id="ui"></div>
<canvas id="c"></canvas>
<script>
const C = document.getElementById('c');
const ctx = C.getContext('2d');
const W = 360, H = 560;
C.width = W; C.height = H;

const GAP = 145, PIPE_W = 56, SPEED = 2.4;
const GRAVITY = 0.32, JUMP = -7;
const BIRD_X = 80;

let bird, pipes, score, state, raf, frame, clouds, stars, pipeTimer = 0;

// Particle system
let particles = [];

function addParticles(x, y, color) {
  for(let i=0;i<8;i++){
    particles.push({
      x,y,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5,
      life:30,maxLife:30,color,size:Math.random()*4+2
    });
  }
}

function reset() {
  bird = { y:H/2, vy:0, rot:0, flap:0 };
  pipes = []; score = 0; frame = 0; particles = [];
  clouds = Array.from({length:4},(_,i)=>({x:i*120+50,y:60+Math.random()*80,w:80+Math.random()*60,speed:0.4+Math.random()*0.3}));
  stars = Array.from({length:40},()=>({x:Math.random()*W,y:Math.random()*H*0.6,r:Math.random()*1.5+0.5,twinkle:Math.random()*Math.PI*2}));
  state = 'idle'; pipeTimer = 0;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(tick);
}

function flap() {
  if(state==='idle'){state='playing';}
  else if(state==='dead'){reset();return;}
  if(state==='playing'){ bird.vy=JUMP; bird.flap=8; addParticles(BIRD_X,bird.y,'rgba(255,200,0,0.8)'); }
}

function tick() {
  raf = requestAnimationFrame(tick);
  frame++;
  if(state==='playing') update();
  draw();
}

function update() {
  bird.vy += GRAVITY;
  bird.y += bird.vy;
  bird.rot = Math.min(Math.max(bird.vy*0.07,-0.5),1.2);
  if(bird.flap>0) bird.flap--;

  // Ceiling
  if(bird.y-14<0){bird.y=14;bird.vy=0;}
  // Floor
  if(bird.y+14>H-60){die();return;}

  // Pipes
  pipeTimer++;
  if(pipeTimer>100){
    pipeTimer=0;
    const top = 80+Math.random()*(H-GAP-140);
    pipes.push({x:W+10,top,bottom:top+GAP,scored:false,color:`hsl(${Math.random()*60+100},70%,40%)`});
  }

  for(let p of pipes){
    p.x -= SPEED;
    if(!p.scored && p.x+PIPE_W < BIRD_X){
      p.scored=true; score++;
      if(score%10===0) try{localStorage.setItem('ugWin',Date.now());}catch(e){}
    }
    // Collision
    if(BIRD_X+12>p.x && BIRD_X-12<p.x+PIPE_W){
      if(bird.y-14<p.top || bird.y+14>p.bottom){die();return;}
    }
  }
  pipes = pipes.filter(p=>p.x>-PIPE_W-10);

  // Particles
  particles = particles.filter(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.life--;
    return p.life>0;
  });

  // Clouds move
  clouds.forEach(c=>{c.x-=c.speed; if(c.x+c.w<0)c.x=W+20;});
  stars.forEach(s=>{s.twinkle+=0.05;});
}

function die() {
  state='dead';
  addParticles(BIRD_X,bird.y,'rgba(255,80,80,0.9)');
  addParticles(BIRD_X,bird.y,'rgba(255,200,0,0.9)');
}

// Draw gradient sky
function drawSky() {
  const grad = ctx.createLinearGradient(0,0,0,H);
  if(state==='dead'){
    grad.addColorStop(0,'#1a0505');grad.addColorStop(0.6,'#300a0a');grad.addColorStop(1,'#0a0505');
  } else {
    grad.addColorStop(0,'#0a0520');grad.addColorStop(0.4,'#1a1060');grad.addColorStop(0.7,'#2d1b8a');grad.addColorStop(1,'#1a0a40');
  }
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
}

function drawStars() {
  stars.forEach(s=>{
    const alpha = 0.4+Math.sin(s.twinkle)*0.3;
    ctx.fillStyle=`rgba(255,255,255,${alpha})`;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  });
}

function drawClouds() {
  clouds.forEach(c=>{
    ctx.fillStyle='rgba(255,255,255,0.08)';
    ctx.beginPath(); ctx.ellipse(c.x,c.y,c.w/2,18,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(c.x-20,c.y+8,c.w/3,14,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(c.x+25,c.y+5,c.w/3.5,12,0,0,Math.PI*2); ctx.fill();
  });
}

function drawPipes() {
  pipes.forEach(p=>{
    // Top pipe
    const g1 = ctx.createLinearGradient(p.x,0,p.x+PIPE_W,0);
    g1.addColorStop(0,p.color); g1.addColorStop(0.4,'#7fff7f'); g1.addColorStop(1,p.color);
    ctx.fillStyle=g1;
    ctx.beginPath(); ctx.roundRect(p.x-2,0,PIPE_W+4,p.top,4); ctx.fill();
    // Cap
    const capG = ctx.createLinearGradient(p.x-6,0,p.x+PIPE_W+6,0);
    capG.addColorStop(0,p.color); capG.addColorStop(0.4,'#aaffaa'); capG.addColorStop(1,p.color);
    ctx.fillStyle=capG;
    ctx.beginPath(); ctx.roundRect(p.x-6,p.top-22,PIPE_W+12,22,6); ctx.fill();
    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.roundRect(p.x+PIPE_W-10,0,10,p.top,0); ctx.fill();

    // Bottom pipe
    ctx.fillStyle=g1;
    ctx.beginPath(); ctx.roundRect(p.x-2,p.bottom,PIPE_W+4,H-p.bottom,4); ctx.fill();
    ctx.fillStyle=capG;
    ctx.beginPath(); ctx.roundRect(p.x-6,p.bottom,PIPE_W+12,22,6); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.roundRect(p.x+PIPE_W-10,p.bottom,10,H-p.bottom,0); ctx.fill();

    // Glow
    ctx.shadowColor='rgba(57,255,20,0.3)'; ctx.shadowBlur=8;
    ctx.strokeStyle='rgba(57,255,20,0.4)'; ctx.lineWidth=1;
    ctx.strokeRect(p.x,0,PIPE_W,p.top);
    ctx.strokeRect(p.x,p.bottom,PIPE_W,H-p.bottom);
    ctx.shadowBlur=0;
  });
}

function drawGround() {
  // Ground gradient
  const g = ctx.createLinearGradient(0,H-60,0,H);
  g.addColorStop(0,'#1a3a1a'); g.addColorStop(1,'#0a1a0a');
  ctx.fillStyle=g; ctx.fillRect(0,H-60,W,60);
  // Grass line
  ctx.fillStyle='#39ff14'; ctx.shadowColor='#39ff14'; ctx.shadowBlur=6;
  ctx.fillRect(0,H-60,W,4); ctx.shadowBlur=0;
  // Grass tufts
  ctx.fillStyle='#2aee05';
  for(let i=0;i<W;i+=20){
    const h=3+Math.sin(i*0.3+frame*0.02)*2;
    ctx.fillRect(i,H-60,3,h);
  }
}

function drawBird() {
  ctx.save(); ctx.translate(BIRD_X, bird.y); ctx.rotate(bird.rot);
  // Body glow
  ctx.shadowColor='rgba(255,200,0,0.6)'; ctx.shadowBlur=15;
  // Body
  const bodyG = ctx.createRadialGradient(-2,-3,2,0,0,16);
  bodyG.addColorStop(0,'#ffe066'); bodyG.addColorStop(0.6,'#ffaa00'); bodyG.addColorStop(1,'#ff6600');
  ctx.fillStyle=bodyG;
  ctx.beginPath(); ctx.ellipse(0,0,16,14,0,0,Math.PI*2); ctx.fill();
  // Wing
  const wingY = bird.flap>0 ? -8 : 4;
  ctx.fillStyle='rgba(255,180,0,0.9)';
  ctx.beginPath(); ctx.ellipse(-4,wingY,10,6,bird.flap>0?-0.5:0.3,0,Math.PI*2); ctx.fill();
  // Eye
  ctx.fillStyle='#fff'; ctx.shadowBlur=0;
  ctx.beginPath(); ctx.arc(6,-3,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#222';
  ctx.beginPath(); ctx.arc(7,-3,2.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(8,-4,1,0,Math.PI*2); ctx.fill();
  // Beak
  ctx.fillStyle='#ff8800';
  ctx.beginPath(); ctx.moveTo(13,0); ctx.lineTo(20,2); ctx.lineTo(13,5); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawParticles() {
  particles.forEach(p=>{
    const alpha = p.life/p.maxLife;
    ctx.globalAlpha=alpha;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(alpha),0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
}

function drawHUD() {
  // Score
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.roundRect(W/2-40,12,80,36,18); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 26px Courier New'; ctx.textAlign='center';
  ctx.shadowColor='rgba(255,200,0,0.8)'; ctx.shadowBlur=10;
  ctx.fillText(score,W/2,38);
  ctx.shadowBlur=0; ctx.textAlign='left';
}

function draw() {
  drawSky();
  drawStars();
  drawClouds();
  drawPipes();
  drawParticles();
  drawGround();
  if(state!=='idle') drawBird();

  // Overlays
  if(state==='idle'){
    drawBird();
    ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffe600'; ctx.font='bold 32px Courier New'; ctx.textAlign='center';
    ctx.shadowColor='#ffe600'; ctx.shadowBlur=20;
    ctx.fillText('FLAPPY BIRD',W/2,H/2-30);
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,0.8)'; ctx.font='15px Courier New';
    ctx.fillText('Toca para volar 🐦',W/2,H/2+10);
    ctx.textAlign='left';
  }
  if(state==='dead'){
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ff5555'; ctx.font='bold 30px Courier New'; ctx.textAlign='center';
    ctx.shadowColor='#ff0000'; ctx.shadowBlur=15;
    ctx.fillText('GAME OVER',W/2,H/2-40);
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff'; ctx.font='20px Courier New';
    ctx.fillText('Puntos: '+score,W/2,H/2);
    ctx.fillStyle='rgba(255,230,0,0.9)'; ctx.font='13px Courier New';
    ctx.fillText('Toca para reintentar',W/2,H/2+40);
    ctx.textAlign='left';
    drawParticles();
  }
  if(state==='playing') drawHUD();
}

C.addEventListener('click',flap);
C.addEventListener('touchstart',e=>{flap();e.preventDefault();},{passive:false});
document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowUp'){flap();e.preventDefault();}});

reset();
</script>
</body>
</html>
