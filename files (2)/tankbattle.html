<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tank Battle</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a1a; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:'Courier New',monospace; color:#fff; }
  h1 { color:#ffe600; font-size:24px; margin-bottom:8px; text-shadow:0 0 15px #ffe600; letter-spacing:3px; }
  #info { font-size:15px; color:#aaa; margin-bottom:8px; display:flex; gap:20px; }
  canvas { border:2px solid #ffe600; box-shadow:0 0 20px rgba(255,230,0,0.3); border-radius:4px; }
  #msg { margin-top:10px; font-size:15px; color:#ffe600; min-height:20px; text-align:center; }
  #startBtn { margin-top:8px; background:#ffe600; color:#000; border:none; padding:10px 28px; font-size:14px; font-family:'Courier New',monospace; font-weight:bold; border-radius:6px; cursor:pointer; letter-spacing:2px; }
  #hint { margin-top:6px; font-size:11px; color:#555; text-align:center; }
</style>
</head>
<body>
<h1>🗡️ TANK BATTLE</h1>
<div id="info"><span>❤️ VIDAS: <b id="lives">3</b></span><span>PUNTOS: <b id="pts">0</b></span><span>NIVEL: <b id="lvl">1</b></span></div>
<canvas id="c" width="480" height="400"></canvas>
<div id="msg">Presiona INICIO</div>
<button id="startBtn">INICIAR</button>
<div id="hint">WASD o Flechas = Mover | ESPACIO = Disparar</div>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const W=480,H=400;
let player,enemies,bullets,eBullets,score,lives,level,running,animId,keys={},eShootTimer=0,eSpawnTimer=0;

function init(){
  player={x:W/2,y:H-60,w:30,h=30,angle:-Math.PI/2,speed:3};
  enemies=[]; bullets=[]; eBullets=[];
  score=0; lives=3; level=1;
  document.getElementById('pts').textContent=0;
  document.getElementById('lives').textContent=3;
  document.getElementById('lvl').textContent=1;
  document.getElementById('msg').textContent='';
  running=true; eShootTimer=0; eSpawnTimer=0;
  spawnEnemies(3);
  cancelAnimationFrame(animId);
  animate();
}

function spawnEnemies(n){
  for(let i=0;i<n;i++){
    enemies.push({x:50+Math.random()*(W-100),y:30+Math.random()*150,w:26,h=26,angle:Math.PI/2,hp:1});
  }
}

function animate(){ if(!running)return; update(); draw(); animId=requestAnimationFrame(animate); }

let shootCooldown=0;
function update(){
  shootCooldown=Math.max(0,shootCooldown-1);
  // Player move
  if(keys['ArrowUp']||keys['w']){ player.x+=Math.cos(player.angle)*player.speed; player.y+=Math.sin(player.angle)*player.speed; }
  if(keys['ArrowDown']||keys['s']){ player.x-=Math.cos(player.angle)*player.speed; player.y-=Math.sin(player.angle)*player.speed; }
  if(keys['ArrowLeft']||keys['a']) player.angle-=0.06;
  if(keys['ArrowRight']||keys['d']) player.angle+=0.06;
  player.x=Math.max(15,Math.min(W-15,player.x)); player.y=Math.max(15,Math.min(H-15,player.y));
  // Shoot
  if((keys[' ']||keys['Enter'])&&shootCooldown===0){ bullets.push({x:player.x,y:player.y,vx:Math.cos(player.angle)*8,vy:Math.sin(player.angle)*8,player:true}); shootCooldown=15; }
  // Move bullets
  bullets=bullets.filter(b=>{ b.x+=b.vx; b.y+=b.vy; return b.x>0&&b.x<W&&b.y>0&&b.y<H; });
  eBullets=eBullets.filter(b=>{ b.x+=b.vx; b.y+=b.vy; return b.x>0&&b.x<W&&b.y>0&&b.y<H; });
  // Enemy AI
  eShootTimer++;
  enemies.forEach(e=>{
    const dx=player.x-e.x, dy=player.y-e.y;
    e.angle=Math.atan2(dy,dx);
    e.x+=Math.cos(e.angle)*0.8; e.y+=Math.sin(e.angle)*0.8;
    if(eShootTimer%90===0) eBullets.push({x:e.x,y:e.y,vx:Math.cos(e.angle)*5,vy:Math.sin(e.angle)*5});
  });
  if(eShootTimer>90) eShootTimer=0;
  // Collisions player bullets vs enemies
  for(let b of bullets){
    for(let e of enemies){
      if(Math.hypot(b.x-e.x,b.y-e.y)<18){ e.hp--; b.x=-99; if(e.hp<=0){ score+=10; document.getElementById('pts').textContent=score; } }
    }
  }
  enemies=enemies.filter(e=>e.hp>0);
  // Enemy bullets vs player
  for(let b of eBullets){
    if(Math.hypot(b.x-player.x,b.y-player.y)<18){ lives--; b.x=-99; document.getElementById('lives').textContent=lives; if(lives<=0){running=false;document.getElementById('msg').textContent='💀 GAME OVER — Puntos: '+score;} }
  }
  // Next level
  if(enemies.length===0){ level++; document.getElementById('lvl').textContent=level; spawnEnemies(2+level); }
}

function drawTank(x,y,angle,color){
  ctx.save(); ctx.translate(x,y); ctx.rotate(angle);
  ctx.fillStyle=color; ctx.shadowColor=color; ctx.shadowBlur=8;
  ctx.fillRect(-13,-13,26,26);
  ctx.fillStyle='#fff'; ctx.shadowBlur=0;
  ctx.fillRect(-3,-16,6,10);
  ctx.restore();
}

function draw(){
  ctx.fillStyle='#0a0a1a'; ctx.fillRect(0,0,W,H);
  // Grid
  ctx.strokeStyle='rgba(255,230,0,0.04)'; ctx.lineWidth=1;
  for(let i=0;i<W;i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,H); ctx.stroke(); }
  for(let i=0;i<H;i+=40) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(W,i); ctx.stroke(); }
  // Player
  drawTank(player.x,player.y,player.angle,'#00fff5');
  // Enemies
  enemies.forEach(e=>drawTank(e.x,e.y,e.angle,'#ff0055'));
  // Bullets
  ctx.fillStyle='#ffe600'; ctx.shadowColor='#ffe600'; ctx.shadowBlur=8;
  bullets.forEach(b=>{ ctx.beginPath(); ctx.arc(b.x,b.y,4,0,Math.PI*2); ctx.fill(); });
  ctx.fillStyle='#ff6600'; ctx.shadowColor='#ff6600';
  eBullets.forEach(b=>{ ctx.beginPath(); ctx.arc(b.x,b.y,4,0,Math.PI*2); ctx.fill(); });
  ctx.shadowBlur=0;
}

document.addEventListener('keydown',e=>{ keys[e.key]=true; if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault(); });
document.addEventListener('keyup',e=>{ keys[e.key]=false; });
document.getElementById('startBtn').addEventListener('click',init);
draw();
</script>
</body>
</html>
