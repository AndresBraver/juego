<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a1a; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:'Courier New',monospace; color:#fff; }
  h1 { color:#ff9900; font-size:26px; margin-bottom:8px; text-shadow:0 0 15px #ff9900; letter-spacing:3px; }
  canvas { border:2px solid #ff9900; box-shadow:0 0 20px rgba(255,153,0,0.3); border-radius:4px; cursor:pointer; }
  #msg { margin-top:12px; font-size:16px; color:#ff9900; min-height:22px; text-align:center; }
</style>
</head>
<body>
<h1>🌊 FLAPPY BIRD</h1>
<canvas id="c" width="360" height="480"></canvas>
<div id="msg">Toca o presiona ESPACIO para volar</div>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const W=360,H=480,GAP=140,PIPE_W=52,SPEED=2.5,GRAVITY=0.35,JUMP=-7;
let bird,pipes,score,state,animId,frame=0;

function init(){
  bird={x:80,y:H/2,vy:0,r:18};
  pipes=[]; score=0; state='playing'; frame=0;
  document.getElementById('msg').textContent='';
  makePipe();
  cancelAnimationFrame(animId);
  animate();
}

function makePipe(){
  const top=60+Math.random()*(H-GAP-120);
  pipes.push({x:W+10,top,bottom:top+GAP});
}

function animate(){ update(); draw(); animId=requestAnimationFrame(animate); }

function update(){
  if(state!=='playing') return;
  frame++;
  bird.vy+=GRAVITY; bird.y+=bird.vy;
  if(bird.y-bird.r<0||bird.y+bird.r>H){ gameOver(); return; }
  pipes.forEach(p=>p.x-=SPEED);
  pipes=pipes.filter(p=>p.x>-PIPE_W);
  if(pipes.length===0||pipes[pipes.length-1].x<W-200) makePipe();
  for(let p of pipes){
    if(bird.x+bird.r>p.x&&bird.x-bird.r<p.x+PIPE_W&&(bird.y-bird.r<p.top||bird.y+bird.r>p.bottom)){ gameOver(); return; }
    if(!p.scored&&bird.x>p.x+PIPE_W){ p.scored=true; score++; }
  }
}

function draw(){
  // Sky gradient
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0a1628'); grad.addColorStop(1,'#0a2a1a');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
  // Pipes
  pipes.forEach(p=>{
    ctx.fillStyle='#39ff14'; ctx.shadowColor='#39ff14'; ctx.shadowBlur=8;
    ctx.fillRect(p.x,0,PIPE_W,p.top);
    ctx.fillRect(p.x,p.bottom,PIPE_W,H-p.bottom);
    // Caps
    ctx.fillRect(p.x-4,p.top-18,PIPE_W+8,18);
    ctx.fillRect(p.x-4,p.bottom,PIPE_W+8,18);
    ctx.shadowBlur=0;
  });
  // Bird
  ctx.font='32px serif';
  ctx.save(); ctx.translate(bird.x,bird.y);
  ctx.rotate(Math.min(Math.max(bird.vy*0.05,-0.5),0.8));
  ctx.fillText('🐦',- bird.r,-bird.r);
  ctx.restore();
  // Score
  ctx.fillStyle='#fff'; ctx.font='bold 28px Courier New'; ctx.textAlign='center';
  ctx.shadowColor='#000'; ctx.shadowBlur=4;
  ctx.fillText(score,W/2,50);
  ctx.shadowBlur=0; ctx.textAlign='left';
  if(state==='dead'){
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ff0055'; ctx.font='bold 32px Courier New'; ctx.textAlign='center';
    ctx.fillText('GAME OVER',W/2,H/2-20);
    ctx.fillStyle='#fff'; ctx.font='20px Courier New';
    ctx.fillText('Puntos: '+score,W/2,H/2+20);
    ctx.fillText('Toca para reiniciar',W/2,H/2+55);
    ctx.textAlign='left';
  }
  if(state==='start'){
    ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ff9900'; ctx.font='bold 28px Courier New'; ctx.textAlign='center';
    ctx.fillText('FLAPPY BIRD',W/2,H/2-20);
    ctx.fillStyle='#fff'; ctx.font='18px Courier New';
    ctx.fillText('Toca para empezar',W/2,H/2+20);
    ctx.textAlign='left';
  }
}

function gameOver(){ state='dead'; }
function flap(){ if(state==='playing') bird.vy=JUMP; else if(state==='dead'||state==='start') init(); }

document.addEventListener('keydown',e=>{ if(e.key===' '||e.key==='ArrowUp'){ flap(); e.preventDefault(); } });
canvas.addEventListener('click',flap);
canvas.addEventListener('touchstart',e=>{ flap(); e.preventDefault(); },{passive:false});

state='start';
draw();
</script>
</body>
</html>
