<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Courier New', monospace; color: #fff; }
  h1 { color: #39ff14; font-size: 28px; margin-bottom: 10px; text-shadow: 0 0 15px #39ff14; letter-spacing: 4px; }
  #score { font-size: 18px; color: #aaa; margin-bottom: 16px; }
  canvas { border: 2px solid #39ff14; box-shadow: 0 0 20px rgba(57,255,20,0.4); border-radius: 4px; }
  #msg { margin-top: 16px; font-size: 16px; color: #39ff14; min-height: 24px; }
  #startBtn { margin-top: 12px; background: #39ff14; color: #000; border: none; padding: 10px 28px; font-size: 14px; font-family: 'Courier New', monospace; font-weight: bold; border-radius: 6px; cursor: pointer; letter-spacing: 2px; }
  #startBtn:hover { background: #00ff00; }
</style>
</head>
<body>
<h1>🐍 SNAKE</h1>
<div id="score">PUNTOS: <span id="pts">0</span></div>
<canvas id="c" width="400" height="400"></canvas>
<div id="msg">Presiona INICIO para jugar</div>
<button id="startBtn">INICIAR</button>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const CELL = 20, COLS = 20, ROWS = 20;
let snake, dir, food, score, running, loop;

function init() {
  snake = [{x:10, y:10}, {x:9, y:10}, {x:8, y:10}];
  dir = {x:1, y:0};
  score = 0;
  document.getElementById('pts').textContent = 0;
  placeFood();
  running = true;
  document.getElementById('msg').textContent = '';
  clearInterval(loop);
  loop = setInterval(tick, 120);
}

function placeFood() {
  do {
    food = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)};
  } while (snake.some(s => s.x===food.x && s.y===food.y));
}

function tick() {
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)) {
    clearInterval(loop); running = false;
    document.getElementById('msg').textContent = '💀 GAME OVER — Puntos: ' + score;
    return;
  }
  snake.unshift(head);
  if (head.x===food.x && head.y===food.y) {
    score += 10;
    document.getElementById('pts').textContent = score; if(score===100||score===200||score===300)try{localStorage.setItem('ugWin',Date.now());}catch(e){}
    placeFood();
  } else { snake.pop(); }
  draw();
}

function draw() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  // Grid
  ctx.strokeStyle = 'rgba(57,255,20,0.05)';
  for(let i=0;i<COLS;i++) { ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,canvas.height); ctx.stroke(); }
  for(let i=0;i<ROWS;i++) { ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(canvas.width,i*CELL); ctx.stroke(); }
  // Food
  ctx.fillStyle = '#ff0055';
  ctx.shadowColor = '#ff0055';
  ctx.shadowBlur = 12;
  ctx.fillRect(food.x*CELL+2, food.y*CELL+2, CELL-4, CELL-4);
  ctx.shadowBlur = 0;
  // Snake
  snake.forEach((s,i) => {
    ctx.fillStyle = i===0 ? '#ffffff' : '#39ff14';
    ctx.shadowColor = '#39ff14';
    ctx.shadowBlur = i===0 ? 0 : 6;
    ctx.fillRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2);
  });
  ctx.shadowBlur = 0;
}

document.addEventListener('keydown', e => {
  if(!running) return;
  if(e.key==='ArrowUp'&&dir.y===0) dir={x:0,y:-1};
  if(e.key==='ArrowDown'&&dir.y===0) dir={x:0,y:1};
  if(e.key==='ArrowLeft'&&dir.x===0) dir={x:-1,y:0};
  if(e.key==='ArrowRight'&&dir.x===0) dir={x:1,y:0};
});

document.getElementById('startBtn').addEventListener('click', init);

// Touch controls
let tx, ty;
canvas.addEventListener('touchstart', e => { tx=e.touches[0].clientX; ty=e.touches[0].clientY; e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchend', e => {
  if(!running) return;
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)) { if(dx>0&&dir.x===0) dir={x:1,y:0}; else if(dx<0&&dir.x===0) dir={x:-1,y:0}; }
  else { if(dy>0&&dir.y===0) dir={x:0,y:1}; else if(dy<0&&dir.y===0) dir={x:0,y:-1}; }
}, {passive:false});

draw();
</script>
</body>
</html>
